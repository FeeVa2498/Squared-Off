    const esc = (v) => {
      v = v === undefined || v === null ? '' : String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    return [head.join(',')].concat(rows.map((r) => head.map((h) => esc(r[h])).join(','))).join('\n') + '\n';
  };

  const num = (v, d) => {
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? d : n;
  };
  const bool = (v) => /^(true|1|yes|x)$/i.test(String(v).trim());
  function range(s) {
    s = String(s || '').trim();
    if (!s || s === '0') return null;
    const m = s.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) return [+m[1], +m[2]];
    const n = parseInt(s, 10);
    return isNaN(n) || n <= 0 ? null : [1, n];
  }
  SO.range = range;

  function parseProps(s) {
    const tags = new Set(), kv = {};
    String(s || '').split('|').forEach((t) => {
      t = t.trim();
      if (!t) return;
      const i = t.indexOf('=');
      if (i > 0) kv[t.slice(0, i).trim()] = t.slice(i + 1).trim();
      else {
        tags.add(t);
        t.split('_').forEach((w) => w && tags.add(w));
      }
    });
    return { tags, kv };
  }

  // Vel=vx:vy@a-b;vx:vy@a-b  (vx tính theo hướng mặt, vy dương = bay lên)
  function parseVel(s) {
    if (!s) return [];
    return s.split(';').map((seg) => {
      const m = seg.trim().match(/^(-?[\d.]+):(-?[\d.]+)@(\d+)-(\d+)$/);
      if (!m) return null;
      return { vx: +m[1], vy: +m[2], a: +m[3], b: +m[4] };
    }).filter(Boolean);
  }

  const MOTIONS = {
    '236': [[2], [3], [6]],
    '214': [[2], [1], [4]],
    '623': [[6], [2], [3]],
    '421': [[4], [2], [1]],
    '41236': [[4], [1, 1], [2], [3, 1], [6]],
    '63214': [[6], [3, 1], [2], [1, 1], [4]],
    '236236': [[2], [3, 1], [6], [2], [3, 1], [6]],
    '214214': [[2], [1, 1], [4], [2], [1, 1], [4]],
    '632146': [[6], [3, 1], [2], [1, 1], [4], [6]],
  };
  // [dir, optional]
  SO.MOTIONS = MOTIONS;
  SO.motionWindow = (m) => (m.length <= 3 ? 16 : m.length <= 5 ? 24 : 32);

  function normMove(r) {
    const m = {};
    m.raw = r;
    m.id = r.Move_ID;
    m.char = r.Character;
    m.input = r.Input || '';
    m.stance = r.Stance || '';
    m.name = r.Name || m.id;
    m.type = r.Type || 'Normal';
    m.dmg = num(r.Damage, 0);
    m.chip = num(r.Chip_Damage, 0);
    m.su = Math.max(0, Math.round(num(r.Startup, 1)));
    m.act = Math.max(0, Math.round(num(r.Active, 0)));
    m.rec = Math.max(0, Math.round(num(r.Recovery, 0)));
    m.ob = Math.round(num(r.On_Block, 0));
    m.oh = Math.round(num(r.On_Hit, 0));
    m.unt = Math.round(num(r.Untech, 0));
    m.hits = Math.max(1, Math.round(num(r.Hits, 1)));
    m.pr = num(r.Proration_Rate, 1);
    m.kbx = num(r.Knockback_X, 0);
    m.kby = num(r.Knockback_Y, 0);
    m.kbt = r.Knockback_Type || 'Normal';
    m.blk = r.Block_Type || 'Mid';
    m.sc = bool(r.Special_Cancellable);
    m.suc = bool(r.Super_Cancellable);
    m.jc = bool(r.Jump_Cancellable);
    m.dc = bool(r.Dash_Cancellable);
    m.invType = r.Invincible_Type || 'None';
    m.inv = m.invType === 'None' ? null : range(r.Invincible_Frames);
    m.armor = Math.round(num(r.Armor_Hits, 0));
    m.hsa = Math.round(num(r.Hitstop_Attacker, 0));
    m.hsd = Math.round(num(r.Hitstop_Defender, 0));
    m.hb = { x: num(r.Hitbox_X, 0), y: num(r.Hitbox_Y, 0), w: num(r.Hitbox_W, 0), h: num(r.Hitbox_H, 0) };
    m.spd = num(r.Projectile_Speed, 0);
    m.airOK = bool(r.Air_OK);
    m.cost = num(r.Cost, 0);
    m.gain = num(r.Meter_Gain, 0);
    const p = parseProps(r.Properties);
    m.tags = p.tags;
    m.kv = p.kv;
    m.placeholder = p.tags.has('PLACEHOLDER');
    m.vel = parseVel(p.kv.Vel);
    m.isProj = !!p.kv.Proj;
    // Fx=fire,slash:#4aa3d9 -> [{name, color}]
    m.fx = String(p.kv.Fx || '').split(',').map((t) => t.trim()).filter(Boolean).map((t) => { const [name, color] = t.split(':'); return { name, color: color || '' }; });
    m.fxSet = new Set(m.fx.map((x) => x.name));
    m.hasHitbox = m.hb.w > 0 && m.hb.h > 0 && m.act > 0;
    if (m.su < 1) m.su = 1;
    m.casterAct = m.isProj ? 1 : m.act;
    m.total = m.su - 1 + m.casterAct + m.rec;
    if (m.total < 1) m.total = 1;
    // ---- Phân tích input ----
    let inp = m.input.replace(/\s+/g, '');
    m.air = /^j\./i.test(inp);
    if (m.air) inp = inp.slice(2);
    m.motion = null; m.dir = 5; m.prox = ''; m.btn = '';
    let mm;
    m.charge = null;
    if ((mm = inp.match(/^\[([42])\]([689])([LMHU])$/))) { m.charge = { from: +mm[1], to: +mm[2] }; m.btn = mm[3]; }
    else if ((mm = inp.match(/^([cf])([LMHU])$/))) { m.prox = mm[1]; m.btn = mm[2]; }
    else if ((mm = inp.match(/^(\d+)([LMHU])$/))) {
      if (mm[1].length === 1) m.dir = +mm[1];
      else m.motion = mm[1];
      m.btn = mm[2];
    } else if ((mm = inp.match(/^([LMHU])$/))) m.btn = mm[1];
    return m;
  }

  function normChar(r) {
    return {
      name: r.Character,
      pfx: r.Prefix,
      shape: r.Shape,
      arch: r.Archetype,
      hp: num(r.HP, 1000),
      walkF: num(r.Walk_Fwd, 4),
      walkB: num(r.Walk_Back, 3.3),
      dash: num(r.Dash_Speed, 10),
      backdash: Math.round(num(r.Backdash_Frames, 22)),
      jumpV: num(r.Jump_Velocity, 19),
      jumpX: num(r.Jump_Fwd_Speed, 5),
      grav: num(r.Gravity, 0.95),
      adash: num(r.Airdash_Speed, 14),
      adashF: Math.round(num(r.Airdash_Frames, 15)),
      airJumps: Math.round(num(r.Air_Jumps, 1)),
      airDashes: Math.round(num(r.Air_Dashes, 1)),
      w: num(r.Width, 110),
      h: num(r.Height, 186),
      throwR: num(r.Throw_Range, 150),
      color: r.Color || '#888',
      weapon: r.Weapon || '',
      gimmick: r.Gimmick || '',
    };
  }

  // ---- Database ----
  SO.loadData = function (movesText, charsText) {
    const mp = SO.parseCSV(movesText);
    const cp = SO.parseCSV(charsText);
    const DB = { chars: {}, order: [], all: {}, byId: {}, movesHead: mp.head, movesRows: mp.rows, charsHead: cp.head, charsRows: cp.rows };
    cp.rows.forEach((r) => {
      if (!r.Character) return;
      const c = normChar(r);
      c.moves = []; c.normals = {}; c.motions = []; c.charges = []; c.unique = {}; c.spells = {}; c.byId = {};
      DB.chars[c.name] = c;
      DB.order.push(c.name);
    });
    mp.rows.forEach((r) => {
      if (!r.Move_ID) return;
      const m = normMove(r);
      DB.byId[m.id] = m;
      if (m.char === 'ALL') { DB.all[m.id] = m; return; }
      const c = DB.chars[m.char];
      if (!c) return;
      c.moves.push(m);
      c.byId[m.id] = m;
      if (m.kv.Spell) { c.spells[m.kv.Spell] = m; return; }
      if (['Followup', 'Puppet', 'System', 'Burst', 'Throw'].includes(m.type)) return;
      if (!m.btn) return;
      if (m.charge) {
        c.charges.push(m);
      } else if (m.motion) {
        c.motions.push(m);
      } else if (m.btn === 'U') {
        c.unique[(m.air ? 'j' : 'g') + (m.dir === 2 || m.dir === 1 || m.dir === 3 ? '2' : '5')] = m;
      } else {
        const key = (m.air ? 'j' : 'g') + (m.prox || m.dir) + m.btn;
        c.normals[key] = m;
      }
    });
    Object.values(DB.chars).forEach((c) => {
      c.motions.sort((a, b) => b.motion.length - a.motion.length || (b.type === 'Super') - (a.type === 'Super'));
    });
    SO.DB = DB;
    return DB;
  };

  SO.sysMove = function (c, name) {
    return (c && c.byId[c.pfx + '_' + name]) || SO.DB.all['ALL_' + name];
  };

  // ===========================================================================
  // INPUT
  // ===========================================================================
  const BIND = [
    { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], L: ['KeyU'], M: ['KeyI'], H: ['KeyO'], U: ['KeyJ'], pause: ['Tab'] },
    { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], L: ['Numpad4', 'Comma'], M: ['Numpad5', 'Period'], H: ['Numpad6', 'Slash'], U: ['Numpad1', 'ShiftRight'], pause: ['Escape'] },
  ];
  SO.BIND = BIND;
  const keys = new Set();
  const GAME_CODES = new Set();
  BIND.forEach((b) => Object.values(b).forEach((arr) => arr.forEach((c) => GAME_CODES.add(c))));
  SO.keysPressedOnce = []; // dùng cho menu
  window.addEventListener('keydown', (e) => {
    if (GAME_CODES.has(e.code) || e.code === 'Enter' || e.code === 'Backspace' || e.code === 'F1' || e.code === 'F2') e.preventDefault();
    if (!keys.has(e.code)) SO.keysPressedOnce.push(e.code);
    keys.add(e.code);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  function padState(i) {
    const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
    const p = pads[i];
    if (!p) return null;
    const b = (n) => !!(p.buttons[n] && p.buttons[n].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    return {
      up: b(12) || ay < -0.5, down: b(13) || ay > 0.5, left: b(14) || ax < -0.5, right: b(15) || ax > 0.5,
      L: b(2), M: b(3), H: b(1), U: b(0), pause: b(9),
    };
  }

  SO.readRaw = function (i) {
    const b = BIND[i];
    const r = {};
    for (const k in b) r[k] = b[k].some((c) => keys.has(c));
    const p = padState(i);
    if (p) for (const k in p) r[k] = r[k] || p[k];
    return r;
  };
  SO.keyDown = (code) => keys.has(code);

  // numpad từ raw (tuyệt đối, trái/phải màn hình)
  SO.rawToNumpad = function (r) {
    let dx = (r.right ? 1 : 0) - (r.left ? 1 : 0);
    let dy = r.up ? 1 : r.down ? -1 : 0;
    return 5 + dx + dy * 3;
  };
  SO.mirrorDir = (d) => (d === 5 ? 5 : d + (d % 3 === 1 ? 2 : d % 3 === 0 ? -2 : 0));

  // Trạng thái input của một người chơi
  class PlayerInput {
    constructor() {
      this.reset();
    }
    reset() {
      this.raw = { up: false, down: false, left: false, right: false, L: false, M: false, H: false, U: false, pause: false };
      this.prevRaw = Object.assign({}, this.raw);
      this.abs = 5; this.rel = 5; this.prevRel = 5;
      this.hist = new Array(64).fill(5);
      this.histAbs = new Array(64).fill(5);
      this.frame = 0;
      this.pressT = { L: -99, M: -99, H: -99, U: -99 };
      this.held = { L: false, M: false, H: false, U: false };
      this.pressed = { L: false, M: false, H: false, U: false };
      this.buf = []; // {b, t}
      this.fwdTapT = -99; this.backTapT = -99; this.backStartT = -99;
      this.downT = -99; this.upT = -99; this.upTapT = -99; this.t9 = -99; this.t7 = -99;
      this.chg = { 4: { n: 0, last: 0, rel: -99 }, 2: { n: 0, last: 0, rel: -99 } };
      this.compUsedT = -99;
      this.log = []; // lịch sử để hiển thị
    }
    // facing: 1 = nhìn sang phải
    update(raw, facing, frame) {
      this.prevRaw = this.raw;
      this.raw = raw;
      this.frame = frame;
      this.prevRel = this.rel;
      this.abs = SO.rawToNumpad(raw);
      this.rel = facing === 1 ? this.abs : SO.mirrorDir(this.abs);
      this.hist[frame % 64] = this.rel;
      this.histAbs[frame % 64] = this.abs;
      const isF = (d) => d === 6 || d === 3 || d === 9;
      const isB = (d) => d === 4 || d === 1 || d === 7;
      // dash: chỉ tính khi gõ thẳng 6 / 4 từ hướng không cùng phía (để 236236, 214214 không thành dash)
      if (this.rel === 6 && !isF(this.prevRel)) { this.lastFwdTap = this.fwdTapT; this.fwdTapT = frame; }
      if (this.rel === 4 && !isB(this.prevRel)) { this.lastBackTap = this.backTapT; this.backTapT = frame; }
      if (isB(this.rel) && !isB(this.prevRel)) this.backStartT = frame;
      if (this.rel <= 3) this.downT = frame;
      if (this.rel <= 3 && this.prevRel > 3) this.downTaps = (this.downTaps || 0) + 1;
      if (this.rel >= 7) this.upT = frame;
      if (this.rel >= 7 && this.prevRel < 7) this.upTapT = frame;
      if (this.rel === 9) this.t9 = frame;
      // charge: đếm số frame giữ lùi (1/4/7) và giữ xuống (1/2/3)
      for (const [k, on] of [[4, this.rel === 1 || this.rel === 4 || this.rel === 7], [2, this.rel <= 3]]) {
        const c = this.chg[k];
        if (on) c.n++;
        else if (c.n > 0) { c.last = c.n; c.rel = frame; c.n = 0; }
      }
      if (this.rel === 7) this.t7 = frame;
      let anyNew = false;
      for (const b of ['L', 'M', 'H', 'U']) {
        this.pressed[b] = raw[b] && !this.prevRaw[b];
        this.held[b] = raw[b];
        if (this.pressed[b]) {
          this.pressT[b] = frame;
          this.buf.push({ b, t: frame, rel: this.rel });
          anyNew = true;
        }
      }
      this.buf = this.buf.filter((p) => frame - p.t <= SO.CFG.BUFFER);
      if (this.rel !== this.prevRel || anyNew) {
        let s = this.rel === 5 ? '' : String(this.rel);
        for (const b of ['L', 'M', 'H', 'U']) if (this.pressed[b]) s += b;
        if (s) {
          this.log.unshift({ s, t: frame });
          if (this.log.length > 18) this.log.pop();
        }
      }
    }
    dirAt(f) { return this.hist[((f % 64) + 64) % 64]; }
    // phát hiện motion trong cửa sổ kết thúc ở frame `end`
    motion(m, end, extra) {
      const pat = MOTIONS[m];
      if (!pat) return false;
      const W = SO.motionWindow(m) + (extra || 0);
      const start = Math.max(end - W, this.frame - 60);
      let i = 0, last = -1;
      for (let f = start; f <= end; f++) {
        const d = this.dirAt(f);
        if (d === last) continue;
        last = d;
        if (i >= pat.length) break;
        if (d === pat[i][0]) i++;
        else if (pat[i][1] && i + 1 < pat.length && d === pat[i + 1][0]) i += 2;
      }
      while (i < pat.length && pat[i][1]) i++;
      return i >= pat.length;
    }
    recentDown(window) { return this.frame - this.downT <= window && this.frame - this.downT > 0; }
    isBack() { return this.rel === 4 || this.rel === 1 || this.rel === 7; }
    isFwd() { return this.rel === 6 || this.rel === 3 || this.rel === 9; }
    isDown() { return this.rel <= 3; }
    isUp() { return this.rel >= 7; }
    within(bs, w) {
      const ts = bs.map((b) => this.pressT[b]);
      const mx = Math.max(...ts), mn = Math.min(...ts);
      return mx - mn <= w && this.frame - mx <= SO.CFG.BUFFER && mx > this.compUsedT;
    }
    // dịch mọi mốc thời gian 1 frame (dùng khi đang hitstop để không mất input)
    shift() {
      this.buf.forEach((p) => p.t++);
      for (const b of ['L', 'M', 'H', 'U']) if (this.pressT[b] < this.frame) this.pressT[b]++;
      for (const k of ['fwdTapT', 'lastFwdTap', 'backTapT', 'lastBackTap', 'backStartT', 'downT', 'upT', 'upTapT', 't9', 't7', 'compUsedT']) if (this[k] < this.frame && this[k] > -90) this[k]++;
    }
    // đã charge đủ hướng k (4 hoặc 2) chưa (đang giữ hoặc vừa nhả trong CHARGE_KEEP frame)
    charged(k, need) {
      const c = this.chg[k];
      need = need || SO.CFG.CHARGE;
      return c.n >= need || (c.last >= need && this.frame - c.rel <= SO.CFG.CHARGE_KEEP);
    }
    heldCount() { return ['L', 'M', 'H'].filter((b) => this.held[b]).length; }
  }
  SO.PlayerInput = PlayerInput;

  SO.loadData(window.SO_DATA.moves, window.SO_DATA.characters);
})();

</script>
<script>/* js/fighter.js */
'use strict';
// =============================================================================
// SQUARED OFF - Fighter: FSM, chọn chiêu, cancel, di chuyển
// =============================================================================
(function () {
  const SO = window.SO;
  const C = SO.CFG;

  const NEUTRAL = new Set(['idle', 'walk', 'crouch']);
  const STUN = new Set(['hitstun', 'airhit', 'block', 'knockdown', 'wakeup', 'thrown', 'recoil']);
  const NORMAL_T = new Set(['Normal', 'Command']);

  function tier(m) {
    return m.btn === 'L' ? 1 : m.btn === 'M' ? 2 : m.btn === 'H' ? 3 : 2;
  }

  class Fighter {
    constructor(world, idx, name) {
      this.w = world;
      this.idx = idx;
      this.inp = new SO.PlayerInput();
      this.setChar(name);
    }
    setChar(name) {
      this.name = name;
      this.c = SO.DB.chars[name];
      this.G = (SO.GIM && SO.GIM[name]) || {};
    }
    refreshData() {
      this.c = SO.DB.chars[this.name];
    }
    get opp() { return this.w.f[1 - this.idx]; }

    resetRound(x, facing) {
      const c = this.c;
      this.x = x; this.y = 0; this.vx = 0; this.vy = 0; this.pushV = 0;
      this.facing = facing;
      this.hp = c.hp; this.gray = 0; this.burst = 100;
      this.state = 'idle'; this.sf = 0;
      this.move = null; this.mf = 0; this.moveAir = false;
      this.hitstop = 0; this.stun = 0; this.untech = 0; this.kdType = ''; this.slow = 0;
      this.resetAir();
      this.invT = 0; this.throwInvT = 0;
      this.combo = { hits: 0, scale: 1, dmg: 0 };
      this.buffs = { burst: 0, dmgUp: 0, grayRegen: 0 };
      this.contact = null; this.hitIdx = -1; this.chain = []; this.grabbed = false;
      this.wallBounce = false; this.momentum = 0; this.guard = false; this.fd = false;
      this.crouchBlock = false; this.crouchHit = false; this.vanish = false;
      this.jumpDir = 0; this.afterimg = 0; this.ko = false; this.recoilT = 0; this.ghosts = []; this.iadQueued = 0;
      this.lastHS = 0; this.landT = C.LANDING; this.kdT = 0;
      this.blockArm = 0; this.freeFrame = 0;
      this.gim = {};
      if (this.G.init) this.G.init(this);
      this.inp.reset();
    }
    resetAir() {
      this.airJumps = this.c.airJumps;
      this.airDashes = this.c.airDashes;
      this.superJump = false;
      this.airdashed = false;
    }

    // ------------------------------------------------------------------ helpers
    isAir() { return this.y > 0.01 || (this.state === 'attack' && this.moveAir); }
    setState(s) {
      const prev = this.state;
      this.state = s;
      this.sf = 0;
      if (s !== 'attack') this.move = null;
      if (STUN.has(prev) && !STUN.has(s)) {
        this.combo = { hits: 0, scale: 1, dmg: 0 };
        this.wallBounce = false;
        this.freeFrame = this.w.frame;
        this.w.onRecover(this, prev);
      }
      if (s === 'hitstun' || s === 'airhit' || s === 'block') this.guard = false;
    }
    faceOpp() {
      const dx = this.opp.x - this.x;
      if (Math.abs(dx) > 1) this.facing = dx > 0 ? 1 : -1;
    }
    res() { return this.w.res(this.idx); }
    walkMul() { return this.G.walkMul ? this.G.walkMul(this) : 1; }
    canActNow() {
      const s = this.state;
      if (this.w.phase !== 'fight') return false;
      if (NEUTRAL.has(s)) return true;
      if (s === 'air') return true;
      if (s === 'dash') return true;
      if (s === 'airdash' && this.sf >= 4) return true;
      return false;
    }
    isCrouchPose() {
      const s = this.state;
      if (s === 'crouch') return true;
      if (s === 'block') return this.crouchBlock;
      if (s === 'hitstun') return this.crouchHit;
      if (s === 'attack' && this.move) {
        const d = this.move.d;
        return !d.air && !d.motion && d.dir <= 3 && !this.moveAir;
      }
      return false;
    }
    nearWall(m) {
      return this.x < 80 + this.c.w / 2 + m || this.x > C.STAGE_W - 80 - this.c.w / 2 - m;
    }
    atWall(dir) {
      const lo = 80 + this.c.w / 2, hi = C.STAGE_W - 80 - this.c.w / 2;
      return dir < 0 ? this.x <= lo + 2 : this.x >= hi - 2;
    }
    stunBase(inst, blocked) {
      const adv = blocked ? inst.d.ob : inst.d.oh;
      return inst.casterAct - 1 + inst.rec + adv;
    }

    // ------------------------------------------------------------------ boxes
    hurtboxes() {
      if (this.vanish) return [];
      const c = this.c, s = this.state;
      let w = c.w * 0.78, h = c.h;
      if (s === 'knockdown' || s === 'wakeup') { h = 40; w = c.w * 1.4; }
      else if (this.isCrouchPose()) h = c.h * 0.62;
      else if (this.isAir()) h = c.h * 0.8;
      const out = [{ cx: this.x, cy: this.y + h / 2, w, h }];
      if (s === 'attack' && this.move) {
        const m = this.move, d = m.d;
        if (d.hasHitbox && !d.isProj && !d.tags.has('NoExtHurt') && !d.kv.Detonate &&
            (NORMAL_T.has(d.type) || d.type === 'Unique' || d.type === 'Special')) {
          const t = this.mf;
          if (t >= m.su - 2 && t < m.su + m.act + Math.floor(m.rec / 2)) {
            out.push({ cx: this.x + this.facing * m.hb.x * 0.95, cy: this.y + m.hb.y, w: m.hb.w * 0.8, h: m.hb.h * 0.9, ext: true });
          }
        }
      }
      return out;
    }
    pushbox() {
      const c = this.c;
      const h = this.isCrouchPose() ? c.h * 0.6 : c.h * 0.8;
      return { cx: this.x, cy: this.y + h / 2, w: c.w * 0.6, h };
    }
    activeHitbox() {
      if (this.state !== 'attack' || !this.move) return null;
      const m = this.move, d = m.d;
      if (!d.hasHitbox || d.isProj || d.kv.Detonate || d.type === 'Throw' || d.type === 'CmdGrab' || d.type === 'AirGrab' || d.type === 'Puppet' || d.tags.has('CmdGrab')) return null;
      const t = this.mf;
      if (t < m.su || t >= m.su + m.act) return null;
      const interval = Math.max(1, Math.ceil(m.act / m.hits));
      const idx = Math.min(m.hits - 1, Math.floor((t - m.su) / interval));
      if (idx <= this.hitIdx) return null;
      return { box: { cx: this.x + this.facing * m.hb.x, cy: this.y + m.hb.y, w: m.hb.w, h: m.hb.h }, idx };
    }
    isInvuln(kind) {
      const s = this.state;
      if (this.invT > 0) return true;
      if (this.vanish) return true;
      if (s === 'knockdown' || s === 'wakeup' || s === 'thrown' || s === 'throwing' || s === 'ko') return true;
      if (kind === 'throw') {
        if (this.throwInvT > 0 || this.isAir()) return true;
        if (s === 'hitstun' || s === 'block' || s === 'airhit' || s === 'recoil') return true;
      }
      if (s === 'backdash' && this.sf <= 7 && kind !== 'throw') return true;
      if (s === 'attack' && this.move) {
        const d = this.move.d;
        if (d.inv && this.mf >= d.inv[0] && this.mf <= d.inv[1]) {
          const T = d.invType;
          if (T === 'Full') return true;
          if (T === 'Strike' && kind !== 'throw') return true;
          if (T === 'Throw' && kind === 'throw') return true;
          if (T === 'Projectile' && kind === 'proj') return true;
        }
      }
      return false;
    }
    canBlockNow() {
      const s = this.state;
      if (this.w.phase !== 'fight') return false;
      return NEUTRAL.has(s) || s === 'block' || s === 'land' || s === 'air';
    }
    holdingAwayFrom(srcX) {
      const a = this.inp.abs;
      const left = a === 1 || a === 4 || a === 7, right = a === 3 || a === 6 || a === 9;
      let side = SO.sign(srcX - this.x);
      if (side === 0) side = this.facing;
      return side > 0 ? left : right;
    }
    threatened() {
      const o = this.opp;
      if (o.state === 'attack' && o.move && o.mf < o.move.su + o.move.act && o.move.d.hasHitbox &&
          Math.abs(o.x - this.x) < C.PROX_GUARD + Math.abs(o.move.hb.x) + o.move.hb.w / 2) return true;
      for (const p of this.w.projs) {
        if (p.owner === o && !p.dead && Math.abs(p.x - this.x) < 420) return true;
      }
      if (o.G.threat && o.G.threat(o, this)) return true;
      return false;
    }

    // ------------------------------------------------------------------ input
    readInput(raw) {
      this.inp.update(raw, this.facing, this.w.frame);
    }

    tick() {
      if (this.hitstop > 0) {
        this.hitstop--;
        this.lastHS++;
        // giữ buffer trong lúc hitstop
        this.inp.shift();
        return;
      }
      if (this.slow > 0) {
        this.slow--;
        if (this.w.frame % 2) return;
      }
      this.step();
      if (this.lastHS > 0 && this.state !== 'attack') this.lastHS = 0;
      this.updateGhosts();
    }

    // ------------------------------------------------------------------ afterimage
    wantsGhost() {
      const s = this.state;
      if (s === 'dash' || s === 'airdash' || s === 'backdash') return true;
      if (s === 'attack' && this.move) {
        const d = this.move.d;
        if (d.type === 'Super' || d.type === 'Burst') return true;
        for (const v of this.move.vel) if (this.mf >= v.a && this.mf <= v.b && (Math.abs(v.vx) >= 8 || Math.abs(v.vy) >= 12)) return true;
      }
      return false;
    }
    snapshot() {
      const s = Object.create(this);
      Object.assign(s, {
        x: this.x, y: this.y, facing: this.facing, state: this.state, sf: this.sf, mf: this.mf, move: this.move,
        moveAir: this.moveAir, guard: this.guard, crouchBlock: this.crouchBlock, crouchHit: this.crouchHit,
        vanish: false, invT: 0, ghosts: null, buffs: { burst: 0 }, adDir: this.adDir, age: 0,
        gim: Object.assign({}, this.gim, { shift: null, install: 0 }),
        ghostKind: this.state === 'attack' && this.move && this.move.d.type === 'Super' ? 'super' : this.buffs.burst > 0 || (this.move && this.move.d.type === 'Burst') ? 'burst' : 'move',
      });
      return s;
    }
    updateGhosts() {
      if (!this.ghosts) this.ghosts = [];
      for (const g of this.ghosts) g.age++;
      this.ghosts = this.ghosts.filter((g) => g.age < 14);
      if (this.wantsGhost()) this.afterimg = Math.max(this.afterimg, 3);
      if (this.afterimg > 0 && this.w.frame % 2 === 0 && !this.vanish) this.ghosts.push(this.snapshot());
    }

    step() {
      this.sf++;
      if (this.invT > 0) this.invT--;
      if (this.throwInvT > 0) this.throwInvT--;
      if (this.afterimg > 0) this.afterimg--;
      if (this.blockArm > 0) this.blockArm--;
      if (this.buffs.burst > 0) {
        this.buffs.burst--;
        if (this.gray > 0) {
          const r = Math.min(this.gray, this.buffs.grayRegen);
          this.hp = Math.min(this.c.hp, this.hp + r);
          this.gray -= r;
        }
      }
      if (this.G.update) this.G.update(this);
      const s = this.state;
      // composite (RC / Burst / Throw / Dead Angle / Throw break)
      if (this.w.phase === 'fight' && s !== 'ko' && s !== 'knockdown' && s !== 'wakeup') {
        if (this.tryComposite()) {
          if (this.state === 'attack' && this.mf === 0) this.attackStep();
          this.physics();
          return;
        }
      }
      switch (s) {
        case 'idle': case 'walk': case 'crouch': this.groundNeutral(); break;
        case 'prejump': this.prejumpStep(); break;
        case 'air': this.airStep(); break;
        case 'land':
          this.vx = 0;
          if (this.sf >= this.landT) { this.faceOpp(); this.setState(this.inp.isDown() ? 'crouch' : 'idle'); this.groundNeutral(); }
          break;
        case 'dash': this.dashStep(); break;
        case 'dashstop':
          this.vx *= 0.7;
          if (this.sf >= C.DASH_LOCK) this.setState('idle');
          break;
        case 'backdash': this.backdashStep(); break;
        case 'airdash': this.airdashStep(); break;
        case 'attack': this.attackStep(); break;
        case 'hitstun':
          this.vx = this.decay(this.vx);
          if (this.sf > this.stun) { this.setState(this.inp.isDown() ? 'crouch' : 'idle'); this.groundNeutral(); }
          break;
        case 'block':
          this.blockStep();
          break;
        case 'airhit': this.airhitStep(); break;
        case 'knockdown':
          this.vx = this.decay(this.vx);
          if (this.sf >= this.kdT) this.setState('wakeup');
          break;
        case 'wakeup':
          this.vx = 0;
          if (this.sf >= C.WAKEUP) { this.throwInvT = 6; this.faceOpp(); this.setState('idle'); }
          break;
        case 'recoil':
          this.vx = this.decay(this.vx);
          if (this.sf >= this.recoilT) this.setState('idle');
          break;
        case 'throwing': case 'thrown': this.vx = 0; break;
        case 'ko':
          this.vx = this.decay(this.vx);
          break;
      }
      if (this.state === 'attack' && this.mf === 0) this.attackStep();
      this.physics();
    }

    decay(v) {
      if (Math.abs(v) <= C.PUSH_DECAY) return 0;
      return v - SO.sign(v) * C.PUSH_DECAY;
    }

    physics() {
      if (Math.abs(this.pushV) > 0) {
        this.x += this.pushV;
        this.pushV = this.decay(this.pushV);
      }
      this.x += this.vx;
      const airStates = this.state === 'air' || this.state === 'airdash' || this.state === 'airhit' ||
        (this.state === 'attack' && this.moveAir) || (this.state === 'block' && this.airBlock) || this.state === 'ko';
      if (airStates || this.y > 0) {
        this.y += this.vy;
        if (this.y <= 0) { this.y = 0; this.onLand(); }
      } else {
        this.y = 0;
        this.vy = 0;
      }
    }

    onLand() {
      const s = this.state;
      this.vy = 0;
      if (s === 'air' || s === 'airdash') {
        this.resetAir();
        this.landT = C.LANDING;
        this.vx = 0;
        this.setState('land');
        this.faceOpp();
      } else if (s === 'attack') {
        const d = this.move.d;
        if ((d.air && d.type !== 'Spell') || d.tags.has('LandEnd') || (d.type === 'Unique' && d.tags.has('Airborne'))) {
          this.resetAir();
          this.landT = C.AIR_ATK_LANDING;
          this.vx = 0;
          this.setState('land');
          this.faceOpp();
        } else {
          this.moveAir = false;
          this.resetAir();
        }
      } else if (s === 'airhit' && this.groundBounce) {
        // ground bounce: nảy lên lại để combo tiếp
        this.groundBounce = false;
        this.y = 1;
        this.vy = 12;
        this.vx *= 0.6;
        this.sf = 0;
        this.untech = Math.max(this.untech - this.sf, 26);
        this.w.fx.push({ type: 'dust', x: this.x, y: 0, t: 0, life: 22, big: true });
        this.w.fx.push({ type: 'crack', x: this.x, y: 0, t: 0, life: 40 });
        this.w.quake = Math.max(this.w.quake || 0, 8);
      } else if (s === 'airhit') {
        this.resetAir();
        this.vx *= 0.3;
        if (this.ko) { this.setState('ko'); return; }
        this.kdT = this.kdType === 'Hard_Knockdown' ? C.KD_HARD : C.KD_SOFT;
        this.setState('knockdown');
        this.w.fx.push({ type: 'dust', x: this.x, y: 0, t: 0, life: 18 });
      } else if (s === 'block') {
        this.airBlock = false;
        this.resetAir();
      } else if (s === 'ko') {
        this.vx *= 0.5;
      } else {
        this.resetAir();
      }
    }

    // ------------------------------------------------------------------ neutral
    groundNeutral() {
      this.faceOpp();
      this.guard = false;
      if (this.canActNow() && this.tryActions()) return;
      const i = this.inp, d = i.rel;
      if (this.w.phase !== 'fight') { this.vx = 0; if (this.state !== 'idle') this.setState('idle'); return; }
      if (this.G.suppressMove && this.G.suppressMove(this)) {
        this.vx = 0;
        if (this.state !== 'idle' && this.state !== 'crouch') this.setState('idle');
        return;
      }
      if (d >= 7) { this.startJump(d); return; }
      if (i.fwdTapT === i.frame && i.frame - i.lastFwdTap <= C.DASH_WINDOW && this.c.dash > 0) { this.setState('dash'); return; }
      if (i.backTapT === i.frame && i.frame - i.lastBackTap <= C.DASH_WINDOW) { this.setState('backdash'); return; }
      const want = d <= 3 ? 'crouch' : (d === 6 || d === 4) ? 'walk' : 'idle';
      if (this.state !== want) this.setState(want);
      if (d === 6) {
        this.vx = this.facing * this.c.walkF * this.walkMul();
        this.w.gain(this.idx, C.WALK_GAIN);
      } else if (d === 4) {
        if (this.threatened()) { this.vx = 0; this.guard = true; }
        else { this.vx = -this.facing * this.c.walkB * this.walkMul(); this.w.gain(this.idx, -C.BACK_PENALTY); }
      } else if (d === 1 && this.threatened()) { this.vx = 0; this.guard = true; }
      else this.vx = 0;
    }

    // IAD: 956 (tiến) / 754 (lùi) — phải đi qua neutral
    iadCheck() {
      const i = this.inp;
      if (i.rel === 6 && i.prevRel === 5 && i.frame - i.t9 <= 10) return 1;
      if (i.rel === 4 && i.prevRel === 5 && i.frame - i.t7 <= 10) return -1;
      return 0;
    }
    startJump(d, fromCancel) {
      this.iadQueued = 0;
      // jump cancel: chỉ thành super jump nếu bấm xuống SAU khi đòn bắt đầu (2H rồi 9 là nhảy thường)
      const sj = this.inp.recentDown(C.SJ_WINDOW) && (!fromCancel || (this.inp.downTaps || 0) > this.downTapsAtMove);
      this.setState('prejump');
      this.jumpDir = d === 7 ? -1 : d === 9 ? 1 : 0;
      this.superJump = sj;
      this.jumpMomentum = this.vx;
    }
    prejumpStep() {
      this.vx *= 0.5;
      // [2]8 + nút trong lúc pre-jump vẫn ra charge move (không bị nhảy mất)
      if (this.c.charges.length && this.tryActions()) return;
      const d = this.inp.rel;
      if (d === 7) this.jumpDir = -1;
      else if (d === 9) this.jumpDir = 1;
      const iad = this.iadCheck();
      if (iad) this.iadQueued = iad;
      if (this.sf >= C.PREJUMP) {
        const c = this.c, sj = this.superJump;
        this.vy = c.jumpV * (sj ? 1.183 : 1);
        this.vx = this.jumpDir * c.jumpX * this.facing * (sj ? 1.15 : 1);
        if (Math.abs(this.jumpMomentum || 0) > c.jumpX && SO.sign(this.jumpMomentum) === SO.sign(this.vx)) this.vx = this.jumpMomentum * 0.85;
        this.y = 1;
        if (sj) {
          this.airJumps = 0;
          this.afterimg = 30;
          this.w.fx.push({ type: 'dust', x: this.x, y: 0, t: 0, life: 22, big: true });
        }
        this.setState('air');
        if (this.iadQueued && this.airDashes > 0 && !this.superJump) {
          this.y = 22;
          this.startAirdash(this.iadQueued);
        }
        this.iadQueued = 0;
      }
    }
    airStep() {
      this.vy -= this.c.grav;
      if (this.canActNow() && this.tryActions()) return;
      if (this.w.phase !== 'fight') return;
      const i = this.inp;
      if (i.rel >= 7 && i.prevRel < 7 && this.airJumps > 0 && !this.superJump && !this.airdashed && this.sf > 4) {
        this.airJumps--;
        const dir = i.rel === 7 ? -1 : i.rel === 9 ? 1 : 0;
        this.vy = this.c.jumpV * 0.9;
        this.vx = dir * this.c.jumpX * this.facing;
        this.w.fx.push({ type: 'ring', x: this.x, y: this.y, t: 0, life: 12, r: 40, color: '#999' });
        this.sf = 1;
        return;
      }
      const iad = this.iadCheck();
      if (iad && this.airDashes > 0 && this.sf <= 14 && !(this.G.noAirdash && this.G.noAirdash(this))) {
        this.y = Math.max(this.y, 22);
        this.startAirdash(iad);
        return;
      }
      if (this.airDashes > 0 && this.y > 50 && !(this.G.noAirdash && this.G.noAirdash(this))) {
        if (i.fwdTapT === i.frame && i.frame - i.lastFwdTap <= C.DASH_WINDOW) { this.startAirdash(1); return; }
        if (i.backTapT === i.frame && i.frame - i.lastBackTap <= C.DASH_WINDOW) { this.startAirdash(-1); return; }
      }
    }
    airJump(d) {
      this.airJumps--;
      const dir = d === 7 ? -1 : d === 9 ? 1 : 0;
      this.move = null;
      this.moveAir = false;
      this.setState('air');
      this.vy = this.c.jumpV * 0.92;
      this.vx = dir * this.c.jumpX * this.facing * 0.8;
      this.sf = 1;
      this.w.fx.push({ type: 'ring', x: this.x, y: this.y, t: 0, life: 12, r: 40, color: '#999' });
    }
    startAirdash(dir) {
      this.airDashes--;
      this.airdashed = true;
      this.adDir = dir;
      this.afterimg = 14;
      this.setState('airdash');
    }
    airdashStep() {
      const c = this.c;
      const len = this.adDir > 0 ? c.adashF : Math.round(c.adashF * 0.75);
      this.vy = 0;
      this.vx = this.adDir * this.facing * c.adash * (this.adDir < 0 ? 0.75 : 1);
      if (this.sf >= 4 && this.tryActions()) return;
      if (this.sf >= len) { this.vx *= 0.6; this.setState('air'); }
    }
    dashStep() {
      const c = this.c;
      this.vx = this.facing * c.dash * this.walkMul() * (this.sf < 3 ? 0.6 : 1);
      if (this.sf % 4 === 0) this.w.fx.push({ type: 'dust', x: this.x - this.facing * 30, y: 0, t: 0, life: 10 });
      this.w.gain(this.idx, C.DASH_GAIN);
      if (this.tryActions()) return;
      const i = this.inp;
      if (i.rel >= 7) { this.startJump(i.rel); return; }
      if (!i.isFwd() && this.sf >= 8) this.setState('dashstop');
    }
    backdashStep() {
      const c = this.c;
      const n = c.backdash;
      this.vx = -this.facing * (this.sf < n * 0.6 ? 9 : 3);
      if (this.sf >= n) { this.vx = 0; this.setState('idle'); }
    }
    blockStep() {
      this.vx = this.decay(this.vx);
      if (this.airBlock) this.vy -= this.c.grav;
      const fdHeld = this.inp.isBack() && this.inp.heldCount() >= 2;
      this.fd = fdHeld && this.w.res(this.idx) > C.EQ_FLOOR + 0.01;
      if (this.fd) this.w.spend(this.idx, Math.min(C.FD_COST, this.w.res(this.idx) - C.EQ_FLOOR));
      if (this.sf > this.stun) {
        this.fd = false;
        if (this.airBlock) { this.airBlock = false; this.setState('air'); }
        else { this.setState(this.inp.isDown() ? 'crouch' : 'idle'); this.groundNeutral(); }
      }
    }
    airhitStep() {
      const juggle = 1 + Math.min(0.5, this.combo.hits * 0.025);
      this.vy -= this.c.grav * juggle;
      this.vx *= 0.995;
      if (this.wallBounce && this.atWall(SO.sign(this.vx))) {
        this.wallBounce = false;
        this.vx = -this.vx * 0.5;
        this.vy = 9;
        this.w.fx.push({ type: 'ring', x: this.x, y: this.y + 80, t: 0, life: 14, r: 70, color: '#c44' });
        this.w.fx.push({ type: 'text', x: this.x, y: this.y + 200, text: 'WALL!', t: 0, life: 40 });
      }
      if (this.ko) return;
      const canTech = this.sf >= this.untech && (this.kdType === 'Normal' || this.kdType === 'Launch' || this.kdType === '');
      if (canTech && this.w.phase === 'fight' && (this.inp.pressed.L || this.inp.pressed.M || this.inp.pressed.H)) {
        this.setState('air');
        this.invT = C.AIRTECH_INV;
        this.vy = 7;
        this.vx = -this.facing * 3;
        this.airJumps = 0;
        this.airDashes = 0;
        this.afterimg = 10;
        this.consumeComposite();
        this.w.fx.push({ type: 'ring', x: this.x, y: this.y + 80, t: 0, life: 14, r: 60, color: '#4a8' });
        this.w.fx.push({ type: 'text', x: this.x, y: this.y + 200, text: 'TECH', t: 0, life: 30 });
      }
    }

    // ------------------------------------------------------------------ actions
    tryComposite() {
      const i = this.inp, s = this.state, W = this.w;
      if (s === 'ko' || s === 'throwing') return false;
      const fresh = (b) => i.frame - i.pressT[b] <= C.BUFFER && i.pressT[b] > i.compUsedT;
      const kara = s === 'attack' && this.move && this.mf <= C.COMPOSITE + 1 && (NORMAL_T.has(this.move.d.type) || this.move.d.type === 'Unique' || this.move.d.type === 'Spell');
      const atkFree = this.canActNow() || kara;
      // L+M+H
      if (i.within(['L', 'M', 'H'], C.COMPOSITE)) {
        if (s === 'block' && W.res(this.idx) >= (SO.sysMove(this.c, 'DEAD_ANGLE').cost || 25)) {
          this.consumeComposite();
          this.startMove(SO.sysMove(this.c, 'DEAD_ANGLE'), { force: true });
          return true;
        }
        const rc = SO.sysMove(this.c, 'RC');
        const okState = NEUTRAL.has(s) || ['air', 'dash', 'attack', 'hitstun', 'airhit', 'land', 'airdash', 'prejump', 'dashstop', 'backdash'].includes(s);
        const notSuper = !(s === 'attack' && this.move && (this.move.d.type === 'Super' || this.move.d.type === 'Burst'));
        const rk = rc && this.rcKind(rc);
        if (rc && okState && notSuper && W.res(this.idx) >= rk.cost) {
          this.consumeComposite();
          this.doRC(rc, rk);
          return true;
        }
      }
      // Burst: U + attack
      if (this.burst >= 100 && fresh('U')) {
        const pair = ['L', 'M', 'H'].some((b) => fresh(b) && Math.abs(i.pressT[b] - i.pressT.U) <= C.COMPOSITE);
        if (pair) {
          if (s === 'hitstun' || s === 'airhit' || s === 'block') {
            this.consumeComposite();
            this.doBurst('D');
            return true;
          }
          const inSuper = s === 'attack' && this.move && (this.move.d.type === 'Super' || this.move.d.type === 'Burst');
          if (!inSuper && (this.canActNow() || s === 'attack' || s === 'land' || s === 'dashstop' || s === 'prejump')) {
            this.consumeComposite();
            this.doBurst('O');
            return true;
          }
        }
      }
      // Throw / Throw break: L + M
      if (i.within(['L', 'M'], C.COMPOSITE)) {
        if (s === 'thrown') {
          this.consumeComposite();
          W.throwBreak(this);
          return true;
        }
        const th = SO.sysMove(this.c, 'THROW');
        if (th && !this.isAir() && atkFree && s !== 'block' && !(this.G.blockThrow && this.G.blockThrow(this))) {
          const inRange = Math.abs(this.opp.x - this.x) <= this.c.throwR + 20;
          if (!inRange && i.isBack()) {
            // xa đối thủ + giữ lùi = thế Faultless Defense, không tung đòn
            this.consumeComposite();
            if (kara) this.endMove();
            return true;
          }
          this.consumeComposite();
          this.startMove(th, { force: true });
          return true;
        }
      }
      return false;
    }
    consumeComposite() {
      this.inp.compUsedT = this.inp.frame;
      this.inp.buf.length = 0;
    }

    tryActions() {
      if (this.w.phase !== 'fight') return false;
      const buf = this.inp.buf;
      for (let k = buf.length - 1; k >= 0; k--) {
        const p = buf[k];
        if (p.t <= this.inp.compUsedT) { buf.splice(k, 1); continue; }
        const r = this.selectMove(p.b, p);
        if (!r) continue;
        if (r.done) { buf.splice(k, 1); return true; }
        if (r.move && this.canStart(r.move)) {
          buf.splice(k, 1);
          this.startMove(r.move, r.opts || {});
          return true;
        }
        if (r.hold) continue;
      }
      return false;
    }

    // chọn chiêu cho một lần bấm nút
    selectMove(b, p) {
      const c = this.c, i = this.inp, air = this.isAir();
      if (this.G.press) {
        const r = this.G.press(this, b, p);
        if (r) return r;
      }
      const extra = (i.frame - p.t) + Math.min(14, this.lastHS);
      const stance = this.gim.stance || '';
      // charge moves: [4]6X / [2]8X
      const okAir = (m) => (m.air ? air : m.airOK ? true : !air) && (!m.stance || m.stance === stance) && (m.type !== 'Super' || this.res() >= m.cost);
      for (const m of c.charges) {
        if (!okAir(m)) continue;
        const toOK = m.charge.to === 6 ? [3, 6, 9].includes(p.rel) || i.isFwd() : [7, 8, 9].includes(p.rel) || i.isUp();
        if (!toOK || !i.charged(m.charge.from)) continue;
        let pick = c.charges.find((x) => x.charge.from === m.charge.from && x.charge.to === m.charge.to && x.btn === b && okAir(x));
        if (!pick && b !== 'U') pick = c.charges.filter((x) => x.charge.from === m.charge.from && x.charge.to === m.charge.to && x.btn !== 'U' && okAir(x))[0];
        if (pick) return { move: pick };
      }
      const done = new Set();
      for (const m0 of c.motions) {
        const mo = m0.motion;
        if (done.has(mo)) continue;
        done.add(mo);
        if (!i.motion(mo, i.frame, extra)) continue;
        const cands = c.motions.filter((m) => m.motion === mo &&
          (m.air ? air : m.airOK ? true : !air) &&
          (!m.stance || m.stance === stance) &&
          (m.type !== 'Super' || this.res() >= m.cost));
        if (!cands.length) continue;
        let pick = cands.find((m) => m.btn === b);
        if (!pick && b !== 'U') {
          const ord = { L: 1, M: 2, H: 3 };
          const lmh = cands.filter((m) => m.btn !== 'U').sort((x, y) => Math.abs(ord[x.btn] - ord[b]) - Math.abs(ord[y.btn] - ord[b]));
          pick = lmh[0];
        }
        // không cancel một chiêu vào chính nó (vd 214L lao rồi bấm H vẫn ra 5H)
        if (pick && this.state === 'attack' && this.move && pick.id === this.move.d.id) continue;
        if (pick) return { move: pick };
      }
      const d = p.rel;
      if (b === 'U') {
        const key = (air ? 'j' : 'g') + (d <= 3 ? '2' : '5');
        const m = c.unique[key] || c.unique[air ? 'j5' : 'g5'];
        return m ? { move: m } : null;
      }
      let m = null;
      if (air) {
        m = (d <= 3 && c.normals['j2' + b]) || c.normals['j5' + b];
      } else {
        if (d === 3) m = c.normals['g3' + b];
        if (!m && d <= 3) m = c.normals['g2' + b];
        if (!m && d === 6) m = c.normals['g6' + b];
        if (!m && d === 4) m = c.normals['g4' + b];
        if (!m && d > 3) {
          if (c.normals['gc' + b]) {
            const close = Math.abs(this.opp.x - this.x) - (this.opp.c.w + c.w) * 0.3 < C.CLOSE_RANGE;
            m = c.normals[(close ? 'gc' : 'gf') + b];
            // đã dùng cM trong chuỗi gatling thì bấm M lần nữa ra fM (và ngược lại)
            if (this.state === 'attack' && this.chain.includes(m.id)) {
              const alt = c.normals[(close ? 'gf' : 'gc') + b];
              if (alt && !this.chain.includes(alt.id)) m = alt;
            }
          } else m = c.normals['g5' + b];
        }
        if (!m) m = c.normals['g5' + b] || c.normals['gf' + b];
      }
      return m ? { move: m } : null;
    }

    canStart(m) {
      const air = this.isAir();
      if (m.air && !air) return false;
      if (!m.air && !m.airOK && air) return false;
      if (m.cost > 0 && this.res() < m.cost) return false;
      if (this.G.canStart && this.G.canStart(this, m) === false) return false;
      if (this.canActNow()) {
        if (this.state === 'airdash' && !(m.air || m.airOK)) return false;
        return true;
      }
      if (this.state === 'prejump' && m.charge && !m.air && this.w.phase === 'fight') return true;
      if (this.state === 'attack') return this.cancelOK(m);
      return false;
    }

    cancelOK(next) {
      const cur = this.move;
      if (!cur) return false;
      const d = cur.d;
      if (cur.airCancel && this.mf >= cur.airCancel && this.isAir() && (next.air || next.airOK)) return true;
      // FreeCancel=N: từ frame N cancel được sang bất kỳ normal/special/super nào (dash lao tới của Triangle)
      if (d.kv.FreeCancel && this.mf >= +d.kv.FreeCancel && next.id !== d.id && next.type !== 'Unique') return true;
      if (this.G.cancelOK) {
        const r = this.G.cancelOK(this, next);
        if (r !== undefined) return r;
      }
      if (!this.contact) return false;
      const t = this.mf;
      if (t > cur.su + cur.act + Math.min(C.CANCEL_EXTRA, cur.rec)) return false;
      const nt = next.type, ct = d.type;
      if (nt === 'Super') return cur.suc || cur.sc; // special cancel được thì super cancel được
      if (nt === 'Special' || nt === 'Spell' || nt === 'Unique' || nt === 'CmdGrab' || nt === 'AirGrab') {
        return NORMAL_T.has(ct) && cur.sc;
      }
      if (NORMAL_T.has(nt)) {
        if (!NORMAL_T.has(ct)) return false;
        if (next.air !== d.air) return false;
        if (this.G.gatling) return this.G.gatling(this, cur, next);
        const tc = tier(d), tn = tier(next);
        // L > M > H (L vào thẳng H cũng được); jab (L) tự gatling vào nhau và vào chính nó
        if (tn > tc) return next.btn === 'L' || !this.chain.includes(next.id);
        if (tn < tc) return false;
        if (tn === 1) return true;
        // cùng nút: bản đứng / ngồi (5X, 2X, 3X, cX, fX) cancel qua lại, mỗi chiêu một lần
        const variant = (m) => !!m.prox || m.dir === 5 || m.dir === 2 || m.dir === 3;
        return !d.air && variant(d) && variant(next) && next.id !== d.id && !this.chain.includes(next.id);
      }
      return false;
    }

    startMove(m, opts) {
      opts = opts || {};
      if (this.G.swap && !opts.noSwap) { const sw = this.G.swap(this, m); if (sw) m = sw; }
      const chCarry = !!(opts.chCarry && this.chMove);
      this.chMove = false;
      const prevAttack = this.state === 'attack' ? this.move : null;
      const inst = {
        d: m, id: m.id, su: m.su, act: m.act, rec: m.rec, hits: m.hits,
        hb: { x: m.hb.x, y: m.hb.y, w: m.hb.w, h: m.hb.h },
        dmgMul: 1, armorLeft: m.armor, armorVs: null,
        sc: m.sc, suc: m.suc, jc: m.jc, dc: m.dc, casterAct: m.casterAct,
        vel: m.vel, airCancel: +m.kv.AirCancel || 0, chCarry,
      };
      Object.assign(inst, opts.inst || {});
      if (this.G.modify) this.G.modify(this, inst);
      inst.su = Math.max(1, inst.su);
      inst.total = inst.su - 1 + inst.casterAct + inst.rec;
      if (this.buffs.burst > 0) inst.dmgMul *= 1 + this.buffs.dmgUp;
      if (m.type === 'Super') {
        this.w.spend(this.idx, m.cost);
        this.w.superFlash(this, m);
      } else if (m.cost > 0) this.w.spend(this.idx, m.cost);
      const fromDash = this.state === 'dash' || (prevAttack && prevAttack.d.kv.FreeCancel);
      this.momentum = fromDash ? this.vx * 0.9 : 0;
      if (m.charge) { const ch = this.inp.chg[m.charge.from]; ch.last = 0; ch.n = 0; }
      if (prevAttack && NORMAL_T.has(m.type)) this.chain.push(m.id);
      else this.chain = [m.id];
      const wasAir = this.isAir();
      this.setState('attack');
      this.move = inst;
      this.mf = 0;
      this.downTapsAtMove = this.inp.downTaps || 0;
      this.contact = null;
      this.hitIdx = -1;
      this.grabbed = false;
      this.moveAir = wasAir;
      if (!wasAir) { this.vy = 0; this.vx = this.momentum; }
      else if (m.type === 'Spell' || m.type === 'Burst' || m.kv.Proj) this.vy = Math.max(this.vy, 0) * 0.3;
      this.guard = false;
      this.vanish = false;
      this.w.onMoveStart(this, inst);
      if (this.G.onStart) this.G.onStart(this, inst);
    }

    attackStep() {
      const inst = this.move, d = inst.d;
      this.mf++;
      const t = this.mf;
      // frame 1 của chiêu được xử lý ngay frame bấm; hết frame `total` thì frame kế tiếp là frame tự do
      if (t > inst.total) {
        // AutoNext=ID: chiêu nhiều phần (vd 6H hất lên rồi bổ xuống) tự nối sang phần sau
        const nx = d.kv.AutoNext && this.c.byId[d.kv.AutoNext];
        if (nx) { this.startMove(nx, { chCarry: true, noSwap: true }); this.attackStep(); return; }
        this.endMove();
        if (this.canActNow()) this.tryActions();
        return;
      }
      let velSet = false;
      for (const s of inst.vel) {
        if (t >= s.a && t <= s.b) {
          this.vx = s.vx * this.facing;
          if (s.vy !== 0 || this.moveAir) this.vy = s.vy;
          if (s.vy > 0) this.moveAir = true;
          velSet = true;
        }
      }
      if (t === 1 && d.tags.has('Airborne')) { this.moveAir = true; this.y = Math.max(this.y, 1); }
      if (!velSet) {
        if (this.moveAir) {
          let g = this.c.grav;
          if (d.type === 'Spell' || d.type === 'Burst' || (d.isProj && t <= inst.su + 4)) g *= 0.3;
          if (d.type === 'Burst' && t < inst.su + inst.act) { g = 0; this.vy = 0; }
          this.vy -= g;
        } else {
          this.vx = this.momentum;
          this.momentum *= 0.88;
          if (Math.abs(this.momentum) < 0.3) this.momentum = 0;
        }
      }
      // teleport
      if (d.kv.Teleport) {
        const mm = d.kv.Teleport.match(/^(\w+)(?::(\d+))?@(\d+)$/);
        if (mm && t === +mm[3]) this.teleport(mm[1], +(mm[2] || 0));
      }
      if (d.kv.Vanish) {
        const r = SO.range(d.kv.Vanish);
        this.vanish = !!(r && t >= r[0] && t <= r[1]);
      }
      if (d.isProj && t === inst.su) this.w.spawnProj(this, inst);
      if (d.kv.Script && t === inst.su && SO.SCRIPTS[d.kv.Script]) SO.SCRIPTS[d.kv.Script](this, inst);
      if (d.kv.Detonate && t === inst.su && SO.SCRIPTS.detonate) SO.SCRIPTS.detonate(this, inst);
      if (d.kv.Puppet && t === 1 && this.G.puppet) this.G.puppet(this, d.kv.Puppet);
      if (this.G.frame) this.G.frame(this, inst, t);
      const isGrab = d.type === 'Throw' || d.type === 'CmdGrab' || d.type === 'AirGrab' || d.tags.has('CmdGrab');
      if (isGrab && t >= inst.su && t < inst.su + Math.max(1, inst.act) && !this.grabbed) this.w.tryGrab(this, inst);
      if (this.state !== 'attack' || this.move !== inst) return; // bị đổi trạng thái trong lúc xử lý
      // jump cancel / dash cancel
      const inWin = t <= inst.su + inst.act + Math.min(C.CANCEL_EXTRA, inst.rec);
      const upBuf = this.inp.frame - this.inp.upT <= C.BUFFER;
      // jump cancel được cả khi trúng lẫn khi bị đỡ
      if (this.contact && inst.jc && inWin && upBuf && !this.moveAir) {
        this.startJump(this.inp.isUp() ? this.inp.rel : this.inp.dirAt(this.inp.upT), true);
        return;
      }
      // jump cancel trên không = nhảy kép
      if (this.contact && inst.jc && inWin && this.moveAir && this.inp.frame - this.inp.upTapT <= C.BUFFER &&
          this.airJumps > 0 && !this.superJump && !this.airdashed) {
        this.airJump(this.inp.dirAt(this.inp.upTapT));
        return;
      }
      if (this.contact && inst.dc && inWin && !this.moveAir) {
        const i = this.inp;
        if ((i.fwdTapT >= i.frame - 2) && i.fwdTapT - i.lastFwdTap <= C.DASH_WINDOW) { this.setState('dash'); return; }
      }
      // cancel bằng nút bấm
      this.tryActions();
    }

    endMove() {
      const d = this.move && this.move.d;
      this.vanish = false;
      if (this.isAir()) {
        this.setState('air');
        if (d && d.kv.Script === 'apex') { /* đã tính trong script */ }
      } else {
        this.setState(this.inp.isDown() ? 'crouch' : 'idle');
        this.faceOpp();
      }
    }

    teleport(kind, dist) {
      const o = this.opp;
      const side = SO.sign(this.x - o.x) || -this.facing;
      let nx = this.x;
      if (kind === 'behind') nx = o.x - side * 110;
      else if (kind === 'front') nx = o.x + side * 140;
      else if (kind === 'fwd') nx = this.x + this.facing * dist;
      else if (kind === 'back') nx = this.x - this.facing * dist;
      const lo = 80 + this.c.w / 2, hi = C.STAGE_W - 80 - this.c.w / 2;
      if (nx < lo || nx > hi) nx = kind === 'behind' ? o.x + side * 110 : SO.clamp(nx, lo, hi);
      this.w.fx.push({ type: 'ring', x: this.x, y: this.y + 90, t: 0, life: 12, r: 50, color: this.c.color });
      this.afterimg = 10;
      this.ghosts = (this.ghosts || []).concat([this.snapshot()]);
      this.x = nx;
      this.faceOpp();
      this.w.fx.push({ type: 'ring', x: this.x, y: this.y + 90, t: 0, life: 12, r: 50, color: this.c.color });
    }

    // Roman Cancel: vàng (đòn đang startup/active, đối thủ không bị stun) 25%,
    // đỏ (đối thủ đang hitstun/blockstun) 50%, tím (đang recovery / tự do / tự mình bị stun) 50%
    rcKind(rc) {
      const o = this.opp;
      const oppStun = o.state === 'hitstun' || o.state === 'airhit' || o.state === 'block';
      if (oppStun && this.state === 'attack') return { kind: 'red', cost: rc.cost, color: '#e03a2e' };
      if (this.state === 'attack' && this.move) {
        const m = this.move;
        const actEnd = m.su + Math.max(1, m.act) + (m.d.isProj ? 4 : 0);
        if (this.mf < actEnd && !oppStun) return { kind: 'yellow', cost: +rc.kv.YellowCost || C.RC_YELLOW, color: '#f2c21b' };
      }
      return { kind: 'purple', cost: rc.cost, color: '#9a4ad8' };
    }
    doRC(rc, rk) {
      const W = this.w;
      rk = rk || this.rcKind(rc);
      W.spend(this.idx, rk.cost);
      const wasStun = this.state === 'hitstun' || this.state === 'airhit';
      const R = +rc.kv.Radius || 260, slow = +rc.kv.Slow || 40, push = +rc.kv.PushBack || 12;
      const keepVx = this.vx;
      this.move = null;
      if (this.isAir()) { this.setState('air'); this.vy = Math.max(this.vy, 3); this.moveAir = false; }
      else this.setState('idle');
      if (rk.kind === 'yellow') this.vx = keepVx; // giữ đà để lao vào sau khi bắn projectile
      this.invT = 6;
      this.hitstop = 0;
      const o = this.opp;
      if (rk.kind === 'yellow') {
        if (Math.abs(o.x - this.x) < R * 2.2) o.slow = Math.max(o.slow, slow - 8);
      } else if (Math.abs(o.x - this.x) < R + 120) {
        o.slow = Math.max(o.slow, slow);
        if (rk.kind === 'red' && (o.state === 'airhit')) o.vy = Math.max(o.vy, 4);
        if (wasStun || rk.kind === 'purple') {
          const pv = SO.sign(o.x - this.x) * push * (wasStun ? 1 : 0.6);
          o.vx = pv;
          if (o.state === 'attack' && !o.isAir()) o.pushV = pv;
        }
      }
      W.fx.push({ type: 'ring', x: this.x, y: this.y + 90, t: 0, life: 22, r: R, color: rk.color, thick: 7 });
      W.fx.push({ type: 'ring', x: this.x, y: this.y + 90, t: 0, life: 14, r: R * 0.6, color: rk.color, thick: 4 });
      W.fx.push({ type: 'text', x: this.x, y: this.y + 230, text: rk.kind.toUpperCase() + ' ROMAN CANCEL', t: 0, life: 40, color: rk.color });
      W.screenFlash = { t: 0, life: 8, color: rk.color + '55' };
      W.hitstopBoth(6);
    }

    doBurst(kind) {
      const m = SO.sysMove(this.c, kind === 'D' ? 'BURST_D' : 'BURST_O');
      this.burst = 0;
      this.combo = { hits: 0, scale: 1, dmg: 0 };
      this.ko = false;
      const wasAir = this.isAir();
      this.setState('attack');
      this.startMove(m, { force: true });
      this.moveAir = wasAir;
      if (kind === 'O') {
        this.buffs.burst = +m.kv.Buff || 300;
        this.buffs.dmgUp = +m.kv.DmgUp || 0.15;
        this.buffs.grayRegen = +m.kv.GrayRegen || 1.5;
      }
      this.w.fx.push({ type: 'ring', x: this.x, y: this.y + 100, t: 0, life: 26, r: 240, color: kind === 'D' ? '#3a7bd5' : '#e6a700', thick: 8 });
      this.w.fx.push({ type: 'text', x: this.x, y: this.y + 250, text: kind === 'D' ? 'BURST!' : 'OFFENSIVE BURST!', t: 0, life: 45 });
    }

    takeDamage(dmg) {
      this.hp -= dmg;
      if (this.buffs.burst > 0) this.gray = 0;
      else this.gray = Math.min(this.gray + dmg * C.GRAY_RATIO, this.c.hp - Math.max(0, this.hp));
      if (this.hp < 0) this.hp = 0;
    }
  }

  SO.Fighter = Fighter;
  SO.SCRIPTS = SO.SCRIPTS || {};
})();

</script>
<script>/* js/world.js */
'use strict';
// =============================================================================
// SQUARED OFF - World: vòng lặp trận đấu, va chạm, projectile, throw, round
// =============================================================================
(function () {
  const SO = window.SO;
  const C = SO.CFG;
  let projId = 0;

  class World {
    constructor(p1, p2, mode) {
      this.mode = mode; // 'versus' | 'training'
      this.training = mode === 'training';
      this.f = [new SO.Fighter(this, 0, p1), new SO.Fighter(this, 1, p2)];
      this.frame = 0;
      this.score = [0, 0];
      this.round = 1;
      this.dummy = { stance: 'stand', block: 'none', tech: true, refill: true, p1Meter: false };
      this.stats = { lastAdv: null, lastMove: [null, null], comboDmg: 0, comboHits: 0, comboShowT: 0 };
      this.startRound();
    }

    startRound() {
      const mid = C.STAGE_W / 2;
      this.f[0].resetRound(mid - 230, 1);
      this.f[1].resetRound(mid + 230, -1);
      this.projs = [];
      this.fx = [];
      this.parts = [];
      this.screenFlash = null;
      this.quake = 0;
      this.eq = 0;
      this.timer = C.ROUND_TIME * 60;
      this.freeze = 0;
      this.slowmo = null;
      this.chZoom = null;
      this.flash = null;
      this.grab = null;
      this.koSlow = 0;
      this.phase = this.training ? 'fight' : 'intro';
      this.phaseT = 0;
      this.winner = -1;
      this.rnd = 0;
    }

    // ---------------------------------------------------------------- Equilibrium
    res(i) { return i === 0 ? (this.eq + 100) / 2 : (100 - this.eq) / 2; }
    gain(i, amt) {
      const lim = 100 - 2 * C.EQ_FLOOR; // 50
      this.eq = SO.clamp(this.eq + (i === 0 ? 2 * amt : -2 * amt), -lim, lim);
    }
    spend(i, amt) {
      if (this.res(i) < amt - 1e-6) return false;
      this.gain(i, -amt);
      return true;
    }

    // ---------------------------------------------------------------- input
    inputFor(i) {
      if (this.training && i === 1 && this.dummy.stance !== 'manual') return this.dummyInput();
      if (this.cpuInput && this.cpuInput[i]) return this.cpuInput[i](this, i);
      return SO.readRaw(i);
    }
    dummyInput() {
      const d = this.f[1], a = this.f[0], set = this.dummy;
      const r = { up: false, down: false, left: false, right: false, L: false, M: false, H: false, U: false, pause: false };
      if (set.stance === 'crouch') r.down = true;
      if (set.stance === 'jump' && (d.state === 'idle' || d.state === 'land' || d.state === 'walk')) r.up = true;
      let block = set.block === 'all' || (set.block === 'after' && d.blockArm > 0) || (set.block === 'random' && this.rnd < 0.5);
      if (block && (d.threatened() || d.state === 'block')) {
        let srcX = a.x;
        const near = this.projs.find((p) => p.owner === a && !p.dead);
        if (near && !(a.state === 'attack')) srcX = near.x;
        if (srcX < d.x) r.right = true; else r.left = true;
        let blk = a.move ? a.move.d.blk : 'Mid';
        if (near && a.state !== 'attack') blk = near.inst.d.blk;
        if (blk === 'Low') r.down = true;
        else if (blk === 'High') r.down = false;
        r.up = false;
      }
      if (set.tech && d.state === 'airhit' && d.sf >= d.untech) r.L = this.frame % 2 === 0;
      return r;
    }

    // ---------------------------------------------------------------- main step
    step() {
      this.frame++;
      for (const f of this.f) f.readInput(this.inputFor(f.idx));
      this.updateFx();
      if (this.phase === 'intro') {
        this.phaseT++;
        for (const f of this.f) { f.vx = 0; f.faceOpp(); }
        if (this.phaseT >= 100) { this.phase = 'fight'; this.phaseT = 0; }
        return;
      }
      if (this.phase === 'roundEnd' || this.phase === 'matchEnd') {
        this.phaseT++;
      }
      if (this.freeze > 0) {
        this.freeze--;
        if (this.freeze === 0) this.flash = null;
        return;
      }
      if (this.chZoom) { this.chZoom.t++; if (this.chZoom.t >= this.chZoom.life) this.chZoom = null; }
      if (this.slowmo && this.slowmo.t > 0) {
        this.slowmo.t--;
        if (this.frame % this.slowmo.every) return;
      }
      if (this.koSlow > 0) {
        this.koSlow--;
        if (this.koSlow % 3) return;
      }
      for (const f of this.f) f.px = f.x;
      for (const f of this.f) f.tick();
      this.updateGrab();
      for (const p of this.projs) this.updateProj(p);
      SO.FXR.tick(this);
      for (const f of this.f) if (f.G.worldUpdate) f.G.worldUpdate(f);
      this.resolvePush();
      this.resolveCombat();
      this.projs = this.projs.filter((p) => !p.dead);
      this.gauges();
      this.rounds();
    }

    hitstopBoth(n) {
      for (const f of this.f) f.hitstop = Math.max(f.hitstop, n);
    }
    superFlash(f, m) {
      this.freeze = C.SUPER_FLASH;
      this.flash = { owner: f, t: 0, name: m.name };
      this.fx.push({ type: 'text', x: f.x, y: f.y + 260, text: m.name.toUpperCase(), t: 0, life: 50, big: true });
    }

    onMoveStart(f, inst) {
      this.stats.lastMove[f.idx] = { inst, startFrame: this.frame };
      if (f.idx === 0 && this.dummy.block === 'random') this.rnd = Math.random();
    }
    onRecover(f, prev) {
      if (prev === 'hitstun' || prev === 'airhit' || prev === 'knockdown' || prev === 'wakeup') f.blockArm = 50;
      // frame advantage: khi người bị đánh/block thoát stun, so với người tấn công
      if (prev === 'block' || prev === 'hitstun') {
        this.advPending = { def: f.idx, frame: this.frame };
      }
    }

    // ---------------------------------------------------------------- push / walls
    resolvePush() {
      const [a, b] = this.f;
      const lo = (f) => 80 + f.c.w / 2, hi = (f) => C.STAGE_W - 80 - f.c.w / 2;
      const pass = (f) => (f.state === 'attack' && f.move && f.move.d.tags.has('PassThrough') && f.mf >= f.move.su - 1 && f.mf < (f.move.act > 0 ? f.move.su + f.move.act + 6 : f.move.total)) || f.vanish;
      if (!this.grab && !pass(a) && !pass(b) && a.state !== 'ko' && b.state !== 'ko') {
        const pa = a.pushbox(), pb = b.pushbox();
        if (SO.overlap(pa, pb)) {
          const ov = (pa.w + pb.w) / 2 - Math.abs(pa.cx - pb.cx);
          let dir = SO.sign(b.x - a.x);
          if (dir === 0) dir = a.facing;
          a.x -= (dir * ov) / 2;
          b.x += (dir * ov) / 2;
        }
      }
      for (const f of this.f) f.x = SO.clamp(f.x, lo(f), hi(f));
      // lại đẩy sau khi chạm tường
      if (!this.grab && !pass(a) && !pass(b)) {
        const pa = a.pushbox(), pb = b.pushbox();
        if (SO.overlap(pa, pb)) {
          const ov = (pa.w + pb.w) / 2 - Math.abs(pa.cx - pb.cx);
          let dir = SO.sign(b.x - a.x) || a.facing;
          if (a.x <= lo(a) + 1 || a.x >= hi(a) - 1) b.x += dir * ov;
          else a.x -= dir * ov;
          for (const f of this.f) f.x = SO.clamp(f.x, lo(f), hi(f));
        }
      }
      // mép màn hình: camera cố định zoom nên hai người không thể xa nhau quá bề rộng khung nhìn.
      // Ai đang di chuyển ra xa thì bị chặn (như đụng tường), người kia không bị kéo theo.
      const maxD = C.VIEW_W - a.c.w * 0.5 - b.c.w * 0.5 - C.SCREEN_MARGIN * 2;
      const d = b.x - a.x;
      if (Math.abs(d) > maxD) {
        const over = Math.abs(d) - maxD;
        const s = SO.sign(d) || 1;
        const awayA = Math.max(0, -(a.x - (a.px ?? a.x)) * s), awayB = Math.max(0, (b.x - (b.px ?? b.x)) * s);
        const tot = awayA + awayB;
        const ka = tot > 0 ? awayA / tot : 0.5;
        a.x += s * over * ka;
        b.x -= s * over * (1 - ka);
        for (const f of this.f) f.x = SO.clamp(f.x, lo(f), hi(f));
      }
    }

    // ---------------------------------------------------------------- projectiles
    spawnProj(f, inst) {
      const d = inst.d;
      const kind = d.kv.Proj;
      const count = Math.max(1, +d.kv.Count || 1);
      for (let k = 0; k < count; k++) {
        const p = this.makeProj(f, inst, kind, k, count);
        if (p) this.projs.push(p);
      }
      if (f.G.onSpawn) f.G.onSpawn(f, inst);
    }
    makeProj(f, inst, kind, k, count, override) {
      const d = inst.d, fc = f.facing, hb = inst.hb;
      const p = {
        id: ++projId, owner: f, inst, kind, t: 0, delay: 0, life: Math.max(1, inst.act),
        hitsLeft: Math.max(1, Math.round(inst.hits / count)), cool: 0, hitstop: 0, facing: fc,
        w: hb.w, h: hb.h, x: 0, y: 0, vx: 0, vy: 0, dead: false, boosted: false, clash: false,
        color: f.c.color,
      };
      const dist = +d.kv.Dist || 0, gap = +d.kv.Gap || 0, stepF = +d.kv.Step || 0, delayK = +d.kv.Delay || 0;
      switch (kind) {
        case 'straight': case 'orb':
          p.x = f.x + fc * hb.x; p.y = f.y + hb.y; p.vx = fc * d.spd; p.clash = true; p.delay = k * stepF;
          if (kind === 'orb') p.hitsLeft = Math.max(1, Math.round(inst.hits / count));
          break;
        case 'disc':
          p.x = f.x + fc * (hb.x + k * 40); p.y = hb.y; p.vx = fc * d.spd; p.clash = true; p.delay = k * stepF;
          break;
        case 'ray': {
          // tia chéo bắn lên từ mặt đất (Circle 236L); bản EX bắn nhiều tia nối tiếp ra xa
          const a = ((+d.kv.Angle || 40) * Math.PI) / 180;
          p.x = f.x + fc * (dist + k * gap); p.y = Math.max(hb.y, 20); p.vx = fc * d.spd * Math.cos(a); p.vy = d.spd * Math.sin(a);
          p.delay = k * stepF; p.clash = true; p.kind = 'ray';
          break;
        }
        case 'angled': {
          const a = ((+d.kv.Angle || 0) * Math.PI) / 180;
          p.x = f.x + fc * hb.x; p.y = f.y + hb.y; p.vx = fc * d.spd * Math.cos(a); p.vy = d.spd * Math.sin(a); p.clash = true;
          break;
        }
        case 'bomb':
          p.x0 = f.x + fc * 40; p.y0 = f.y + hb.y;
          p.x = f.x + fc * dist; p.y = Math.max(hb.y, f.y + hb.y * 0.6);
          p.fuse = +d.kv.Fuse || 15; p.delay = p.fuse + k * stepF; p.travel = true;
          break;
        case 'pillar': case 'wave':
          p.x = f.x + fc * (dist + k * gap); p.y = hb.y; p.delay = delayK + k * stepF; p.warn = true;
          break;
        case 'cloud':
          p.x = f.x + fc * dist; p.y = hb.y;
          break;
        case 'beam':
          p.anchor = true; p.offX = hb.x + hb.w / 2; p.offY = hb.y; p.x = f.x + fc * p.offX; p.y = f.y + hb.y;
          break;
        case 'burst':
          p.anchor = true; p.offX = hb.x; p.offY = hb.y; p.x = f.x + fc * hb.x; p.y = f.y + hb.y;
          break;
        case 'rain': {
          const o = f.opp, spread = +d.kv.Spread || 0;
          p.x = o.x + (k - (count - 1) / 2) * spread; p.y = 950 + k * 30; p.vy = -28; p.delay = k * stepF;
          p.life = inst.act + 45; p.fall = true;
          break;
        }
        case 'line':
          break;
        default:
          p.x = f.x + fc * hb.x; p.y = f.y + hb.y; p.vx = fc * d.spd;
      }
      if (kind === 'wave') {
        p.hitsLeft = 1;
      }
      // projectile có tag Fullscreen bay tới hết màn hình (Active chỉ còn ý nghĩa hiển thị)
      if (d.tags.has('Fullscreen') && (kind === 'straight' || kind === 'angled' || kind === 'orb')) p.life = 400;
      if (d.kv.Life) p.life = +d.kv.Life;
      // Arm=N: projectile hiện ra nhưng chưa gây sát thương trong N frame (đĩa đặt bẫy của Triangle)
      p.arm = +d.kv.Arm || 0;
      p.life += p.arm;
      p.friction = +d.kv.Friction || 1;
      if (override) Object.assign(p, override);
      const multi = ['orb', 'cloud', 'beam', 'pillar', 'burst', 'wave', 'line', 'rain'].includes(kind);
      p.interval = multi || p.arm ? Math.max(3, Math.floor((p.life - (p.arm || 0)) / Math.max(1, p.hitsLeft))) : 6;
      if (kind === 'pillar' && p.hitsLeft > 1) p.interval = Math.max(3, Math.floor(p.life / p.hitsLeft));
      return p;
    }
    projActive(p) { return !p.dead && p.delay <= 0 && p.t >= (p.arm || 0); }
    updateProj(p) {
      if (p.dead) return;
      if (p.hitstop > 0) { p.hitstop--; return; }
      if (p.delay > 0) { p.delay--; return; }
      p.t++;
      const o = p.owner;
      if (p.anchor) {
        p.x = o.x + o.facing * p.offX;
        p.y = o.y + p.offY;
        p.facing = o.facing;
        if (o.state === 'hitstun' || o.state === 'airhit' || o.state === 'thrown') p.dead = true;
      }
      if (p.friction !== 1) p.vx *= p.friction;
      p.x += p.vx;
      p.y += p.vy;
      if (p.fall && p.y - p.h / 2 <= 0) { p.y = p.h / 2; p.vy = 0; if (!p.landed) { p.landed = true; p.life = Math.min(p.life, 14); this.fx.push({ type: 'dust', x: p.x, y: 0, t: 0, life: 16, big: true }); } }
      if (p.kind === 'angled' && p.y <= 8) { p.dead = true; this.fx.push({ type: 'spark', x: p.x, y: 10, t: 0, life: 10, color: p.color, size: 30 }); }
      if (p.cool > 0) p.cool--;
      if (p.kind === 'orb' && p.inst.d.tags.has('Push')) {
        const d = o.opp;
        if (Math.abs(d.x - p.x) < p.w / 2 + 40 && d.y < p.y + p.h / 2) d.x += SO.sign(p.vx) * 1.5;
      }
      if (p.kind === 'cloud' && p.inst.d.tags.has('BlockProj')) {
        for (const q of this.projs) if (q.owner !== o && q.clash && !q.dead && Math.abs(q.x - p.x) < p.w / 2 && Math.abs(q.y - p.y) < p.h / 2) { q.dead = true; this.fx.push({ type: 'spark', x: q.x, y: q.y, t: 0, life: 10, color: '#ccc', size: 30 }); }
      }
      p.life--;
      if (p.life <= 0) p.dead = true;
      if (p.x < -200 || p.x > C.STAGE_W + 200) p.dead = true;
    }
    projBox(p) {
      return { cx: p.x, cy: p.y, w: p.w, h: p.h };
    }
    projHits(p, box) {
      if (p.kind === 'line') {
        for (let s = 0; s <= 14; s++) {
          const x = p.x1 + ((p.x2 - p.x1) * s) / 14, y = p.y1 + ((p.y2 - p.y1) * s) / 14;
          if (Math.abs(x - box.cx) * 2 < box.w + p.thick && Math.abs(y - box.cy) * 2 < box.h + p.thick) return true;
        }
        return false;
      }
      return SO.overlap(this.projBox(p), box);
    }

    // ---------------------------------------------------------------- combat
    resolveCombat() {
      const contacts = [];
      for (const a of this.f) {
        const d = a.opp;
        if (a.state === 'ko') continue;
        const hb = a.activeHitbox();
        if (hb) {
          const cylHit = d.G.puppetHurt && d.G.puppetHurt(d, hb.box);
          if (cylHit) {
            a.hitIdx = hb.idx;
            a.contact = a.contact || 'hit';
            a.hitstop = 6;
            d.G.puppetStun(d);
          } else if (!d.isInvuln('strike') && d.state !== 'ko' && d.hurtboxes().some((h) => SO.overlap(hb.box, h))) {
            contacts.push({ type: 'strike', att: a, def: d, inst: a.move, idx: hb.idx, srcX: a.x, box: hb.box });
          }
        }
        if (a.G.puppetHit) {
          const ph = a.G.puppetHit(a);
          if (ph && !d.isInvuln('strike') && d.state !== 'ko' && d.hurtboxes().some((h) => SO.overlap(ph.box, h))) {
            contacts.push({ type: 'puppet', att: a, def: d, inst: ph.inst, idx: ph.idx, srcX: ph.x, box: ph.box, cyl: ph.cyl });
          }
        }
      }
      for (const p of this.projs) {
        if (!this.projActive(p) || p.cool > 0 || p.hitsLeft <= 0) continue;
        const o = p.owner, d = o.opp;
        if (d.G.puppetHurt && d.G.puppetHurt(d, this.projBox(p))) {
          d.G.puppetStun(d);
          p.hitsLeft--; p.cool = p.interval;
          if (p.hitsLeft <= 0 && p.clash) p.dead = true;
          continue;
        }
        if (d.state === 'ko' || d.isInvuln('proj')) continue;
        if (d.hurtboxes().some((h) => this.projHits(p, h))) {
          const srcX = p.anchor || p.kind === 'line' || p.kind === 'pillar' || p.kind === 'wave' || p.kind === 'cloud' || p.kind === 'rain' || p.kind === 'bomb' ? (p.kind === 'line' ? (p.x1 + p.x2) / 2 : p.anchor ? o.x : p.x) : p.x - SO.sign(p.vx || p.facing) * 30;
          contacts.push({ type: 'proj', att: o, def: d, inst: p.inst, proj: p, srcX: srcX === d.x ? o.x : srcX, box: this.projBox(p) });
        }
      }
      // projectile đụng nhau
      for (let i = 0; i < this.projs.length; i++) {
        const p = this.projs[i];
        if (!p.clash || !this.projActive(p) || p.dead) continue;
        for (let j = i + 1; j < this.projs.length; j++) {
          const q = this.projs[j];
          if (!q.clash || q.owner === p.owner || !this.projActive(q) || q.dead) continue;
          if (SO.overlap(this.projBox(p), this.projBox(q))) {
            p.hitsLeft--; q.hitsLeft--;
            if (p.hitsLeft <= 0) p.dead = true;
            if (q.hitsLeft <= 0) q.dead = true;
            p.hitstop = q.hitstop = 4;
            this.fx.push({ type: 'spark', x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, t: 0, life: 12, color: '#888', size: 50 });
          }
        }
      }
      for (const c of contacts) this.applyContact(c);
    }

    applyContact(c) {
      const { att, def, inst } = c;
      const d = inst.d;
      if (c.type === 'strike') att.hitIdx = c.idx;
      if (c.type === 'puppet' && c.cyl) c.cyl.hitIdx = c.idx;
      if (c.proj) { c.proj.hitsLeft--; c.proj.cool = c.proj.interval; }
      // parry (Octagon)
      if (def.G.parry && def.G.parry(def, att, c)) {
        this.afterProj(c);
        return;
      }
      // auto-guard
      if (def.state === 'attack' && def.move && def.move.d.kv.AutoGuard && d.type !== 'Super' && d.type !== 'Throw') {
        const r = SO.range(def.move.d.kv.AutoGuard);
        if (r && def.mf >= r[0] && def.mf <= r[1]) {
          const fu = def.c.byId[def.move.d.kv.Followup];
          def.hitstop = 8;
          if (c.type === 'strike') { att.hitstop = 8; att.contact = 'block'; }
          if (fu) def.startMove(fu, { force: true });
          this.fx.push({ type: 'text', x: def.x, y: def.y + 220, text: 'GUARD!', t: 0, life: 30 });
          this.fx.push({ type: 'block', x: (c.box.cx + def.x) / 2, y: c.box.cy, t: 0, life: 12, color: '#fff' });
          this.afterProj(c, true);
          return;
        }
      }
      // armor
      if (def.state === 'attack' && def.move && def.move.armorLeft > 0 && def.mf <= def.move.su + Math.max(0, def.move.act - 1) &&
          d.type !== 'Super' && armorOK(def.move.armorVs, d.blk)) {
        def.move.armorLeft--;
        let dmg = Math.round((d.dmg / inst.hits) * inst.dmgMul * 0.8);
        def.takeDamage(dmg);
        if (c.type === 'strike') { att.hitstop = d.hsa; att.contact = 'block'; }
        def.hitstop = d.hsd;
        this.fx.push({ type: 'spark', x: c.box.cx, y: c.box.cy, t: 0, life: 12, color: '#a0a', size: 60 });
        this.fx.push({ type: 'text', x: def.x, y: def.y + 230, text: 'ARMOR', t: 0, life: 30 });
        this.koCheck(def, att);
        this.afterProj(c);
        return;
      }
      if (this.wantsBlock(def, c, d)) this.doBlock(c);
      else this.doHit(c);
      this.afterProj(c);
    }
    afterProj(c, kill) {
      const p = c.proj;
      if (!p) return;
      if (kill || p.hitsLeft <= 0) {
        if (p.clash || kill) p.dead = true;
        else p.hitsLeft = 0;
      }
    }

    wantsBlock(def, c, d) {
      if (d.blk === 'Unblockable') return false;
      if (!def.canBlockNow()) return false;
      if (!def.holdingAwayFrom(c.srcX)) return false;
      if (!def.isAir()) {
        const crouch = def.inp.rel === 1;
        if (d.blk === 'High' && crouch) return false;
        if (d.blk === 'Low' && !crouch) return false;
      }
      return true;
    }

    doBlock(c) {
      const { att, def, inst } = c;
      const d = inst.d;
      const ib = def.inp.frame - def.inp.backStartT <= C.IB_WINDOW && def.state !== 'block';
      const fd = def.inp.heldCount() >= 2 && this.res(def.idx) > C.EQ_FLOOR + 0.01;
      let stun = def.stunBase(inst, true);
      if (ib) stun -= C.IB_STUN;
      const air = def.isAir();
      def.crouchBlock = !air && def.inp.rel === 1;
      def.airBlock = air;
      def.setState('block');
      def.stun = Math.max(C.MIN_STUN, stun);
      def.fd = fd;
      if (!fd && d.chip > 0) {
        const chip = Math.max(1, Math.round((d.chip / inst.hits) * inst.dmgMul));
        def.hp -= chip;
      }
      const dir = SO.sign(def.x - c.srcX) || att.facing;
      const push = Math.max(C.MIN_PUSH, d.kbx) * C.KBX_GROUND * (fd ? C.FD_PUSH : 1) * 0.9;
      def.vx = dir * push;
      if (air) def.vy = Math.max(def.vy, 2);
      if (c.type === 'strike' && def.atWall(dir)) att.pushV = -dir * push * 0.8;
      this.gain(att.idx, d.gain * 0.5);
      if (ib) {
        this.gain(def.idx, C.IB_GAIN);
        this.fx.push({ type: 'text', x: def.x, y: def.y + 220, text: 'INSTANT BLOCK', t: 0, life: 30 });
      }
      if (c.type === 'strike') { att.contact = att.contact || 'block'; att.hitstop = d.hsa; }
      else if (c.type === 'puppet' && c.cyl) { c.cyl.hitstop = d.hsa; c.cyl.contact = c.cyl.contact || 'block'; }
      def.hitstop = d.hsd;
      if (c.proj) c.proj.hitstop = Math.min(d.hsd, 6);
      this.fx.push({ type: 'block', x: c.box.cx - SO.sign(c.box.cx - def.x) * c.box.w * 0.3, y: c.box.cy, t: 0, life: 12, color: fd ? '#5c5' : '#5af', dir: -dir });
      SO.FXR.onBlock(this, c, fd);
      if (att.G.onContact) att.G.onContact(att, inst, 'block', c);
      if (def.hp <= 0) { def.hp = 0; this.koCheck(def, att); }
    }

    doHit(c) {
      const { att, def, inst } = c;
      const d = inst.d;
      let ch = def.state === 'attack' && def.move && def.mf < def.move.su + def.move.act && def.move.d.type !== 'Burst' && def.move.d.type !== 'Throw';
      if (inst.chCarry && def.combo.hits > 0) ch = true; // hit 2 của chiêu nhiều phần giữ trạng thái counter của hit 1
      if (ch && c.type === 'strike') att.chMove = true;
      const chTier = !ch ? 0 : d.type === 'Super' ? 3 : d.btn === 'L' ? 1 : d.btn === 'M' ? 2 : d.btn === 'H' ? 3 : d.dmg >= 70 ? 3 : 2;
      // CH=Kbt:Kby:Untech  → thuộc tính thay thế khi counter hit
      let kbt = d.kbt, kby = d.kby, untBase = d.unt;
      if (ch && d.kv.CH) { const p = d.kv.CH.split(':'); kbt = p[0] || kbt; if (p[1]) kby = +p[1]; if (p[2]) untBase = +p[2]; }
      const gBounce = d.tags.has('GroundBounce') || (ch && d.tags.has('CHGroundBounce'));
      if (def.combo.hits === 0) { def.combo.scale = 1; def.combo.dmg = 0; }
      const wasCrouch = def.isCrouchPose() && !def.isAir();
      let dmg = 0;
      if (d.dmg > 0) {
        dmg = Math.max(1, Math.round((d.dmg / inst.hits) * inst.dmgMul * def.combo.scale * (ch ? C.CH_DMG : 1)));
      }
      def.takeDamage(dmg);
      def.combo.scale = Math.max(C.PRORATION_FLOOR, def.combo.scale * d.pr);
      def.combo.hits++;
      def.combo.dmg += dmg;
      def.burst = Math.min(100, def.burst + dmg * C.BURST_ON_DMG);
      const away = SO.sign(def.x - c.srcX) || att.facing;
      const freeze = +d.kv.Freeze || 0;
      const airborneHit = def.isAir() || kbt === 'Launch' || kbt === 'Knockdown' || kbt === 'Hard_Knockdown' || gBounce;
