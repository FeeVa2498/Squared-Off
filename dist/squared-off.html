        ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.stroke();
        ctx.strokeStyle = ec; ctx.lineWidth = 3.5; ctx.stroke();
      }
    }
    if (fxs.has('ice') && act) {
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * 6.28 + f.w.frame * 0.2, r = 30;
        const x = tip[0] + Math.cos(a) * r, y = tip[1] + Math.sin(a) * r;
        R.sketchPoly(ctx, [[x, y - 12], [x + 6, y], [x, y + 12], [x - 6, y]], 900 + i, { fill: '#dff6ff', stroke: '#4aa7d6', width: 2, noSub: true, amp: 1 });
      }
    }
    if (fxs.has('stretch') && act) {
      ctx.strokeStyle = '#d65ba3';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const n = 10;
      for (let i = 0; i <= n; i++) {
        const x = g.sh[0] + ((tip[0] - g.sh[0]) * i) / n, y = g.sh[1] + ((tip[1] - g.sh[1]) * i) / n + (i % 2 ? -10 : 10) * (i && i < n ? 1 : 0);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    if (fxs.has('wind') && act) {
      ctx.strokeStyle = 'rgba(100,120,150,0.6)';
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(g.bx, g.bodyCY + 20 - i * 30, g.bw * (0.9 + i * 0.15), 18, 0, f.w.frame * 0.4 + i, f.w.frame * 0.4 + i + 2.5);
        ctx.stroke();
      }
    }
  };

  // ------------------------------------------------------------------ projectiles
  function spellColors(p) {
    const key = p.inst.spellKey || p.inst.d.kv.Spell;
    if (!key) return null;
    return key.split('').map((k) => SO.EL_COLOR[k]);
  }
  R.drawProj = function (ctx, p, W) {
    const seed = 400 + (p.id % 50);
    const cols = spellColors(p);
    const col = cols ? cols[0] : p.color;
    const col2 = cols ? cols[cols.length - 1] : R.shade(p.color, 0.4);
    if (p.delay > 0) {
      if (p.travel) {
        const k = 1 - p.delay / Math.max(1, p.fuse);
        const x = p.x0 + (p.x - p.x0) * Math.max(0, k), y = p.y0 + (p.y - p.y0) * Math.max(0, k);
        R.sketchEllipse(ctx, x, -y, 26, 24, seed, { fill: col, stroke: INK, width: 3 });
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.arc(x - 8, -y - 4, 4, 0, 7); ctx.arc(x + 8, -y - 4, 4, 0, 7); ctx.fill();
      } else if (p.warn) {
        ctx.globalAlpha = 0.5;
        ctx.setLineDash([8, 8]);
        R.sketchEllipse(ctx, p.x, -4, p.w / 2, 10, seed, { stroke: col, width: 4, fill: null });
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      } else if (p.fall) {
        ctx.globalAlpha = 0.4;
        R.sketchEllipse(ctx, p.x, -4, p.w / 2, 8, seed, { stroke: col, width: 3, fill: null });
        ctx.globalAlpha = 1;
      }
      return;
    }
    const armed = p.t >= (p.arm || 0);
    const fadeIn = armed ? Math.min(1, p.t / 3) : 0.35 + 0.25 * Math.sin(p.t * 0.4);
    ctx.globalAlpha = fadeIn;
    switch (p.kind) {
      case 'straight': case 'angled': case 'ray': {
        R.sketchEllipse(ctx, p.x, -p.y, p.w / 2, p.h / 2, seed, { fill: col, stroke: INK, width: 3.5, hatch: col2 });
        for (let i = 1; i <= 3; i++) R.sketchLine(ctx, p.x - SO.sign(p.vx || p.facing) * (p.w / 2 + i * 12), -p.y + (i - 2) * 10, p.x - SO.sign(p.vx || p.facing) * (p.w / 2 + i * 12 + 18), -p.y + (i - 2) * 10, seed + i, { stroke: col2, width: 3 });
        if (p.boosted) R.sketchEllipse(ctx, p.x, -p.y, p.w / 2 + 10, p.h / 2 + 10, seed + 4, { stroke: '#3f7fd8', width: 3, fill: null });
        break;
      }
      case 'orb': {
        const r = Math.min(p.w, p.h) / 2;
        R.sketchEllipse(ctx, p.x, -p.y, r, r, seed, { fill: 'rgba(255,255,255,0.4)', stroke: col, width: 5 });
        for (let i = 0; i < 4; i++) {
          const a = W.frame * 0.3 + i * 1.6;
          R.sketchLine(ctx, p.x, -p.y, p.x + Math.cos(a) * r * 0.9, -p.y + Math.sin(a) * r * 0.9, seed + i, { stroke: col2, width: 3 });
        }
        break;
      }
      case 'disc': {
        ctx.save(); ctx.translate(p.x, -p.y);
        R.sketchEllipse(ctx, 0, 0, p.w / 2, p.h / 2, seed, { fill: col, stroke: INK, width: 3 });
        R.sketchLine(ctx, -p.w / 2 * Math.cos(W.frame * 0.4), 0, p.w / 2 * Math.cos(W.frame * 0.4), 0, seed + 1, { stroke: INK, width: 2 });
        ctx.restore();
        break;
      }
      case 'bomb': case 'burst': {
        const k = p.t / Math.max(1, p.t + p.life);
        R.sketchEllipse(ctx, p.x, -p.y, p.w / 2 * (0.7 + k), p.h / 2 * (0.7 + k), seed, { fill: 'rgba(255,200,80,0.35)', stroke: col, width: 6 });
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          R.sketchLine(ctx, p.x + Math.cos(a) * p.w * 0.3, -p.y + Math.sin(a) * p.h * 0.3, p.x + Math.cos(a) * p.w * 0.55, -p.y + Math.sin(a) * p.h * 0.55, seed + i, { stroke: col2, width: 4 });
        }
        break;
      }
      case 'pillar': case 'wave': {
        const grow = Math.min(1, p.t / 4);
        const h = p.h * grow;
        R.sketchRect(ctx, p.x - p.w / 2, -(p.y - p.h / 2) - h, p.w, h, seed, { fill: col, stroke: INK, width: 4, hatch: col2 });
        break;
      }
      case 'cloud': {
        ctx.globalAlpha = 0.6 * fadeIn;
        for (let i = 0; i < 5; i++) {
          const a = i * 1.3 + W.frame * 0.03;
          R.sketchEllipse(ctx, p.x + Math.cos(a) * p.w * 0.25, -p.y + Math.sin(a) * p.h * 0.2, p.w * 0.3, p.h * 0.25, seed + i, { fill: col, stroke: col2, width: 3 });
        }
        break;
      }
      case 'beam': {
        const x0 = p.x - p.w / 2, x1 = p.x + p.w / 2;
        R.sketchRect(ctx, x0, -p.y - p.h / 2, p.w, p.h, seed, { fill: 'rgba(255,255,255,0.65)', stroke: col, width: 6 });
        const n = Math.round(p.w / 60);
        ctx.strokeStyle = col2; ctx.lineWidth = 4; ctx.beginPath();
        for (let i = 0; i <= n; i++) {
          const xx = x0 + (i / n) * p.w, yy = -p.y + (i % 2 ? -1 : 1) * p.h * 0.3 * Math.sin(W.frame + i);
          i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
        }
        ctx.stroke();
        void x1;
        break;
      }
      case 'rain': {
        R.sketchPoly(ctx, [[p.x, -p.y + p.h / 2], [p.x + p.w / 2, -p.y - p.h / 2], [p.x - p.w / 2, -p.y - p.h / 2]], seed, { fill: col, stroke: INK, width: 3, hatch: col2 });
        if (!p.landed) R.sketchLine(ctx, p.x, -p.y - p.h / 2, p.x, -p.y - p.h / 2 - 80, seed + 2, { stroke: col2, width: 3 });
        break;
      }
      case 'line': {
        ctx.strokeStyle = col;
        ctx.lineWidth = p.thick * 0.6;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        const n = 10;
        for (let i = 0; i <= n; i++) {
          const x = p.x1 + ((p.x2 - p.x1) * i) / n, y = p.y1 + ((p.y2 - p.y1) * i) / n + (i && i < n ? (Math.random() - 0.5) * 18 : 0);
          i ? ctx.lineTo(x, -y) : ctx.moveTo(x, -y);
        }
        ctx.stroke();
        break;
      }
      default:
        R.sketchEllipse(ctx, p.x, -p.y, p.w / 2, p.h / 2, seed, { fill: col, stroke: INK });
    }
    ctx.globalAlpha = 1;
    if (R.debug) {
      if (p.kind === 'line') {
        ctx.strokeStyle = '#f22'; ctx.lineWidth = p.thick; ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.moveTo(p.x1, -p.y1); ctx.lineTo(p.x2, -p.y2); ctx.stroke(); ctx.globalAlpha = 1;
      } else R.box(ctx, { cx: p.x, cy: p.y, w: p.w, h: p.h }, 'rgba(255,40,40,0.25)', '#f22');
    }
  };

  // ------------------------------------------------------------------ effects
  R.drawFx = function (ctx, e) {
    const k = e.t / e.life;
    ctx.globalAlpha = 1 - k * 0.9;
    const s = 700 + e.t;
    switch (e.type) {
      case 'hit': {
        const r = e.size * (0.6 + k * 0.6);
        const pts = [];
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * Math.PI * 2, rr = i % 2 ? r * 0.45 : r;
          pts.push([e.x + Math.cos(a) * rr, -e.y + Math.sin(a) * rr]);
        }
        R.sketchPoly(ctx, pts, s, { fill: 'rgba(255,255,255,0.85)', stroke: e.color || INK, width: 4, noSub: true });
        break;
      }
      case 'spark': {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + e.t * 0.1;
          R.sketchLine(ctx, e.x, -e.y, e.x + Math.cos(a) * e.size * (0.3 + k), -e.y + Math.sin(a) * e.size * (0.3 + k), s + i, { stroke: e.color, width: 3 });
        }
        break;
      }
      case 'block': {
        for (let i = -2; i <= 2; i++) {
          const a = i * 0.35;
          const d = e.dir || 1;
          R.sketchLine(ctx, e.x, -e.y, e.x + Math.cos(a) * 50 * d * (0.4 + k), -e.y + Math.sin(a) * 50 * (0.4 + k), s + i, { stroke: e.color, width: 4 });
        }
        break;
      }
      case 'ring':
        R.sketchEllipse(ctx, e.x, -e.y, e.r * (0.4 + k * 0.8), e.r * (0.4 + k * 0.8), s, { stroke: e.color, width: e.thick || 4, fill: null });
        break;
      case 'dust':
        for (let i = 0; i < (e.big ? 5 : 2); i++) {
          R.sketchEllipse(ctx, e.x + (i - 2) * 22 * (1 + k), -10 - k * 20, 14 * (1 + k), 9 * (1 + k), s + i, { stroke: '#8a7a6a', width: 2.5, fill: 'rgba(200,190,170,0.4)' });
        }
        break;
      case 'petals':
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + k * 2;
          R.sketchEllipse(ctx, e.x + Math.cos(a) * 90 * k, -e.y + Math.sin(a) * 90 * k, 10, 6, s + i, { fill: e.color, stroke: R.shade(e.color, -0.3), width: 2 });
        }
        break;
      case 'stop': {
        const r = 70 * (0.6 + Math.min(1, k * 3) * 0.4);
        const pts = [];
        for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + (i / 8) * Math.PI * 2; pts.push([e.x + Math.cos(a) * r, -e.y + Math.sin(a) * r]); }
        R.sketchPoly(ctx, pts, s, { fill: '#d33', stroke: '#fff', width: 6, noSub: true });
        ctx.fillStyle = '#fff'; ctx.font = 'bold 34px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('STOP', e.x, -e.y + 12);
        break;
      }
      case 'text': {
        const ts = Math.min(1, 1.5 / (R.cam.scale || 1));
        ctx.font = 'bold ' + Math.round((e.big ? 52 : 36) * ts) + 'px ' + FONT;
        ctx.textAlign = 'center';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#fff';
        const y = -e.y - k * 40;
        // giữ chữ trong khung hình
        const half = ctx.measureText(e.text).width / 2 + 10, vw = R.W / (R.cam.scale || 1);
        const tx = Math.min(Math.max(e.x, R.cam.x + half), R.cam.x + vw - half);
        ctx.strokeText(e.text, tx, y);
        ctx.fillStyle = e.color || INK;
        ctx.fillText(e.text, tx, y);
        break;
      }
    }
    ctx.globalAlpha = 1;
  };

  // ------------------------------------------------------------------ debug boxes
  R.drawBoxes = function (ctx, f) {
    const pb = f.pushbox();
    R.box(ctx, pb, 'rgba(40,200,40,0.08)', '#2a2');
    f.hurtboxes().forEach((b) => R.box(ctx, b, b.ext ? 'rgba(40,90,255,0.12)' : 'rgba(40,90,255,0.2)', '#2a5aff'));
    if (f.state === 'attack' && f.move) {
      const m = f.move, d = m.d;
      if (d.hasHitbox && !d.isProj && !d.kv.Detonate && f.mf >= m.su && f.mf < m.su + m.act) {
        const b = { cx: f.x + f.facing * m.hb.x, cy: f.y + m.hb.y, w: m.hb.w, h: m.hb.h };
        const grab = d.type === 'CmdGrab' || d.type === 'AirGrab' || d.tags.has('CmdGrab');
        R.box(ctx, b, grab ? 'rgba(255,220,0,0.3)' : 'rgba(255,40,40,0.3)', grab ? '#cc0' : '#f22');
      }
      if (d.type === 'Throw' && f.mf >= m.su && f.mf < m.su + Math.max(1, m.act)) {
        R.box(ctx, { cx: f.x + f.facing * f.c.throwR / 2, cy: f.y + 100, w: f.c.throwR, h: 160 }, 'rgba(255,220,0,0.3)', '#cc0');
      }
    }
  };

  // ------------------------------------------------------------------ particles
  R.drawParts = function (ctx, W) {
    for (const p of W.parts) {
      const k = p.t / p.life;
      const x = p.x, y = -p.y;
      switch (p.k) {
        case 'flame': {
          const r = p.size * (1 - k * 0.6);
          const c = k < 0.18 ? '#ffd84a' : k < 0.45 ? '#ff9a1f' : k < 0.78 ? '#e2401b' : 'rgba(90,80,80,0.45)';
          ctx.globalAlpha = 1 - k * 0.6;
          ctx.fillStyle = c;
          ctx.strokeStyle = k < 0.78 ? 'rgba(110,30,10,0.55)' : 'rgba(60,60,60,0.3)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x - r * 0.7, y);
          ctx.quadraticCurveTo(x - r * 0.6, y - r * 1.2, x + (Math.sin(p.rot) * r * 0.3), y - r * 1.8);
          ctx.quadraticCurveTo(x + r * 0.6, y - r * 1.2, x + r * 0.7, y);
          ctx.arc(x, y, r * 0.7, 0, Math.PI);
          ctx.fill();
          ctx.stroke();
          break;
        }
        case 'shard': {
          ctx.globalAlpha = 1 - k * 0.8;
          ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.strokeStyle = '#4aa7d6'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size * 0.45, 0); ctx.lineTo(0, p.size); ctx.lineTo(-p.size * 0.45, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
          break;
        }
        case 'bolt': {
          ctx.globalAlpha = 1 - k * 0.6;
          let bx = x, by = y;
          const a = p.rot;
          ctx.beginPath(); ctx.moveTo(bx, by);
          for (let i = 0; i < 4; i++) { bx += Math.cos(a) * p.size / 4 + (Math.random() - 0.5) * 14; by += Math.sin(a) * p.size / 4 + (Math.random() - 0.5) * 14; ctx.lineTo(bx, by); }
          ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 6; ctx.stroke();
          ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
          break;
        }
        case 'spark': {
          ctx.globalAlpha = 1 - k;
          ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * 2.2, y + p.vy * 2.2); ctx.stroke();
          break;
        }
        case 'streak': {
          ctx.globalAlpha = 1 - k;
          ctx.strokeStyle = p.color; ctx.lineWidth = 3;
          const len = p.size * (1 - k * 0.5), n = Math.hypot(p.vx, p.vy) || 1;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - (p.vx / n) * len, y + (p.vy / n) * len); ctx.stroke();
          break;
        }
        case 'smoke': case 'dust': {
          ctx.globalAlpha = (1 - k) * 0.9;
          const r = p.size * (0.5 + k * 0.8);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
          ctx.strokeStyle = 'rgba(80,70,60,0.35)'; ctx.lineWidth = 2; ctx.stroke();
          break;
        }
        case 'petal': {
          ctx.globalAlpha = 1 - k * 0.7;
          ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.strokeStyle = R.shade(p.color, -0.3); ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, 7); ctx.fill(); ctx.stroke();
          ctx.restore();
          break;
        }
        case 'debris': {
          ctx.globalAlpha = 1 - k * 0.5;
          ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.strokeStyle = '#3a2e22'; ctx.lineWidth = 2;
          const s = p.size;
          ctx.beginPath(); ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s * 0.2, -s); ctx.lineTo(s, -s * 0.3); ctx.lineTo(s * 0.6, s * 0.7); ctx.lineTo(-s * 0.7, s * 0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
          break;
        }
        case 'star': {
          ctx.globalAlpha = 1 - k;
          ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.strokeStyle = '#6b5a10'; ctx.lineWidth = 1.5;
          const s = p.size * (1 - k * 0.4);
          ctx.beginPath();
          for (let i = 0; i < 8; i++) { const a = (i / 8) * 6.28, r = i % 2 ? s * 0.35 : s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
          break;
        }
        case 'rainbow': {
          ctx.globalAlpha = 1 - k;
          ctx.fillStyle = 'hsl(' + ((p.hue + p.t * 8) % 360) + ',85%,62%)';
          ctx.beginPath(); ctx.arc(x, y, p.size * (1 - k * 0.5), 0, 7); ctx.fill();
          break;
        }
      }
    }
    ctx.globalAlpha = 1;
  };

  // hiệu ứng thế giới bổ sung (impact, nứt đất, vết chém)
  R.drawFx2 = function (ctx, e) {
    const k = e.t / e.life;
    if (e.type === 'impact') {
      ctx.globalAlpha = 1 - k;
      const n = 8 + e.lvl * 4, r0 = e.size * (0.3 + k), r1 = e.size * (0.8 + k * 1.6);
      ctx.strokeStyle = e.color; ctx.lineWidth = 2 + e.lvl * 0.6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = (i / n) * 6.28 + e.x * 0.01;
        ctx.moveTo(e.x + Math.cos(a) * r0, -e.y + Math.sin(a) * r0);
        ctx.lineTo(e.x + Math.cos(a) * r1 * (i % 2 ? 0.7 : 1), -e.y + Math.sin(a) * r1 * (i % 2 ? 0.7 : 1));
      }
      ctx.stroke();
      if (e.lvl >= 1) { ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, -e.y, e.size * (0.4 + k * 1.4), 0, 7); ctx.stroke(); }
    } else if (e.type === 'crack') {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (const dir of [-1, 1]) {
        let x = e.x, y = 2;
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let i = 0; i < 6; i++) { x += dir * (22 + SO.hash(i, e.x) * 20); y = 2 + (SO.hash(i + 9, e.x) - 0.5) * 16; ctx.lineTo(x, y); }
        ctx.stroke();
      }
    } else if (e.type === 'slashhit') {
      ctx.globalAlpha = 1 - k;
      const len = 170 * (0.6 + k * 0.6), w = 16 * (1 - k);
      const ca = Math.cos(e.ang), sa = Math.sin(e.ang);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = e.color; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(e.x - ca * len, -e.y - sa * len);
      ctx.lineTo(e.x - sa * w, -e.y + ca * w);
      ctx.lineTo(e.x + ca * len, -e.y + sa * len);
      ctx.lineTo(e.x + sa * w, -e.y - ca * w);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  };

  function ghostColor(f, g) {
    if (g.ghostKind === 'super') return R.shade(R.fighterColor(f), 0.15);
    if (g.ghostKind === 'burst') return '#ffcc33';
    return R.shade(R.fighterColor(f), 0.4);
  }

  // cut-in khi tung Super
  R.drawCutIn = function (ctx, W) {
    const fl = W.flash, o = fl.owner, t = fl.t;
    const left = o.idx === 0;
    const kin = Math.min(1, t / 7), kout = t > 22 ? (t - 22) / 8 : 0;
    const ease = (v) => 1 - Math.pow(1 - v, 3);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(20,18,30,' + (0.5 * (1 - kout)) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
    const col = R.fighterColor(o);
    const slide = (left ? -1 : 1) * (1 - ease(kin)) * 900 + (left ? 1 : -1) * kout * 1400;
    ctx.save();
    ctx.translate(slide, 0);
    const band = [[-200, 360], [R.W + 200, 270], [R.W + 200, 600], [-200, 690]];
    R.sketchPoly(ctx, band, 61, { fill: col, stroke: INK, width: 8, hatch: R.shade(col, -0.35) });
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 4;
    for (let i = 0; i < 14; i++) {
      const y = 330 + ((i * 37 + t * 9) % 320);
      const x = ((i * 211 + t * 70 * (left ? 1 : -1)) % 2400 + 2400) % 2400 - 200;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (left ? -1 : 1) * 260, y); ctx.stroke();
    }
    ctx.restore();
    // chân dung lớn
    const snap = o.snapshot();
    snap.x = 0; snap.y = 0; snap.state = 'idle'; snap.move = null; snap.facing = left ? 1 : -1;
    const sc = 2.3;
    const px = (left ? 420 : R.W - 420) + slide * 1.2;
    ctx.setTransform(sc, 0, 0, sc, px, 690);
    R.drawFighter(ctx, snap);
    // tên super
    ctx.setTransform(1, 0, -0.22, 1, 0, 0);
    ctx.font = 'italic bold 104px ' + FONT;
    ctx.textAlign = left ? 'right' : 'left';
    const tx = (left ? R.W - 40 : 260) - slide * 0.6, ty = 520;
    ctx.lineWidth = 16; ctx.strokeStyle = INK; ctx.strokeText(fl.name.toUpperCase(), tx, ty);
    ctx.fillStyle = '#fff'; ctx.fillText(fl.name.toUpperCase(), tx, ty);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  };

  R.render = function (ctx, W) {
    R.seed = Math.floor(W.frame / 6);
    R.updateCam(W);
    R.drawPaper(ctx);
    let shake = W.quake || 0;
    for (const f of W.f) if (f.hitstop > 0 && (f.state === 'hitstun' || f.state === 'airhit')) shake = Math.max(shake, f.hitstop * 0.9);
    W.shake = shake;
    R.drawStage(ctx, W);
    R.worldTransform(ctx, shake);
    for (const f of W.f) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath();
      ctx.ellipse(f.x, 4, f.c.w * 0.55 * Math.max(0.4, 1 - f.y / 600), 10, 0, 0, 7);
      ctx.fill();
    }
    for (const f of W.f) if (f.G.draw) f.G.draw(f, ctx, R);
    // afterimage
    for (const f of W.f) {
      for (const g of f.ghosts || []) {
        R.drawFighter(ctx, g, { ghost: true, alpha: 0.62 * (1 - g.age / 14), color: ghostColor(f, g) });
      }
    }
    const order = W.f.slice().sort((a, b) => (a.state === 'attack') - (b.state === 'attack'));
    for (const f of order) R.drawFighter(ctx, f);
    for (const p of W.projs) R.drawProj(ctx, p, W);
    R.drawParts(ctx, W);
    if (R.debug) for (const f of W.f) R.drawBoxes(ctx, f);
    for (const e of W.fx) {
      if (e.type === 'impact' || e.type === 'crack' || e.type === 'slashhit') R.drawFx2(ctx, e);
      else if (e.type !== 'banner') R.drawFx(ctx, e);
    }
    if (W.screenFlash) {
      const sf = W.screenFlash;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1 - sf.t / sf.life;
      ctx.fillStyle = sf.color;
      ctx.fillRect(0, 0, R.W, R.H);
      ctx.globalAlpha = 1;
    }
  };
})();

</script>
<script>/* js/game.js */
'use strict';
// =============================================================================
// SQUARED OFF - Game: menu, chọn nhân vật, HUD, pause, training, nạp CSV, loop
// =============================================================================
(function () {
  const SO = window.SO;
  const C = SO.CFG;
  const R = SO.R;
  const FONT = R.FONT;
  const INK = '#2a2a2a';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = R.W;
  canvas.height = R.H;

  SO.currentText = { moves: window.SO_DATA.moves, chars: window.SO_DATA.characters };

  const G = (SO.Game = {
    scene: 'title',
    menuIdx: 0,
    world: null,
    paused: false,
    pauseIdx: 0,
    mode: 'versus',
    sel: null,
    toast: null,
    moveList: null,
    help: false,
  });

  // ------------------------------------------------------------------ menu input
  const K = {
    up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    ok: ['KeyU', 'Enter', 'Space', 'Numpad4', 'Comma'], back: ['KeyI', 'Backspace', 'Numpad5', 'Period'],
    p1up: ['KeyW'], p1down: ['KeyS'], p1left: ['KeyA'], p1right: ['KeyD'], p1ok: ['KeyU', 'Enter', 'Space'], p1back: ['KeyI', 'Backspace'],
    p2up: ['ArrowUp'], p2down: ['ArrowDown'], p2left: ['ArrowLeft'], p2right: ['ArrowRight'], p2ok: ['Numpad4', 'Comma'], p2back: ['Numpad5', 'Period'],
    pause: ['Tab', 'Escape'],
  };
  let pressedNow = [];
  const hit = (name) => pressedNow.some((c) => K[name].includes(c));
  // gamepad -> phím ảo cho menu
  const padPrev = [{}, {}];
  function pollPads() {
    const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
    for (let i = 0; i < 2; i++) {
      const p = pads[i];
      if (!p) continue;
      const b = (n) => !!(p.buttons[n] && p.buttons[n].pressed);
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      const st = {
        up: b(12) || ay < -0.5, down: b(13) || ay > 0.5, left: b(14) || ax < -0.5, right: b(15) || ax > 0.5,
        ok: b(0) || b(2), back: b(1), pause: b(9),
      };
      const map = i === 0
        ? { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', ok: 'KeyU', back: 'KeyI', pause: 'Tab' }
        : { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', ok: 'Numpad4', back: 'Numpad5', pause: 'Escape' };
      for (const k in st) if (st[k] && !padPrev[i][k]) pressedNow.push(map[k]);
      padPrev[i] = st;
    }
  }

  function toast(msg, t) { G.toast = { msg, t: t || 240 }; }

  // ------------------------------------------------------------------ CSV nạp / xuất
  function reloadData(moves, chars) {
    try {
      SO.loadData(moves, chars);
      SO.currentText = { moves, chars };
      if (G.world) {
        for (const f of G.world.f) {
          if (!SO.DB.chars[f.name]) { toast('Character "' + f.name + '" is missing from the new CSV!', 360); continue; }
          f.refreshData();
        }
      }
      const nMoves = Object.values(SO.DB.chars).reduce((s, c) => s + c.moves.length, 0) + Object.keys(SO.DB.all).length;
      return nMoves;
    } catch (e) {
      console.error(e);
      toast('Could not read CSV: ' + e.message, 400);
      return -1;
    }
  }
  document.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drag'); });
  document.addEventListener('dragleave', () => document.body.classList.remove('drag'));
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('drag');
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    Promise.all(files.map((f) => f.text().then((t) => ({ name: f.name, t })))).then((list) => {
      let moves = SO.currentText.moves, chars = SO.currentText.chars, got = [];
      for (const { name, t } of list) {
        const head = t.replace(/^﻿/, '').split(/\r?\n/)[0];
        if (/Move_ID/.test(head)) { moves = t; got.push(name); }
        else if (/Walk_Fwd|Character,Prefix/.test(head)) { chars = t; got.push(name); }
      }
      if (!got.length) { toast('That file is not a moves.csv or characters.csv'); return; }
      const n = reloadData(moves, chars);
      if (n >= 0) toast('Loaded ' + got.join(', ') + ' (' + n + ' moves). Applies from the next move.');
    });
  });
  function download(name, text) {
    const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // ------------------------------------------------------------------ helpers vẽ
  function text(s, x, y, size, color, align, bold) {
    ctx.font = (bold === false ? '' : 'bold ') + size + 'px ' + FONT;
    ctx.textAlign = align || 'left';
    ctx.fillStyle = color || INK;
    ctx.fillText(s, x, y);
  }
  function outlined(s, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.lineWidth = Math.max(4, size / 7);
    ctx.strokeStyle = '#fff';
    ctx.strokeText(s, x, y);
    ctx.fillStyle = color || INK;
    ctx.fillText(s, x, y);
  }
  function panel(x, y, w, h, alpha) {
    ctx.globalAlpha = alpha || 0.92;
    R.sketchRect(ctx, x, y, w, h, x + y, { fill: '#fffaf0', stroke: INK, width: 3 });
    ctx.globalAlpha = 1;
  }
  function shapeIcon(name, cx, cy, size, color, seed) {
    const c = SO.DB.chars[name];
    if (!c) return;
    const pts = R.shapePoints(c.shape, size, size * (c.shape === 'oval' ? 1.3 : 1)).map((p) => [cx + p[0], cy + p[1]]);
    R.sketchPoly(ctx, pts, seed || 3, { fill: color || c.color, stroke: INK, width: 4, hatch: R.shade(color || c.color, -0.35) });
    if (c.shape === 'cone') R.sketchRect(ctx, cx + size * 0.45, cy - size * 0.1, size * 0.3, size * 0.55, (seed || 3) + 1, { fill: '#b87333', stroke: INK, width: 3 });
  }

  // ------------------------------------------------------------------ TITLE
  const TITLE_ITEMS = [
    { label: 'VERSUS', sub: '2 players, local', act: () => startSelect('versus') },
    { label: 'TRAINING', sub: 'practice against a dummy', act: () => startSelect('training') },
    { label: 'CONTROLS', sub: 'keys and system commands', act: () => { G.help = true; } },
  ];
  function updateTitle() {
    if (G.help) { if (hit('back') || hit('ok') || hit('pause')) G.help = false; return; }
    if (hit('up')) G.menuIdx = (G.menuIdx + TITLE_ITEMS.length - 1) % TITLE_ITEMS.length;
    if (hit('down')) G.menuIdx = (G.menuIdx + 1) % TITLE_ITEMS.length;
    if (hit('ok')) TITLE_ITEMS[G.menuIdx].act();
  }
  let titleT = 0;
  function skewText(s, x, y, size, fill, stroke, align, skew, lw) {
    ctx.save();
    ctx.setTransform(1, 0, skew === undefined ? -0.2 : skew, 1, 0, 0);
    ctx.font = 'italic bold ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'left';
    const sx = x - (skew === undefined ? -0.2 : skew) * y;
    if (stroke) { ctx.lineWidth = lw || Math.max(6, size / 7); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, sx, y); }
    ctx.fillStyle = fill;
    ctx.fillText(s, sx, y);
    ctx.restore();
  }
  function drawTitle() {
    titleT++;
    R.seed = Math.floor(titleT / 6);
    R.drawPaper(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const names = SO.DB.order;
    names.forEach((n, i) => {
      const a = (i / names.length) * Math.PI * 2 + titleT * 0.004;
      shapeIcon(n, 960 + Math.cos(a) * 780, 540 + Math.sin(a) * 400, 70, null, i + 10);
    });
    R.sketchPoly(ctx, [[300, 170], [1660, 120], [1620, 360], [260, 400]], 5, { fill: '#2a2a2a', stroke: '#2a2a2a', width: 4 });
    skewText('SQUARED OFF', 960, 330, 170, '#f6f1e3', '#e0574a', 'center', -0.18, 10);
    text('a doodle fighting game prototype · 60 FPS', 960, 450, 34, '#666', 'center', false);
    TITLE_ITEMS.forEach((it, i) => {
      const y = 590 + i * 110;
      const on = i === G.menuIdx;
      if (on) R.sketchPoly(ctx, [[640, y - 70], [1300, y - 82], [1280, y + 30], [620, y + 40]], 50 + i, { fill: '#ffe9a8', stroke: INK, width: 4 });
      skewText(it.label, 960, y, on ? 66 : 54, on ? INK : '#555', on ? '#fff' : null, 'center', -0.2, 8);
      if (on) text(it.sub, 960, y + 30, 26, '#6b5a3a', 'center', false);
    });
    text('W/S move · U or Enter confirm · drop moves.csv / characters.csv onto the window to load new data', 960, 1030, 26, '#555', 'center', false);
    if (G.help) drawHelp();
  }
  function drawHelp() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    panel(170, 90, 1580, 900);
    skewText('CONTROLS', 960, 170, 64, INK, '#fff', 'center');
    const rows = [
      ['', 'P1', 'P2'],
      ['Move', 'W A S D', 'Arrow keys'],
      ['Light (L)', 'U', 'Numpad 4  or  ,'],
      ['Medium (M)', 'I', 'Numpad 5  or  .'],
      ['Heavy (H)', 'O', 'Numpad 6  or  /'],
      ['Unique (U)', 'J', 'Numpad 1  or  Right Shift'],
      ['Pause', 'Tab', 'Esc'],
    ];
    rows.forEach((r, i) => {
      const y = 250 + i * 48;
      text(r[0], 260, y, 34, INK, 'left', i === 0);
      text(r[1], 700, y, 34, '#2a5aa8', 'left', i === 0);
      text(r[2], 1080, y, 34, '#a8452a', 'left', i === 0);
    });
    const sys = [
      'Throw / Throw break: L+M up close (hold 4 to throw backward) · break within 12f',
      'Roman Cancel: L+M+H (50% Equilibrium) · Dead Angle: L+M+H while blocking (25%)',
      'Burst: U + L/M/H · Faultless Defense: hold back + 2 buttons while blocking',
      'Dash 66 · Backdash 44 · Super jump 2 then 7/8/9 · Double jump · Airdash 66/44 · IAD 956 / 754',
      'Supers: 236236 + button / 214214 + button (50%) · F1 hitboxes · F2 frame data',
      'Gamepad: X = L, Y = M, B = H, A = U, Start = Pause',
    ];
    sys.forEach((s, i) => text(s, 260, 640 + i * 50, 30, INK, 'left', false));
    text('Press U / Enter to close', 960, 960, 28, '#777', 'center', false);
  }

  // ------------------------------------------------------------------ SELECT (kiểu Guilty Gear XX)
  // cụm icon so le 3-4-3
  const ROWS = [3, 4, 3];
  const ICON_W = 150, ICON_H = 118, GAP = 14, SKEW = -0.22;
  function iconLayout() {
    const out = [];
    let i = 0;
    ROWS.forEach((n, r) => {
      for (let k = 0; k < n; k++) {
        out.push({ i, r, x: 960 + (k - (n - 1) / 2) * (ICON_W + GAP), y: 300 + r * (ICON_H + GAP) });
        i++;
      }
    });
    return out;
  }
  const LAYOUT = iconLayout();
  function startSelect(mode) {
    G.mode = mode;
    G.scene = 'select';
    G.sel = { cur: [0, 1], done: [false, false], step: 0, changeT: [0, 0], lockT: [0, 0], readyT: 0 };
  }
  function moveCursor(i, dx, dy) {
    const s = G.sel;
    const n = Math.min(SO.DB.order.length, LAYOUT.length);
    const cur = LAYOUT[s.cur[i]];
    let next = s.cur[i];
    if (dx) {
      const row = LAYOUT.filter((l) => l.r === cur.r && l.i < n);
      const k = row.indexOf(cur);
      next = row[(k + dx + row.length) % row.length].i;
    } else if (dy) {
      const r2 = (cur.r + dy + ROWS.length) % ROWS.length;
      const row = LAYOUT.filter((l) => l.r === r2 && l.i < n);
      row.sort((a, b) => Math.abs(a.x - cur.x) - Math.abs(b.x - cur.x) || (dx >= 0 ? a.x - b.x : b.x - a.x));
      next = row[0].i;
    }
    if (next !== s.cur[i]) { s.cur[i] = next; s.changeT[i] = 0; }
  }
  function lock(i) {
    const s = G.sel;
    s.done[i] = true;
    s.lockT[i] = 0;
    const pf = previewFighter(i, SO.DB.order[s.cur[i]]);
    const m = pf.c.normals.g5H || pf.c.normals.g5M;
    try { if (m) pf.startMove(m, {}); } catch (e) { pf.setState('idle'); }
  }
  function updateSelect() {
    const s = G.sel;
    s.changeT[0]++; s.changeT[1]++; s.lockT[0]++; s.lockT[1]++;
    if (s.done[0] && s.done[1]) {
      s.readyT++;
      if (s.readyT > 50) beginFight();
      return;
    }
    if (G.mode === 'training') {
      const i = s.step;
      if (hit('left')) moveCursor(i, -1, 0);
      if (hit('right')) moveCursor(i, 1, 0);
      if (hit('up')) moveCursor(i, 0, -1);
      if (hit('down')) moveCursor(i, 0, 1);
      if (hit('ok')) { lock(i); if (i === 0) s.step = 1; }
      if (hit('back')) { if (s.step === 1) { s.step = 0; s.done[0] = false; } else G.scene = 'title'; }
      return;
    }
    for (let i = 0; i < 2; i++) {
      const pre = 'p' + (i + 1);
      if (!s.done[i]) {
        if (hit(pre + 'left')) moveCursor(i, -1, 0);
        if (hit(pre + 'right')) moveCursor(i, 1, 0);
        if (hit(pre + 'up')) moveCursor(i, 0, -1);
        if (hit(pre + 'down')) moveCursor(i, 0, 1);
        if (hit(pre + 'ok')) lock(i);
      } else if (hit(pre + 'back')) s.done[i] = false;
    }
    if (!s.done[0] && !s.done[1] && hit('p1back')) G.scene = 'title';
  }

  // nhân vật xem trước (vẽ bằng chính renderer trong trận)
  const PW = { frame: 0, f: [], fx: [], projs: [], parts: [], phase: 'fight', training: false, onMoveStart() {}, onRecover() {}, gain() {}, spend() { return true; }, res() { return 50; }, spawnProj() {}, tryGrab() {}, superFlash() {} };
  const pcache = {};
  function previewFighter(idx, name) {
    const key = idx + ':' + name;
    if (!pcache[key] || pcache[key].c !== SO.DB.chars[name]) {
      const f = new SO.Fighter(PW, idx, name);
      f.resetRound(0, idx === 0 ? 1 : -1);
      pcache[key] = f;
    }
    PW.f[idx] = pcache[key];
    return pcache[key];
  }
  const ease = (v) => 1 - Math.pow(1 - Math.min(1, Math.max(0, v)), 3);

  function drawSelect() {
    titleT++;
    PW.frame = titleT;
    R.seed = Math.floor(titleT / 6);
    const s = G.sel;
    const names = SO.DB.order;
    const ch = [SO.DB.chars[names[s.cur[0]]], SO.DB.chars[names[s.cur[1]]]];
    R.drawPaper(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // nền chéo hai màu
    ctx.globalAlpha = 0.32;
    R.sketchPoly(ctx, [[0, 0], [1080, 0], [840, 1080], [0, 1080]], 401, { fill: ch[0].color, stroke: null, hatch: R.shade(ch[0].color, -0.4) });
    R.sketchPoly(ctx, [[1080, 0], [1920, 0], [1920, 1080], [840, 1080]], 402, { fill: ch[1].color, stroke: null, hatch: R.shade(ch[1].color, -0.4) });
    ctx.globalAlpha = 1;
    // chữ nền lớn mờ
    ctx.globalAlpha = 0.07;
    for (let k = 0; k < 4; k++) skewText('SELECT', -200 + ((titleT * 1.2 + k * 700) % 2600), 760 + (k % 2) * 260, 300, INK, null, 'left', -0.25);
    ctx.globalAlpha = 1;
    // vết mực chéo giữa
    R.sketchLine(ctx, 1110, -20, 810, 1100, 403, { stroke: INK, width: 14 });
    R.sketchLine(ctx, 1140, -20, 840, 1100, 404, { stroke: INK, width: 4 });
    // banner trên
    R.sketchPoly(ctx, [[-40, 30], [1960, 0], [1960, 130], [-40, 150]], 405, { fill: INK, stroke: INK, width: 4 });
    skewText('CHARACTER SELECT', 70, 112, 76, '#f6f1e3', null, 'left');
    const modeTag = G.mode === 'training' ? (s.step === 0 ? 'TRAINING · PICK YOUR FIGHTER' : 'TRAINING · PICK THE DUMMY') : 'VERSUS';
    skewText(modeTag, 1860, 100, 40, '#ffd23f', null, 'right');

    // chân dung hai bên
    for (let p = 0; p < 2; p++) {
      if (G.mode === 'training' && p === 1 && s.step === 0 && !s.done[1]) continue;
      const pf = previewFighter(p, names[s.cur[p]]);
      if (pf.state === 'attack' && pf.move) {
        try { pf.attackStep(); } catch (e) { pf.setState('idle'); }
        if (pf.state !== 'attack') pf.setState('idle');
      } else if (pf.state !== 'idle') pf.setState('idle');
      pf.x = 0; pf.y = 0; pf.facing = p === 0 ? 1 : -1;
      const k = ease(s.changeT[p] / 12);
      const baseX = p === 0 ? 370 : 1550;
      const px = baseX + (p === 0 ? -1 : 1) * (1 - k) * 420;
      // spotlight
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 0.85 * k;
      R.sketchEllipse(ctx, px, 560, 280, 300, 410 + p, { fill: 'rgba(255,255,255,0.55)', stroke: pf.c.color, width: 6 });
      ctx.globalAlpha = 1;
      const sc = 2.5 * Math.min(1, 190 / pf.c.h);
      ctx.setTransform(sc, 0, 0, sc, px, 840);
      ctx.globalAlpha = k;
      if (pf.G.draw) pf.G.draw(pf, ctx, R);
      R.drawFighter(ctx, pf);
      ctx.globalAlpha = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // tên + archetype + gimmick
      const left = p === 0;
      const nx = left ? 60 : 1860;
      const ny = 930;
      const nm = pf.c.name.toUpperCase();
      const nk = ease((s.changeT[p] - 3) / 10);
      ctx.globalAlpha = nk;
      skewText(nm, nx + (left ? -1 : 1) * (1 - nk) * 200, ny, nm.length > 9 ? 96 : 118, pf.c.color, INK, left ? 'left' : 'right', -0.2, 12);
      const tag = (left ? '1P · ' : (G.mode === 'training' ? 'DUMMY · ' : '2P · ')) + pf.c.arch.toUpperCase();
      ctx.font = 'italic bold 30px ' + FONT;
      const tw = ctx.measureText(tag).width + 50;
      const tx = left ? nx : nx - tw;
      R.sketchPoly(ctx, [[tx, 950], [tx + tw, 946], [tx + tw - 14, 990], [tx - 14, 994]], 420 + p, { fill: INK, stroke: INK, width: 2 });
      skewText(tag, tx + 22, 982, 30, left ? '#ff8a7a' : '#8ab4ff', null, 'left');
      ctx.globalAlpha = 1;
      // dải giấy mô tả gimmick
      const gx = left ? 40 : 1880 - 600;
      ctx.save();
      ctx.translate(gx + 300, 1040);
      ctx.rotate(left ? -0.012 : 0.012);
      R.sketchRect(ctx, -300, -40, 600, 80, 430 + p, { fill: '#fffaf0', stroke: '#888', width: 2 });
      ctx.font = '17px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillStyle = INK;

      wrapCenter(cut, 0, -2, 580, 17, 21);
      ctx.restore();
      if (s.done[p]) {
        const lk = Math.min(1, s.lockT[p] / 6);
        ctx.save();
        ctx.translate(baseX, 300);
        ctx.rotate(left ? -0.15 : 0.15);
        ctx.scale(2 - lk, 2 - lk);
        ctx.globalAlpha = lk;
        R.sketchRect(ctx, -110, -48, 220, 92, 440 + p, { fill: left ? '#d33' : '#36c', stroke: '#fff', width: 6 });

    // cụm icon

      ctx.setTransform(1, 0, 0, 1, 0, 0);

    // con trỏ
    for (let p = 0; p < 2; p++) {
      if (G.mode === 'training' && p === 1 && s.step === 0) continue;

      ctx.globalAlpha = blink;
      R.sketchRect(ctx, L.x - ICON_W / 2 - pad, L.y - ICON_H / 2 - pad, ICON_W + pad * 2, ICON_H + pad * 2, 520 + p, { stroke: pc, width: s.done[p] ? 9 : 7, fill: null });

      ctx.setTransform(1, 0, 0, 1, 0, 0);

    // gợi ý điều khiển
    R.sketchPoly(ctx, [[620, 712], [1300, 704], [1290, 748], [610, 756]], 450, { fill: INK, stroke: INK, width: 2 });
    const hint = G.mode === 'training' ? 'P1 picks both · U / Enter confirm · I / Backspace back' : '1P: WASD + U   ·   2P: arrows + Numpad4 (or ,)   ·   I / Numpad5 cancel';
    text(hint, 955, 739, 22, '#f6f1e3', 'center', false);
    if (s.done[0] && s.done[1]) {
      const k = ease(s.readyT / 10);

      ctx.fillStyle = 'rgba(20,18,30,0.35)';
      ctx.fillRect(0, 0, R.W, R.H);
      skewText("LET'S ROCK!", 960 + (1 - k) * 600, 600, 170, '#ffd23f', INK, 'center', -0.2, 16);

  }
  function wrapCenter(str, x, y, maxW, size, lh) {
    const words = String(str).split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    const y0 = y - ((Math.min(3, lines.length) - 1) * lh) / 2 + 6;
    lines.slice(0, 3).forEach((l, i) => ctx.fillText(l, x, y0 + i * lh));
  }

  // ------------------------------------------------------------------ FIGHT
  function beginFight() {
    const names = SO.DB.order;
    G.p1 = names[G.sel.cur[0]];
    G.p2 = names[G.sel.cur[1]];

  SO.newMatch = function (p1, p2, mode) {

    G.world = new SO.World(p1, p2, G.mode);
    G.scene = 'fight';

  };

  function pauseItems() {
    const W = G.world, d = W.dummy;
    const items = [
      { label: 'Resume', act: () => (G.paused = false) },
      { label: 'Hitboxes (F1): ' + (R.debug ? 'ON' : 'OFF'), act: () => (R.debug = !R.debug), lr: () => (R.debug = !R.debug) },
      { label: 'Frame data panel (F2): ' + (R.frameData ? 'ON' : 'OFF'), act: () => (R.frameData = !R.frameData), lr: () => (R.frameData = !R.frameData) },
    ];
    if (W.training) {
      const ST = ['stand', 'crouch', 'jump', 'manual'], STN = { stand: 'Stand', crouch: 'Crouch', jump: 'Jump', manual: 'Controlled by P2' };
      const BL = ['none', 'all', 'after', 'random'], BLN = { none: 'None', all: 'All', after: 'After first hit', random: 'Random' };
      const cyc = (arr, v, dir) => arr[(arr.indexOf(v) + dir + arr.length) % arr.length];
      items.push(
        { label: 'Dummy: ' + STN[d.stance], act: () => (d.stance = cyc(ST, d.stance, 1)), lr: (dir) => (d.stance = cyc(ST, d.stance, dir)) },
        { label: 'Dummy block: ' + BLN[d.block], act: () => (d.block = cyc(BL, d.block, 1)), lr: (dir) => (d.block = cyc(BL, d.block, dir)) },
        { label: 'Dummy air tech: ' + (d.tech ? 'ON' : 'OFF'), act: () => (d.tech = !d.tech), lr: () => (d.tech = !d.tech) },
        { label: 'Auto refill HP / Burst: ' + (d.refill ? 'ON' : 'OFF'), act: () => (d.refill = !d.refill), lr: () => (d.refill = !d.refill) },
        { label: 'P1 always 75% Equilibrium: ' + (d.p1Meter ? 'ON' : 'OFF'), act: () => (d.p1Meter = !d.p1Meter), lr: () => (d.p1Meter = !d.p1Meter) },
        { label: 'Reset positions', act: () => { W.startRound(); G.paused = false; } }
      );
    }
    items.push(
      { label: 'P1 move list (' + W.f[0].name + ')', act: () => openMoveList(0) },
      { label: 'P2 move list (' + W.f[1].name + ')', act: () => openMoveList(1) },
      { label: 'Export current moves.csv', act: () => download('moves.csv', SO.currentText.moves) },
      { label: 'Export current characters.csv', act: () => download('characters.csv', SO.currentText.chars) },
      { label: 'Restore default data', act: () => { reloadData(window.SO_DATA.moves, window.SO_DATA.characters); toast('Default data restored'); } },
      { label: 'Character select', act: () => { startSelect(G.mode); } },
      { label: 'Main menu', act: () => { G.scene = 'title'; G.world = null; } }

  }
  function openMoveList(i) {
    const f = G.world.f[i];
    const c = SO.DB.chars[f.name];
    const order = { Normal: 0, Command: 1, Unique: 2, Puppet: 3, Special: 4, CmdGrab: 4, AirGrab: 4, Followup: 5, Spell: 6, Super: 7, Throw: 8 };
    const rows = c.moves.slice().sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9));
    G.moveList = { i, rows, scroll: 0, name: f.name };
  }

  function updateFight() {
    const W = G.world;
    if (pressedNow.includes('F1')) R.debug = !R.debug;
    if (pressedNow.includes('F2')) R.frameData = !R.frameData;
    if (G.moveList) {
      const ml = G.moveList;
      if (hit('down')) ml.scroll = Math.min(Math.max(0, ml.rows.length - 18), ml.scroll + 1);
      if (hit('up')) ml.scroll = Math.max(0, ml.scroll - 1);
      if (hit('back') || hit('pause') || hit('ok')) G.moveList = null;
      return;
    }
    if (W.phase === 'matchEnd' && W.phaseT > 60) {
      if (hit('ok')) { SO.newMatch(G.p1, G.p2, G.mode); return; }
      if (hit('back')) { startSelect(G.mode); return; }
    }
    if (hit('pause')) { G.paused = !G.paused; G.pauseIdx = 0; return; }
    if (G.paused) {
      const items = pauseItems();
      if (hit('up')) G.pauseIdx = (G.pauseIdx + items.length - 1) % items.length;
      if (hit('down')) G.pauseIdx = (G.pauseIdx + 1) % items.length;
      const it = items[G.pauseIdx];
      if (hit('left') && it.lr) it.lr(-1);
      if (hit('right') && it.lr) it.lr(1);
      if (hit('ok')) it.act();
      if (hit('back')) G.paused = false;
      return;
    }
    W.step();
  }

      });
    });
    text('W/S scroll · ' + (ml.scroll + 1) + '-' + Math.min(ml.rows.length, ml.scroll + 18) + ' / ' + ml.rows.length + ' · I/Esc close · * = placeholder data', 960, 990, 24, '#555', 'center', false);
  }

  function drawToast() {
    if (!G.toast) return;
    G.toast.t--;
    if (G.toast.t <= 0) { G.toast = null; return; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = Math.min(1, G.toast.t / 30);
    ctx.font = 'bold 30px ' + FONT;
    const w = ctx.measureText(G.toast.msg).width + 60;
    panel(960 - w / 2, 170, w, 64);
    text(G.toast.msg, 960, 212, 30, INK, 'center');
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ loop
  function tick() {
    pressedNow = SO.keysPressedOnce.splice(0);
    pollPads();
    if (G.scene === 'title') updateTitle();
    else if (G.scene === 'select') updateSelect();
    else if (G.scene === 'fight' && G.world) updateFight();
  }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (G.scene === 'title') drawTitle();
    else if (G.scene === 'select') drawSelect();
    else if (G.scene === 'fight' && G.world) {
      R.render(ctx, G.world);
      drawHUD(G.world);
      if (G.world.flash) R.drawCutIn(ctx, G.world);
      if (G.moveList) drawMoveList();
      else if (G.paused) drawPause(G.world);
    }
    drawToast();
  }
  SO.draw = draw;
  SO.tick = tick;

  let acc = 0, last = performance.now();
  const STEP = 1000 / 60;
  function loop(now) {
    acc += Math.min(250, now - last);
    last = now;
    let n = 0;
    while (acc >= STEP && n < 8) { if (!window.SO_FREEZE) tick(); acc -= STEP; n++; }
    draw();
    requestAnimationFrame(loop);
  }
  if (!window.SO_HEADLESS) requestAnimationFrame(loop);

  // co giãn canvas vừa cửa sổ
  function fit() {
    const cs = getComputedStyle(document.body);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) || 0;
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) || 0;
    const s = Math.min((document.documentElement.clientWidth - padX) / R.W, (window.innerHeight - padY) / R.H);
    canvas.style.width = Math.floor(R.W * s) + 'px';
    canvas.style.height = Math.floor(R.H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
})();

</script>
<script>document.getElementById('game').focus();</script>
