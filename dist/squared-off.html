      const kbx = Math.max(C.MIN_PUSH, d.kbx);
      def.move = null;
      def.moveAir = false;
      def.guard = false;
      def.vanish = false;
      if (!airborneHit) {
        def.setState('hitstun');
        def.crouchHit = wasCrouch;
        def.stun = Math.max(C.MIN_STUN, def.stunBase(inst, false) + (wasCrouch ? C.CROUCH_HITSTUN : 0) + C.CH_HITSTUN[chTier] + freeze - Math.floor(def.combo.hits / 8));
        def.vx = away * kbx * C.KBX_GROUND;
        def.vy = 0;
      } else {
        def.setState('airhit');
        def.kdType = kbt === 'Normal' ? 'Launch' : kbt;
        if (kby !== 0) def.vy = kby * C.KBY;
        else def.vy = def.y > 0 ? 7 : 6;
        def.vx = away * Math.max(0.5, kbx) * C.KBX_AIR;
        def.groundBounce = gBounce;
        if (gBounce) { def.vy = Math.min(def.vy, -10); def.vx *= 0.5; }
        let unt = untBase > 0 ? untBase : def.stunBase(inst, false) + 8;
        unt += freeze + C.CH_UNTECH[chTier];
        unt = Math.round(unt * Math.max(C.JUGGLE_MIN, 1 - C.JUGGLE_DECAY * (def.combo.hits - 1)));
        def.untech = Math.max(6, unt);
        def.y = Math.max(def.y, 1);
        if (d.tags.has('WallBounce') || (d.tags.has('WallBounceCorner') && def.nearWall(180))) def.wallBounce = true;
      }
      if (c.type === 'strike' && !def.isAir() && def.atWall(away)) att.pushV = -away * kbx * C.KBX_GROUND * 0.8;
      if (chTier) {
        this.slowmo = { t: C.CH_SLOW[chTier], every: chTier === 3 ? 3 : 2 };
        if (chTier === 3) this.chZoom = { t: 0, life: C.CH_SLOW[3] + 10, x: c.box.cx, y: c.box.cy };
      }
      if (c.type === 'strike') { att.contact = 'hit'; att.hitstop = d.hsa; }
      else if (c.type === 'puppet' && c.cyl) { c.cyl.hitstop = d.hsa; c.cyl.contact = 'hit'; }
      def.hitstop = d.hsd;
      if (c.proj) c.proj.hitstop = Math.min(d.hsd, 6);
      this.gain(att.idx, d.gain);
      if (ch) this.fx.push({ type: 'text', x: def.x, y: def.y + 240, text: chTier === 3 ? 'COUNTER!!' : 'COUNTER', t: 0, life: 40, color: '#d22', big: chTier === 3 });
      this.fx.push({ type: 'hit', x: c.box.cx - SO.sign(c.box.cx - def.x) * c.box.w * 0.25, y: c.box.cy, t: 0, life: 14, size: 18 + Math.min(40, dmg * 0.6), color: ch ? '#d22' : '#222' });
      SO.FXR.onHit(this, c, dmg, ch);
      this.stats.comboDmg = def.combo.dmg;
      this.stats.comboHits = def.combo.hits;
      this.stats.comboOwner = att.idx;
      this.stats.comboShowT = 120;
      if (att.G.onContact) att.G.onContact(att, inst, 'hit', c);
      this.koCheck(def, att);
    }

    koCheck(def, att) {
      if (def.hp > 0) return;
      if (this.training) { def.hp = 1; return; }
      if (this.phase !== 'fight') { def.hp = Math.max(def.hp, 1); return; }
      def.hp = 0;
      def.ko = true;
      def.move = null;
      if (def.state !== 'airhit') {
        def.setState('airhit');
        def.vy = 9;
        def.vx = SO.sign(def.x - att.x) * 5;
      }
      def.kdType = 'Hard_Knockdown';
      def.y = Math.max(1, def.y);
      this.koSlow = 90;
      SO.FXR.onKO(this);
      this.endRound(att.idx, 'K.O.');
    }

    endRound(winner, text) {
      this.phase = 'roundEnd';
      this.phaseT = 0;
      this.winner = winner;
      this.endText = text;
      if (winner >= 0) this.score[winner]++;
      this.fx.push({ type: 'banner', text, t: 0, life: 120 });
    }

    rounds() {
      if (this.phase === 'fight' && !this.training) {
        this.timer--;
        if (this.timer <= 0) {
          this.timer = 0;
          const r0 = this.f[0].hp / this.f[0].c.hp, r1 = this.f[1].hp / this.f[1].c.hp;
          const w = r0 > r1 ? 0 : r1 > r0 ? 1 : -1;
          this.endRound(w, 'TIME OVER');
        }
      }
      if (this.phase === 'roundEnd' && this.phaseT > 200) {
        if (this.score[0] >= C.ROUNDS_TO_WIN || this.score[1] >= C.ROUNDS_TO_WIN) {
          this.phase = 'matchEnd';
          this.phaseT = 0;
        } else {
          this.round++;
          this.startRound();
        }
      }
    }

    gauges() {
      for (const f of this.f) {
        if (f.burst < 100) f.burst = Math.min(100, f.burst + C.BURST_REGEN);
      }
      if (this.stats.comboShowT > 0) this.stats.comboShowT--;
      // frame advantage
      if (this.advPending) {
        const defI = this.advPending.def, def = this.f[defI], att = this.f[1 - defI];
        const attFree = att.state !== 'attack' && att.state !== 'land' && att.state !== 'recoil';
        if (attFree) {
          const attFreeFrame = att.freeAt || this.frame;
          this.stats.lastAdv = this.advPending.frame - attFreeFrame;
          this.advPending = null;
        } else if (this.frame - this.advPending.frame > 120) this.advPending = null;
      }
      for (const f of this.f) {
        const free = f.state === 'idle' || f.state === 'walk' || f.state === 'crouch' || f.state === 'air';
        if (free && !f.wasFree) f.freeAt = this.frame;
        f.wasFree = free;
      }
      if (this.training) {
        const [p1, p2] = this.f;
        if (this.dummy.p1Meter) this.eq = Math.max(this.eq, 50);
        if (this.dummy.refill) {
          const calm = (f) => (f.state === 'idle' || f.state === 'crouch' || f.state === 'walk') && f.sf > 40;
          if (calm(p2) && calm(p1)) {
            p2.hp = p2.c.hp; p2.gray = 0; p1.hp = p1.c.hp; p1.gray = 0;
            p1.burst = 100; p2.burst = 100;
            if (!this.dummy.p1Meter) this.eq = 0;
          }
        }
      }
    }

    // ---------------------------------------------------------------- throws
    tryGrab(att, inst) {
      const def = att.opp, d = inst.d;
      if (att.grabbed || this.grab) return;
      const isAirGrab = d.type === 'AirGrab';
      if (def.state === 'ko' || def.state === 'knockdown' || def.state === 'wakeup' || def.state === 'thrown') return;
      if (isAirGrab) {
        if (!def.isAir() || def.state === 'airhit' || def.invT > 0 || def.vanish) return;
        if (def.state === 'attack' && def.move && def.move.d.inv && def.mf >= def.move.d.inv[0] && def.mf <= def.move.d.inv[1] && def.move.d.invType === 'Full') return;
      } else {
        if (def.isInvuln('throw')) return;
        if (def.state === 'prejump' && def.sf >= 2) return;
      }
      let inRange;
      if (d.type === 'Throw') inRange = Math.abs(def.x - att.x) <= att.c.throwR && Math.abs(def.y - att.y) < 40;
      else {
        const box = { cx: att.x + att.facing * inst.hb.x, cy: att.y + inst.hb.y, w: inst.hb.w, h: inst.hb.h };
        inRange = def.hurtboxes().some((h) => SO.overlap(box, h));
      }
      if (!inRange) return;
      // throw tech khi cả hai cùng throw
      if (d.type === 'Throw' && def.state === 'attack' && def.move && def.move.d.type === 'Throw' && def.mf >= def.move.su - 1 && !def.grabbed) {
        this.techBoth(att, def);
        return;
      }
      att.grabbed = true;
      this.grab = {
        att, def, inst, t: 0, dur: +d.kv.Grab || 20,
        breakable: d.type === 'Throw', back: att.inp.isBack(), air: isAirGrab, gy: def.y,
      };
      att.setState('throwing');
      def.setState('thrown');
      def.vx = att.vx = 0;
      att.vy = 0;
      def.vy = 0;
      this.fx.push({ type: 'text', x: def.x, y: def.y + 230, text: d.type === 'Throw' ? 'THROW' : 'GRAB!', t: 0, life: 30 });
    }
    updateGrab() {
      const g = this.grab;
      if (!g) return;
      if (g.att.hitstop > 0) return;
      g.t++;
      const { att, def } = g;
      def.x = att.x + att.facing * (att.c.w * 0.5 + def.c.w * 0.4);
      if (g.air) {
        def.y = Math.max(0, g.gy - g.t * 4);
        att.y = Math.max(0, def.y - 20);
      } else def.y = 0;
      if (g.t >= g.dur) {
        if (g.back) {
          def.x = att.x - att.facing * (att.c.w * 0.5 + def.c.w * 0.4);
          att.facing = -att.facing;
        }
        this.grab = null;
        const inst = g.inst;
        att.setState('attack');
        att.move = inst;
        att.mf = Math.max(inst.su, inst.total - 14);
        att.moveAir = att.y > 0;
        att.grabbed = true;
        def.setState('idle');
        this.doHit({ type: 'throw', att, def, inst, srcX: att.x, box: { cx: def.x, cy: def.y + def.c.h / 2, w: 60, h: 60 } });
        def.hitstop = 10;
        att.hitstop = 0;
      }
    }
    throwBreak(def) {
      const g = this.grab;
      if (!g || g.def !== def || !g.breakable || g.t > C.THROW_BREAK) return;
      this.grab = null;
      this.techBoth(g.att, def);
    }
    techBoth(a, b) {
      for (const f of [a, b]) {
        f.setState('recoil');
        f.recoilT = 14;
        f.vx = -f.facing * 8;
        f.grabbed = false;
        f.move = null;
      }
      this.fx.push({ type: 'ring', x: (a.x + b.x) / 2, y: 110, t: 0, life: 16, r: 90, color: '#fff' });
      this.fx.push({ type: 'text', x: (a.x + b.x) / 2, y: 260, text: 'THROW BREAK', t: 0, life: 40 });
      this.hitstopBoth(8);
    }

    updateFx() {
      for (const e of this.fx) e.t++;
      this.fx = this.fx.filter((e) => e.t < e.life);
      SO.FXR.update(this);
      if (this.flash) this.flash.t++;
    }
  }

  function armorOK(vs, blk) {
    if (!vs) return true;
    if (vs === 'HM') return blk === 'High' || blk === 'Mid';
    if (vs === 'LM') return blk === 'Low' || blk === 'Mid';
    return true;
  }

  SO.World = World;
})();

</script>
<script>/* js/fx.js */
'use strict';
// =============================================================================
// SQUARED OFF - Hiệu ứng: particle + emitter theo tag Fx của từng chiêu
// Tag Fx đặt trong cột Properties của moves.csv, ví dụ: Fx=fire,heavy  hoặc  Fx=slash:#4aa3d9
// =============================================================================
(function () {
  const SO = window.SO;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const MAX_PARTS = 700;

  function emit(W, k, x, y, o) {
    if (W.parts.length > MAX_PARTS) W.parts.shift();
    W.parts.push(Object.assign({ k, x, y, vx: 0, vy: 0, g: 0, drag: 0.96, life: 20, t: 0, size: 10, color: '#fff', rot: Math.random() * 6.28, vr: rnd(-0.2, 0.2) }, o));
  }
  SO.emit = emit;

  // điểm "tay" của chiêu: tâm hitbox khi active, cạnh người khi startup
  function hand(src, inst) {
    const hb = inst && inst.hb;
    if (hb && hb.w > 0) return { x: src.x + src.facing * hb.x, y: src.y + hb.y, w: hb.w, h: hb.h };
    return { x: src.x + src.facing * src.c.w * 0.55, y: src.y + src.c.h * 0.6, w: 60, h: 60 };
  }

  const EMIT = {
    fire(W, src, inst, t, col, ph) {
      if (!(ph.active || ph.late)) return;
      const h = hand(src, inst);
      const n = ph.big ? 5 : 3;
      for (let i = 0; i < n; i++) {
        emit(W, 'flame', h.x + rnd(-h.w, h.w) * 0.35, h.y + rnd(-h.h, h.h) * 0.3, {
          vx: src.facing * rnd(-1, 2) + rnd(-1, 1), vy: rnd(2, 6), drag: 0.92, life: rnd(14, 24) | 0, size: rnd(16, 32) * (ph.big ? 1.3 : 1),
        });
      }
    },
    ice(W, src, inst, t, col, ph) {
      if (!ph.active) return;
      const h = hand(src, inst);
      for (let i = 0; i < 2; i++) emit(W, 'shard', h.x + rnd(-20, 20), h.y + rnd(-20, 20), { vx: rnd(-6, 6) + src.facing * 3, vy: rnd(-2, 8), g: 0.5, life: 22, size: rnd(8, 16), color: '#cfefff' });
      if (t % 2 === 0) emit(W, 'smoke', h.x, h.y, { vx: src.facing * 2, vy: 1, life: 20, size: 26, color: 'rgba(200,235,255,0.6)' });
    },
    elec(W, src, inst, t, col, ph) {
      if (!ph.active) return;
      const h = hand(src, inst);
      emit(W, 'bolt', h.x + rnd(-h.w, h.w) * 0.4, h.y + rnd(-h.h, h.h) * 0.4, { life: 6, size: rnd(30, 60), color: col || '#ffe14d', drag: 1 });
      emit(W, 'spark', h.x, h.y, { vx: rnd(-9, 9), vy: rnd(-6, 9), life: 10, size: 3, color: col || '#ffe14d' });
    },
    prism(W, src, inst, t, col, ph) {
      if (!ph.active) return;
      const h = hand(src, inst);
      emit(W, 'rainbow', h.x + rnd(-30, 30), h.y + rnd(-30, 30), { vx: rnd(-2, 2), vy: rnd(-1, 3), life: 22, size: rnd(5, 10), hue: (W.frame * 12) % 360 });
    },
    wind(W, src, inst, t, col, ph) {
      if (!ph.active || t % 2) return;
      for (let i = 0; i < 2; i++) emit(W, 'streak', src.x + rnd(-80, 80), src.y + rnd(20, src.c.h), { vx: -src.facing * rnd(8, 14), vy: rnd(-1, 1), life: 10, size: rnd(30, 60), color: col || 'rgba(120,140,160,0.7)', drag: 0.9 });
    },
    spin() {},
    quake(W, src, inst, t, col, ph) {
      if (!ph.first || src.y > 10) return;
      const h = hand(src, inst);
      for (let i = 0; i < 12; i++) emit(W, 'debris', h.x + rnd(-60, 60), 5, { vx: rnd(-7, 7), vy: rnd(6, 16), g: 0.8, life: 40, size: rnd(8, 18), color: '#8d7457', drag: 0.99 });
      for (let i = 0; i < 6; i++) emit(W, 'dust', h.x + rnd(-90, 90), 10, { vx: rnd(-3, 3), vy: rnd(0, 2), life: 30, size: rnd(30, 50), color: 'rgba(170,150,120,0.55)' });
      W.fx.push({ type: 'crack', x: h.x, y: 0, t: 0, life: 50 });
      W.quake = Math.max(W.quake, 14);
    },
    heavy(W, src, inst, t, col, ph) {
      if (!ph.first) return;
      const h = hand(src, inst);
      W.fx.push({ type: 'ring', x: h.x, y: h.y, t: 0, life: 12, r: 90, color: col || '#444', thick: 5 });
      for (let i = 0; i < 6; i++) emit(W, 'streak', h.x, h.y, { vx: Math.cos(i) * 10, vy: Math.sin(i) * 10, life: 8, size: 40, color: 'rgba(60,60,60,0.6)', drag: 0.85 });
    },
    slash(W, src, inst, t, col, ph) {
      if (!ph.first) return;
      const h = hand(src, inst);
      for (let i = 0; i < 8; i++) emit(W, 'star', h.x + rnd(-h.w, h.w) * 0.5, h.y + rnd(-h.h, h.h) * 0.5, { vx: rnd(-3, 3), vy: rnd(-2, 4), life: 18, size: rnd(6, 12), color: col || '#fff7c0' });
    },
    petal(W, src, inst, t, col, ph) {
      if (!(ph.active || ph.late) || t % 2) return;
      emit(W, 'petal', src.x + rnd(-60, 60), src.y + rnd(40, 160), { vx: rnd(-3, 3) - src.facing * 2, vy: rnd(-1, 3), g: -0.02, life: 40, size: rnd(9, 14), color: '#ef6fae', vr: rnd(-0.3, 0.3) });
    },
    smoke(W, src, inst, t) {
      if (t !== 1) return;
      for (let i = 0; i < 10; i++) emit(W, 'smoke', src.x + rnd(-50, 50), src.y + rnd(20, 160), { vx: rnd(-3, 3), vy: rnd(0, 3), life: 30, size: rnd(30, 50), color: 'rgba(120,110,130,0.5)' });
    },
    dust(W, src, inst, t, col, ph) {
      if (!ph.active || src.y > 10 || t % 2) return;
      emit(W, 'dust', src.x - src.facing * 30 + rnd(-20, 20), 8, { vx: -src.facing * rnd(1, 4), vy: rnd(0.5, 2), life: 22, size: rnd(20, 34), color: 'rgba(170,150,120,0.5)' });
    },
    spark(W, src, inst, t, col, ph) {
      if (!ph.active) return;
      const h = hand(src, inst);
      for (let i = 0; i < 2; i++) emit(W, 'spark', h.x, h.y, { vx: rnd(-10, 10), vy: rnd(-4, 10), g: 0.4, life: 12, size: 3, color: col || '#ffcf3f' });
    },
    metal(W, src, inst, t, col, ph) {
      if (!ph.active) return;
      const h = hand(src, inst);
      emit(W, 'spark', h.x, h.y, { vx: rnd(-10, 10), vy: rnd(-2, 10), g: 0.5, life: 12, size: 3, color: '#cfd6dd' });
    },
    stretch(W, src, inst, t, col, ph) {
      if (!ph.active) return;
      const h = hand(src, inst);
      emit(W, 'streak', (src.x + h.x) / 2 + rnd(-40, 40), h.y + rnd(-20, 20), { vx: src.facing * 12, life: 8, size: 50, color: 'rgba(214,91,163,0.6)', drag: 0.9 });
    },
    bounce() {},
    stop() {},
    burst(W, src, inst, t) {
      if (t !== 1) return;
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * Math.PI * 2;
        emit(W, 'star', src.x, src.y + 100, { vx: Math.cos(a) * rnd(8, 16), vy: Math.sin(a) * rnd(8, 16), drag: 0.9, life: 30, size: rnd(8, 16), color: '#ffd23f' });
      }
      W.screenFlash = { t: 0, life: 10, color: 'rgba(255,230,140,0.5)' };
    },
  };

  // vệt bay theo projectile
  const TRAIL = {
    fire(W, p) { emit(W, 'flame', p.x + rnd(-10, 10), p.y + rnd(-10, 10), { vx: -SO.sign(p.vx) * 2, vy: rnd(1, 3), life: 16, size: rnd(14, 24) * Math.min(1.6, p.h / 50) }); },
    ice(W, p) { emit(W, 'shard', p.x, p.y, { vx: rnd(-3, 3), vy: rnd(-1, 4), g: 0.4, life: 18, size: rnd(6, 12), color: '#cfefff' }); },
    elec(W, p, col) { emit(W, 'bolt', p.x + rnd(-p.w, p.w) * 0.4, p.y + rnd(-p.h, p.h) * 0.4, { life: 5, size: rnd(20, 40), color: col || '#ffe14d', drag: 1 }); },
    prism(W, p) { emit(W, 'rainbow', p.x - SO.sign(p.vx) * p.w * 0.4, p.y + rnd(-p.h, p.h) * 0.3, { vx: -SO.sign(p.vx) * 2, vy: rnd(-1, 1), life: 20, size: rnd(5, 9), hue: (W.frame * 15 + p.id * 40) % 360 }); },
    bounce(W, p) { emit(W, 'star', p.x, p.y, { vx: -SO.sign(p.vx) * 2, vy: rnd(-1, 2), life: 14, size: 7, color: '#d65ba3' }); },
    stop(W, p) { emit(W, 'smoke', p.x, p.y, { vx: -SO.sign(p.vx), life: 14, size: 18, color: 'rgba(201,58,58,0.35)' }); },
    spin(W, p) { emit(W, 'spark', p.x, p.y - p.h * 0.3, { vx: rnd(-6, 6), vy: rnd(0, 6), g: 0.4, life: 10, size: 3, color: '#d2683a' }); },
    spark(W, p) { emit(W, 'spark', p.x, p.y, { vx: rnd(-5, 5), vy: rnd(0, 5), g: 0.4, life: 10, size: 3, color: '#ffcf3f' }); },
    default(W, p) { emit(W, 'dust', p.x - SO.sign(p.vx) * p.w * 0.4, p.y, { vx: -SO.sign(p.vx), life: 12, size: 12, color: 'rgba(120,120,140,0.35)' }); },
  };

  function phase(inst, t) {
    const su = inst.su, act = Math.max(1, inst.d.isProj ? 1 : inst.act);
    return {
      startup: t < su, active: t >= su && t < su + act, first: t === su,
      late: t >= su - 3 && t < su, big: (inst.d.dmg || 0) >= 90 || inst.d.type === 'Super',
    };
  }

  function runEmitters(W, src, inst, t) {
    const d = inst.d;
    if (!d.fx || !d.fx.length) return;
    const ph = phase(inst, t);
    for (const fx of d.fx) if (EMIT[fx.name]) EMIT[fx.name](W, src, inst, t, fx.color, ph);
  }

  SO.FXR = {
    tick(W) {
      for (const f of W.f) {
        if (f.state === 'attack' && f.move && f.hitstop <= 0) runEmitters(W, f, f.move, f.mf);
        const cy = f.gim && f.gim.cyl;
        if (cy && cy.st === 'attack' && cy.inst) runEmitters(W, { x: cy.x, y: cy.y, facing: cy.facing, c: { w: 64, h: 110 } }, cy.inst, cy.mf);
        // trạng thái cháy / giật
        const st = f.status;
        if (st) {
          st.t++;
          if (st.t >= st.life || f.state === 'idle' || f.state === 'walk') f.status = null;
          else if (st.kind === 'burn' && W.frame % 2 === 0) {
            for (let i = 0; i < 2; i++) emit(W, 'flame', f.x + rnd(-f.c.w * 0.45, f.c.w * 0.45), f.y + rnd(10, f.c.h * 0.9), { vx: rnd(-1, 1), vy: rnd(2, 5), life: 16, size: rnd(12, 22) });
            if (W.frame % 6 === 0) emit(W, 'smoke', f.x + rnd(-30, 30), f.y + f.c.h, { vy: 2.5, life: 26, size: 22, color: 'rgba(70,60,60,0.4)' });
          } else if (st.kind === 'shock' && W.frame % 3 === 0) {
            emit(W, 'bolt', f.x + rnd(-f.c.w * 0.6, f.c.w * 0.6), f.y + rnd(20, f.c.h), { life: 5, size: rnd(30, 60), color: st.color, drag: 1 });
          }
        }
        // bụi khi dash / chạm đất
        if (f.state === 'dash' && W.frame % 3 === 0) emit(W, 'dust', f.x - f.facing * 30, 6, { vx: -f.facing * 2, vy: 1, life: 18, size: 22, color: 'rgba(170,150,120,0.45)' });
        if (f.state === 'airhit' && f.sf < 12 && f.vy > 5 && W.frame % 2 === 0) for (let i = 0; i < 2; i++) emit(W, 'streak', f.x + rnd(-40, 40), f.y + rnd(20, f.c.h * 0.8), { vx: -f.vx * 1.5, vy: -f.vy * 1.2, drag: 0.8, life: 10, size: 70, color: 'rgba(80,80,80,0.55)' });
        if (f.state === 'airdash' && f.sf < 3) for (let i = 0; i < 3; i++) emit(W, 'streak', f.x - f.facing * f.adDir * 40, f.y + rnd(30, f.c.h), { vx: -f.facing * f.adDir * 14, life: 8, size: 60, color: 'rgba(90,110,140,0.6)', drag: 0.85 });
      }
      for (const p of W.projs) {
        if (p.dead || p.delay > 0 || p.hitstop > 0 || W.frame % 2) continue;
        if (p.kind === 'beam' || p.kind === 'line') continue;
        const fx = p.inst.d.fx;
        if (fx && fx.length) { for (const x of fx) (TRAIL[x.name] || (() => {}))(W, p, x.color); }
        else if (p.kind === 'straight' || p.kind === 'orb' || p.kind === 'angled' || p.kind === 'disc') TRAIL.default(W, p);
      }
    },
    update(W) {
      for (const p of W.parts) {
        p.t++;
        p.vy -= p.g;
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.k === 'debris' && p.y < 4) { p.y = 4; p.vy = -p.vy * 0.3; p.vx *= 0.6; }
      }
      W.parts = W.parts.filter((p) => p.t < p.life);
      if (W.quake > 0) W.quake--;
      if (W.screenFlash) { W.screenFlash.t++; if (W.screenFlash.t >= W.screenFlash.life) W.screenFlash = null; }
    },
    onHit(W, c, dmg, ch) {
      const d = c.inst.d, b = c.box;
      const x = b.cx - SO.sign(b.cx - c.def.x) * b.w * 0.25, y = b.cy;
      const lvl = d.type === 'Super' ? 3 : d.hsd >= 10 || dmg >= 60 ? 2 : d.hsd >= 6 ? 1 : 0;
      const n = [5, 9, 14, 20][lvl];
      const col = ch ? '#ff4433' : '#ffffff';
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = rnd(6, 12 + lvl * 4);
        emit(W, 'spark', x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 0.86, life: 10 + lvl * 2, size: 3 + lvl, color: i % 3 ? col : (ch ? '#ffb000' : '#ffe680') });
      }
      W.fx.push({ type: 'impact', x, y, t: 0, life: 8 + lvl * 3, size: 24 + lvl * 16, color: ch ? '#d22' : '#222', lvl });
      if (lvl >= 2) W.screenFlash = { t: 0, life: lvl === 3 ? 8 : 4, color: ch ? 'rgba(255,60,40,0.3)' : 'rgba(255,255,255,0.35)' };
      if (lvl >= 2) W.quake = Math.max(W.quake, 4 + lvl * 2);
      // trạng thái trên người bị đánh: lửa = cháy, điện = giật
      const names = new Set((d.fx || []).map((x) => x.name));
      if (names.has('fire')) c.def.status = { kind: 'burn', t: 0, life: 50 };
      else if (names.has('elec')) c.def.status = { kind: 'shock', t: 0, life: Math.max(18, (c.def.stun || c.def.untech || 20)), color: ((d.fx.find((x) => x.name === 'elec') || {}).color) || '#ffe14d' };
      // hiệu ứng theo nguyên tố khi trúng
      for (const fx of d.fx || []) {
        if (fx.name === 'fire') for (let i = 0; i < 10; i++) emit(W, 'flame', x + rnd(-30, 30), y + rnd(-30, 30), { vx: rnd(-4, 4), vy: rnd(2, 7), life: 20, size: rnd(20, 36) });
        if (fx.name === 'ice') for (let i = 0; i < 10; i++) emit(W, 'shard', x, y, { vx: rnd(-9, 9), vy: rnd(-3, 10), g: 0.5, life: 26, size: rnd(8, 16), color: '#cfefff' });
        if (fx.name === 'elec') for (let i = 0; i < 4; i++) emit(W, 'bolt', x + rnd(-40, 40), y + rnd(-40, 40), { life: 8, size: rnd(40, 80), color: fx.color || '#ffe14d', drag: 1 });
        if (fx.name === 'slash') W.fx.push({ type: 'slashhit', x, y, t: 0, life: 12, color: fx.color || '#fff', ang: rnd(-0.9, -0.4) });
        if (fx.name === 'petal') for (let i = 0; i < 8; i++) emit(W, 'petal', x, y, { vx: rnd(-6, 6), vy: rnd(-2, 7), g: 0.05, life: 36, size: rnd(9, 14), color: '#ef6fae' });
        if (fx.name === 'prism') for (let i = 0; i < 10; i++) emit(W, 'rainbow', x, y, { vx: rnd(-8, 8), vy: rnd(-6, 8), drag: 0.9, life: 24, size: rnd(6, 10), hue: i * 36 });
      }
    },
    onBlock(W, c, fd) {
      const b = c.box;
      const x = b.cx - SO.sign(b.cx - c.def.x) * b.w * 0.3, y = b.cy;
      for (let i = 0; i < 6; i++) emit(W, 'spark', x, y, { vx: -SO.sign(b.cx - c.def.x) * rnd(-2, 8) * -1, vy: rnd(-6, 6), drag: 0.85, life: 9, size: 3, color: fd ? '#5c5' : '#8cf' });
    },
    onKO(W) {
      W.screenFlash = { t: 0, life: 24, color: 'rgba(255,255,255,0.6)' };
      W.quake = 20;
    },
  };
})();

</script>
<script>/* js/gimmicks.js */
'use strict';
// =============================================================================
// SQUARED OFF - Gimmick nút U của từng nhân vật
// Mỗi nhân vật có thể khai báo các hook:
//   init(f) update(f) press(f,b,p) modify(f,inst) frame(f,inst,t) canStart(f,m)
//   onContact(f,inst,result,c) walkMul(f) suppressMove(f) gatling(f,cur,next)
//   worldUpdate(f) puppetHit(f) puppetHurt(f,box) puppetStun(f) puppet(f,id)
//   parry(def,att,c) threat(f,target) hud(f) draw(f,ctx,R)
// Các con số chỉnh được đều nằm trong cột Properties của moves.csv.
// =============================================================================
(function () {
  const SO = window.SO;
  const C = SO.CFG;
  const GIM = (SO.GIM = {});
  const S = SO.SCRIPTS;
  const NORMAL_T = new Set(['Normal', 'Command']);
  const STUNNED = new Set(['hitstun', 'airhit', 'block', 'knockdown', 'wakeup', 'thrown', 'throwing', 'ko', 'recoil']);
  const fx = (f, e) => f.w.fx.push(Object.assign({ t: 0 }, e));

  // ---------------------------------------------------------------- Roman Cancel (dùng chung)
  S.rc = function () {};

  // ================================================================ CIRCLE
  // 5U: nạp 1 token (đứng yên, chậm) hoặc cancel từ normal => Power Burst nhanh + token.
  // Có token / Dragon Install: special có cột EX=ID sẽ thành bản EX. Token dùng là mất.
  const isStun = (f) => STUNNED.has(f.state);
  GIM.Circle = {
    init(f) { f.gim.token = 0; f.gim.di = 0; },
    update(f) {
      if (f.gim.di > 0) f.gim.di--;
      const W = f.w;
      // aura lửa khi có token / Dragon Install
      if ((f.gim.token || f.gim.di) && SO.emit && W.parts && W.frame % (f.gim.di ? 2 : 4) === 0 && f.state !== 'ko') {
        const r = () => Math.random() - 0.5;
        SO.emit(W, 'flame', f.x + r() * f.c.w, f.y + 10 + Math.random() * f.c.h * (f.gim.di ? 1.1 : 0.7), { vx: r() * 2, vy: 2 + Math.random() * 3, life: 16, size: f.gim.di ? 20 : 13 });
      }
    },
    swap(f, m) {
      if (m.id === 'CR_5U' && f.gim.di > 0) return f.c.byId.CR_5U_DI;
      const ex = m.kv.EX && f.c.byId[m.kv.EX];
      if (!ex) return null;
      if (f.gim.di > 0) return ex;
      if (f.gim.token > 0) {
        f.gim.token = 0;
        fx(f, { type: 'ring', x: f.x, y: f.y + 90, life: 16, r: 110, color: '#ff4a2a', thick: 6 });
        return ex;
      }
      return null;
    },
    press(f, b, p) {
      if (b !== 'U' || f.isAir() || p.rel <= 3) return null;
      if (isStun(f)) return null;
      if (f.gim.di > 0) return { move: f.c.byId.CR_5U_DI };
      // đang ra đòn: chỉ có bản Power Burst (cancel từ normal special-cancel được)
      if (f.state === 'attack') return { move: f.c.byId.CR_5U_BURST };
      return null;
    },
    canStart(f, m) {
      if (m.id === 'CR_5U_BURST' && f.state !== 'attack') return false;
      if (m.id === 'CR_5U' && f.state === 'attack') return false;
    },
    weaponColor(f) { return f.gim.token || f.gim.di ? '#ff5a3a' : null; },
    tokens(f) { return f.gim.token; },
    hud(f) { return f.gim.di > 0 ? [{ text: 'DRAGON INSTALL ' + (f.gim.di / 60).toFixed(1) + 's', color: '#e0302a' }] : []; },
  };
  S.powerup = function (f) {
    f.gim.token = 1;
    fx(f, { type: 'ring', x: f.x, y: f.y + 100, life: 22, r: 150, color: '#ff4a2a', thick: 7 });
    fx(f, { type: 'text', x: f.x, y: f.y + 240, text: 'POWER UP', life: 40, color: '#e0302a' });
    if (SO.emit) for (let i = 0; i < 20; i++) SO.emit(f.w, 'flame', f.x + (Math.random() - 0.5) * 120, f.y + Math.random() * 60, { vx: (Math.random() - 0.5) * 3, vy: 4 + Math.random() * 6, life: 24, size: 24 });
  };
  S.dragon = function (f, inst) {
    f.gim.di = +inst.d.kv.Dur || 480;
    fx(f, { type: 'ring', x: f.x, y: f.y + 100, life: 26, r: 220, color: '#e0302a', thick: 9 });
    fx(f, { type: 'text', x: f.x, y: f.y + 250, text: 'DRAGON INSTALL', life: 50, color: '#e0302a', big: true });
  };

  // ================================================================ SQUARE
  GIM.Square = {
    init(f) { f.gim.ring = null; f.gim.ringCD = 0; },
    update(f) {
      if (f.gim.ringCD > 0) f.gim.ringCD--;
      const r = f.gim.ring;
      if (r) { r.t++; if (r.t >= r.life) f.gim.ring = null; }
    },
    canStart(f, m) {
      if (m.kv.Script === 'ring' && f.gim.ringCD > 0) return false;
    },
    worldUpdate(f) {
      const r = f.gim.ring;
      if (!r) return;
      for (const p of f.w.projs) {
        if (p.owner !== f || !p.clash || p.boosted || p.dead || p.delay > 0) continue;
        if (Math.hypot(p.x - r.x, p.y - r.y) < r.r + Math.max(p.w, p.h) * 0.3) {
          p.boosted = true;
          p.vx *= 1.5; p.vy *= 1.5; p.w *= 1.5; p.h *= 1.5;
          p.hitsLeft += 1;
          p.interval = 4;
          p.life += 20;
          fx(f, { type: 'ring', x: r.x, y: r.y, life: 14, r: r.r * 1.4, color: '#3f7fd8', thick: 6 });
        }
      }
    },
    hud(f) {
      const out = [];
      if (f.gim.ring) out.push({ text: 'RING ' + ((f.gim.ring.life - f.gim.ring.t) / 60).toFixed(1) + 's', color: '#3f7fd8' });
      if (f.gim.ringCD > 0) out.push({ text: 'Ring CD ' + (f.gim.ringCD / 60).toFixed(1) + 's', color: '#888' });
      return out;
    },
    draw(f, ctx, R) {
      const r = f.gim.ring;
      if (!r) return;
      const fade = Math.min(1, (r.life - r.t) / 30);
      ctx.globalAlpha = 0.85 * fade;
      R.sketchEllipse(ctx, r.x, -r.y, r.r * 0.55, r.r, 77 + f.idx, { stroke: '#3f7fd8', width: 7, fill: null });
      R.sketchEllipse(ctx, r.x, -r.y, r.r * 0.35, r.r * 0.75, 91 + f.idx, { stroke: '#9cc3f5', width: 3, fill: null });
      ctx.globalAlpha = 1;
    },
  };
  S.ring = function (f, inst) {
    const k = inst.d.kv;
    f.gim.ring = { x: f.x + f.facing * (+k.RingX || 260), y: Math.max(30, f.y + (+k.RingY || 120)), r: +k.RingR || 70, t: 0, life: +k.RingLife || 240 };
    f.gim.ringCD = +k.RingCD || 180;
  };

  // ================================================================ TRIANGLE
  GIM.Triangle = {
    canStart(f, m) {
      if (m.kv.Script === 'apex' && m.air && f.airDashes <= 0) return false;
    },
  };
  S.apex = function (f) {
    f.airdashed = true;
    f.airDashes = Math.max(0, f.airDashes - 1);
    f.airJumps = 0;
    f.afterimg = 18;
  };

  // ================================================================ RHOMBUS
  GIM.Rhombus = {
    init(f) { f.gim.shift = null; },
    update(f) {
      const s = f.gim.shift;
      if (s) { s.t--; if (s.t <= 0) f.gim.shift = null; }
    },
    walkMul(f) { return f.gim.shift ? f.gim.shift.walk : 1; },
    modify(f, inst) {
      const s = f.gim.shift;
      if (s && NORMAL_T.has(inst.d.type)) {
        inst.armorLeft = Math.max(inst.armorLeft, 1);
        inst.armorVs = s.vs;
      }
    },
    hud(f) { return f.gim.shift ? [{ text: 'GRIP SHIFT ' + (f.gim.shift.vs === 'HM' ? 'HIGH' : 'LOW') + ' ' + (f.gim.shift.t / 60).toFixed(1) + 's', color: '#8a5ac8' }] : []; },
  };
  S.shift = function (f, inst) {
    const k = inst.d.kv;
    f.gim.shift = { t: +k.Dur || 90, vs: k.Shift || 'HM', walk: +k.WalkMul || 0.6 };
    fx(f, { type: 'ring', x: f.x, y: f.y + 100, life: 16, r: 110, color: '#8a5ac8', thick: 6 });
  };

  // ================================================================ HEXAGON
  GIM.Hexagon = {
    init(f) { f.gim.nodes = []; },
    update(f) {
      for (const n of f.gim.nodes) n.life--;
      f.gim.nodes = f.gim.nodes.filter((n) => n.life > 0);
    },
    hud(f) {
      const max = +(f.c.byId.HX_5U && f.c.byId.HX_5U.kv.NodeMax) || 3;
      let s = 'NODE ';
      for (let i = 0; i < max; i++) s += i < f.gim.nodes.length ? '⬢' : '⬡';
      return [{ text: s, color: '#2fa37a' }];
    },
    draw(f, ctx, R) {
      f.gim.nodes.forEach((n, i) => {
        const pts = [];
        for (let k = 0; k < 6; k++) pts.push([n.x + Math.cos((k * Math.PI) / 3) * 24, -n.y + Math.sin((k * Math.PI) / 3) * 24]);
        const blink = n.life < 90 && (f.w.frame >> 3) % 2;
        ctx.globalAlpha = blink ? 0.4 : 0.95;
        R.sketchPoly(ctx, pts, 300 + i * 7 + f.idx, { fill: '#bdf0d8', stroke: '#2fa37a', width: 4 });
        ctx.fillStyle = '#1b5e45';
        ctx.font = 'bold 22px "Patrick Hand", "Comic Sans MS", cursive';
        ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), n.x, -n.y + 8);
        ctx.globalAlpha = 1;
      });
      // tia nối mờ giữa các node
      ctx.setLineDash([8, 10]);
      ctx.strokeStyle = 'rgba(47,163,122,0.35)';
      ctx.lineWidth = 3;
      for (let i = 0; i + 1 < f.gim.nodes.length; i++) {
        const a = f.gim.nodes[i], b = f.gim.nodes[i + 1];
        ctx.beginPath(); ctx.moveTo(a.x, -a.y); ctx.lineTo(b.x, -b.y); ctx.stroke();
      }
      ctx.setLineDash([]);
    },
  };
  S.node = function (f, inst) {
    const k = inst.d.kv;
    const max = +k.NodeMax || 3;
    if (f.gim.nodes.length >= max) f.gim.nodes.shift();
    const n = { x: SO.clamp(f.x + f.facing * (+k.NodeX || 0), 60, C.STAGE_W - 60), y: Math.max(20, f.y + (+k.NodeY || 60)), life: +k.NodeLife || 900 };
    f.gim.nodes.push(n);
    fx(f, { type: 'ring', x: n.x, y: n.y, life: 12, r: 40, color: '#2fa37a' });
  };
  S.node3 = function (f) {
    const k = (f.c.byId.HX_5U && f.c.byId.HX_5U.kv) || {};
    f.gim.nodes = [200, 400, 600].map((d) => ({ x: SO.clamp(f.x + f.facing * d, 60, C.STAGE_W - 60), y: 70, life: +k.NodeLife || 900 }));
    f.gim.nodes.forEach((n) => fx(f, { type: 'ring', x: n.x, y: n.y, life: 14, r: 50, color: '#2fa37a' }));
  };
  S.detonate = function (f, inst) {
    const W = f.w, k = inst.d.kv.Detonate;
    const nodes = f.gim.nodes;
    let list;
    if (k === 'all') list = nodes.slice();
    else { const n = nodes[(+k || 1) - 1]; list = n ? [n] : []; }
    if (!list.length) {
      if (k === 'all') list = [{ x: f.x + f.facing * 140, y: 100, fake: true }];
      else { fx(f, { type: 'text', x: f.x, y: f.y + 220, text: 'NO NODE', life: 30, color: '#888' }); return; }
    }
    const lineDmg = +inst.d.kv.LineDmg || 30;
    const lineInst = Object.assign({}, inst, { dmgMul: inst.dmgMul * (lineDmg / Math.max(1, inst.d.dmg)) });
    for (const n of list) {
      W.projs.push(W.makeProj(f, inst, 'burst', 0, 1, { anchor: false, x: n.x, y: n.y, life: Math.max(4, inst.act), hitsLeft: 1 }));
      fx(f, { type: 'hit', x: n.x, y: n.y, life: 16, size: 110, color: '#2fa37a' });
    }
    // tia nối
    const pairs = [];
    if (k === 'all') { for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) pairs.push([list[i], list[j]]); }
    else for (const o of nodes) if (o !== list[0]) pairs.push([list[0], o]);
    for (const [a, b] of pairs) {
      W.projs.push(W.makeProj(f, lineInst, 'line', 0, 1, { x1: a.x, y1: a.y, x2: b.x, y2: b.y, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, thick: 30, life: Math.max(6, inst.act), hitsLeft: 1, color: '#2fa37a' }));
    }
    if (k === 'all') f.gim.nodes = [];
    else f.gim.nodes = nodes.filter((n) => n !== list[0]);
  };

  // ================================================================ OVAL
  GIM.Oval = {
    init(f) { f.gim.stretch = 0; f.gim.cd = 0; },
    kv(f) { return (f.c.byId.OV_5U && f.c.byId.OV_5U.kv) || {}; },
    update(f) {
      if (f.gim.stretch > 0) {
        f.gim.stretch--;
        if (f.gim.stretch === 0) f.gim.cd = +GIM.Oval.kv(f).CD || 480;
      } else if (f.gim.cd > 0) f.gim.cd--;
    },
    canStart(f, m) {
      if (m.kv.Script === 'stretch' && f.gim.stretch <= 0 && f.gim.cd > 0) return false;
    },
    modify(f, inst) {
      if (f.gim.stretch > 0 && NORMAL_T.has(inst.d.type)) {
        const k = GIM.Oval.kv(f), mul = +k.ReachMul || 1.6;
        inst.hb.x *= mul;
        inst.hb.w *= mul;
        inst.rec += +k.RecAdd || 3;
        inst.stretched = true;
      }
    },
    hud(f) {
      if (f.gim.stretch > 0) return [{ text: 'STRETCH ' + (f.gim.stretch / 60).toFixed(1) + 's', color: '#d65ba3' }];
      if (f.gim.cd > 0) return [{ text: 'Stretch CD ' + (f.gim.cd / 60).toFixed(1) + 's', color: '#888' }];
      return [];
    },
  };
  S.stretch = function (f, inst) {
    const k = inst.d.kv;
    if (f.gim.stretch > 0) { f.gim.stretch = 0; f.gim.cd = +k.CD || 480; }
    else if (f.gim.cd <= 0) {
      f.gim.stretch = +k.Dur || 300;
      fx(f, { type: 'ring', x: f.x, y: f.y + 100, life: 16, r: 120, color: '#d65ba3', thick: 6 });
    }
  };

  // ================================================================ CONE & CYL
  const CYL_W = 64, CYL_H = 110;
  function cylKV(f) { return (f.c.byId.CC_5U && f.c.byId.CC_5U.kv) || {}; }
  function startCyl(f, m) {
    const cy = f.gim.cyl;
    if (!m || cy.stun > 0) return;
    cy.st = 'attack';
    const inst = { d: m, su: m.su, act: m.act, rec: m.rec, hits: m.hits, hb: Object.assign({}, m.hb), dmgMul: f.buffs.burst > 0 ? 1 + f.buffs.dmgUp : 1, casterAct: m.casterAct, vel: m.vel };
    inst.total = inst.su - 1 + inst.casterAct + inst.rec;
    cy.inst = inst;
    cy.mf = 0;
    cy.hitIdx = -1;
    cy.contact = null;
    cy.facing = SO.sign(f.opp.x - cy.x) || f.facing;
    if (m.tags.has('CylHop')) cy.y = Math.max(cy.y, 1);
  }
  GIM['Cone & Cyl'] = {
    init(f) {
      f.gim.cyl = { x: f.x - f.facing * 70, y: 0, vy: 0, facing: f.facing, st: 'follow', inst: null, mf: 0, stun: 0, hitIdx: -1, hitstop: 0, contact: null, ctrl: false };
    },
    update(f) {
      const cy = f.gim.cyl, i = f.inp, K = cylKV(f);
      if (cy.stun > 0) {
        cy.stun--;
        if (cy.stun === 0) {
          cy.st = 'follow'; cy.x = f.x - f.facing * 70; cy.y = 0; cy.vy = 0;
          fx(f, { type: 'ring', x: cy.x, y: 55, life: 14, r: 60, color: '#d2683a' });
        }
        return;
      }
      cy.ctrl = i.held.U && i.frame - i.pressT.U > C.COMPOSITE && !STUNNED.has(f.state) && f.w.phase === 'fight';
      if (cy.hitstop > 0) { cy.hitstop--; return; }
      if (cy.st === 'attack') {
        cy.mf++;
        let velSet = false;
        for (const s of cy.inst.vel) if (cy.mf >= s.a && cy.mf <= s.b) { cy.x += s.vx * cy.facing; if (s.vy) cy.vy = s.vy; velSet = true; }
        if (cy.mf >= cy.inst.total) cy.st = 'follow';
      } else if (cy.ctrl) {
        const a = i.abs;
        const dx = a % 3 === 0 ? 1 : a % 3 === 1 ? -1 : 0;
        cy.x += dx * (+K.CylSpeed || 6);
        cy.st = 'ctrl';
        cy.facing = SO.sign(f.opp.x - cy.x) || cy.facing;
      } else {
        const tx = f.x - f.facing * 70;
        const sp = cy.st === 'return' ? 16 : 7;
        if (Math.abs(tx - cy.x) <= sp) { cy.x = tx; if (cy.st !== 'follow') cy.st = 'follow'; }
        else cy.x += SO.sign(tx - cy.x) * sp;
        cy.facing = SO.sign(f.opp.x - cy.x) || f.facing;
      }
      if (cy.y > 0 || cy.vy > 0) {
        cy.vy -= 1;
        cy.y += cy.vy;
        if (cy.y <= 0) { cy.y = 0; cy.vy = 0; }
      }
      cy.x = SO.clamp(cy.x, 60, C.STAGE_W - 60);
    },
    suppressMove(f) { return f.gim.cyl.ctrl; },
    blockThrow(f) { return f.gim.cyl.ctrl; },
    press(f, b, p) {
      const cy = f.gim.cyl;
      if (b === 'U') {
        if (STUNNED.has(f.state)) return { done: true };
        if (f.isAir()) { if (cy.st !== 'attack') startCyl(f, f.c.byId.CC_jU); return { done: true }; }
        if (p.rel <= 3) { if (cy.stun <= 0) cy.st = 'return'; return { done: true }; }
        return { done: true };
      }
      if (cy.ctrl && (b === 'L' || b === 'M' || b === 'H')) {
        if (cy.st !== 'attack') startCyl(f, f.c.byId['CC_CYL_' + b]);
        return { done: true };
      }
      return null;
    },
    puppet(f, id) {
      const cy = f.gim.cyl;
      if (cy.stun > 0) return;
      cy.x = f.x + f.facing * 20;
      cy.y = 0;
      startCyl(f, f.c.byId[id]);
      cy.facing = f.facing;
    },
    puppetHit(f) {
      const cy = f.gim.cyl;
      if (cy.st !== 'attack' || cy.stun > 0 || cy.hitstop > 0) return null;
      const m = cy.inst, t = cy.mf;
      if (t < m.su || t >= m.su + m.act || !m.d.hasHitbox) return null;
      const interval = Math.max(1, Math.ceil(m.act / m.hits));
      const idx = Math.min(m.hits - 1, Math.floor((t - m.su) / interval));
      if (idx <= cy.hitIdx) return null;
      return { box: { cx: cy.x + cy.facing * m.hb.x, cy: cy.y + m.hb.y, w: m.hb.w, h: m.hb.h }, idx, inst: m, x: cy.x, cyl: cy };
    },
    puppetHurt(f, box) {
      const cy = f.gim.cyl;
      if (cy.stun > 0) return false;
      return SO.overlap(box, { cx: cy.x, cy: cy.y + CYL_H / 2, w: CYL_W, h: CYL_H });
    },
    puppetStun(f) {
      const cy = f.gim.cyl;
      cy.stun = +cylKV(f).CylStun || 180;
      cy.st = 'stun';
      fx(f, { type: 'hit', x: cy.x, y: cy.y + 60, life: 14, size: 60, color: '#d2683a' });
      fx(f, { type: 'text', x: cy.x, y: cy.y + 170, text: 'CYLINDER DOWN', life: 40, color: '#d2683a' });
    },
    threat(f, target) {
      const cy = f.gim.cyl;
      return cy.st === 'attack' && Math.abs(cy.x - target.x) < 300;
    },
    hud(f) {
      const cy = f.gim.cyl;
      if (cy.stun > 0) return [{ text: 'CYLINDER ' + (cy.stun / 60).toFixed(1) + 's', color: '#888' }];
      return [{ text: cy.ctrl ? 'CYLINDER: CONTROL' : 'CYLINDER OK', color: '#d2683a' }];
    },
    draw(f, ctx, R) {
      const cy = f.gim.cyl;
      if (cy.stun > 0) {
        ctx.globalAlpha = 0.25;
      }
      const x = cy.x, y = -cy.y;
      let lean = 0;
      if (cy.st === 'attack' && cy.inst) {
        const m = cy.inst;
        if (cy.mf >= m.su && cy.mf < m.su + m.act) lean = 0.25 * cy.facing;
      }
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(lean);
      const col = f.idx === 1 && f.w.f[0].name === f.name ? R.shade('#b87333', -0.25) : '#b87333';
      R.sketchRect(ctx, -CYL_W / 2, -CYL_H, CYL_W, CYL_H, 500 + f.idx, { fill: col, stroke: '#2a2a2a', width: 4 });
      R.sketchEllipse(ctx, 0, -CYL_H, CYL_W / 2, 10, 510 + f.idx, { fill: R.shade(col, 0.25), stroke: '#2a2a2a', width: 3 });
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(cy.facing * 10, -CYL_H * 0.65, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cy.facing * 22, -CYL_H * 0.65, 4, 0, 7); ctx.fill();
      if (cy.ctrl) { ctx.strokeStyle = '#d2683a'; ctx.setLineDash([6, 6]); ctx.lineWidth = 3; ctx.strokeRect(-CYL_W / 2 - 8, -CYL_H - 8, CYL_W + 16, CYL_H + 16); ctx.setLineDash([]); }
      ctx.restore();
      ctx.globalAlpha = 1;
      // dây nối
      if (cy.stun <= 0) {
        ctx.strokeStyle = 'rgba(80,60,40,0.35)';
        ctx.setLineDash([4, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(f.x, -(f.y + f.c.h * 0.6)); ctx.lineTo(cy.x, -(cy.y + CYL_H * 0.8)); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (R.debug) {
        R.box(ctx, { cx: cy.x, cy: cy.y + CYL_H / 2, w: CYL_W, h: CYL_H }, 'rgba(40,90,255,0.25)', '#2a5aff');
        const ph = this.puppetHitBox(f);
        if (ph) R.box(ctx, ph, 'rgba(255,40,40,0.3)', '#f22');
      }
    },
    puppetHitBox(f) {
      const cy = f.gim.cyl;
      if (cy.st !== 'attack' || !cy.inst) return null;
      const m = cy.inst;
      if (cy.mf < m.su || cy.mf >= m.su + m.act) return null;
      return { cx: cy.x + cy.facing * m.hb.x, cy: cy.y + m.hb.y, w: m.hb.w, h: m.hb.h };
    },
  };
  S.control = function () {};
  S.recall = function (f) { if (f.gim.cyl) f.gim.cyl.st = 'return'; };

  // ================================================================ OCTAGON
  GIM.Octagon = {
    parry(def, att, c) {
      if (def.state !== 'attack' || !def.move || !def.move.d.kv.Parry) return false;
      const m = def.move, t = def.mf;
      if (t < m.su || t >= m.su + m.act) return false;
      const d = c.inst.d;
      if (d.type === 'Super' || d.type === 'Throw' || d.type === 'CmdGrab' || d.type === 'AirGrab') return false;
      const P = m.d.kv.Parry;
      let ok;
      if (P === 'HM') ok = !def.isAir() && d.blk !== 'Low';
      else if (P === 'LM') ok = !def.isAir() && d.blk !== 'High';
      else ok = def.isAir() || att.isAir();
      if (!ok) return false;
      const W = def.w;
      def.move = null;
      def.setState(def.isAir() ? 'air' : 'idle');
      def.invT = 4;
      def.hitstop = 12;
      const st = +m.d.kv.ParryStun || 30;
      if (c.type === 'strike') {
        att.move = null;
        if (att.isAir()) { att.setState('airhit'); att.kdType = 'Normal'; att.untech = st; att.vy = 4; att.vx = -att.facing * 2; att.y = Math.max(att.y, 1); }
        else { att.setState('hitstun'); att.stun = st; att.vx = 0; }
        att.hitstop = 12;
      } else if (c.type === 'puppet' && att.G.puppetStun) att.G.puppetStun(att);
      else if (c.proj) c.proj.dead = true;
      W.gain(def.idx, 5);
      W.fx.push({ type: 'stop', x: (def.x + (c.box ? c.box.cx : att.x)) / 2, y: c.box ? c.box.cy : def.y + 120, t: 0, life: 24 });
      W.fx.push({ type: 'text', x: def.x, y: def.y + 240, text: 'STOP!', t: 0, life: 40, color: '#c93a3a', big: true });
      return true;
    },
  };

  // ================================================================ SEMICIRCLE
  GIM.Semicircle = {
    init(f) { f.gim.stance = 'Flat'; f.gim.swap = 0; },
    kv(f) { return (f.c.byId.SC_U && f.c.byId.SC_U.kv) || {}; },
    update(f) { if (f.gim.swap > 0) f.gim.swap--; },
    press(f, b) {
      if (b !== 'U') return null;
      if (STUNNED.has(f.state)) return { done: true };
      f.gim.stance = f.gim.stance === 'Flat' ? 'Arc' : 'Flat';
      f.gim.swap = 18;
      fx(f, { type: 'ring', x: f.x, y: f.y + 85, life: 16, r: 95, color: f.gim.stance === 'Flat' ? '#4aa3d9' : '#ef6fae', thick: 6 });
      fx(f, { type: 'petals', x: f.x, y: f.y + 90, life: 22, color: f.gim.stance === 'Flat' ? '#4aa3d9' : '#ef6fae' });
      return { done: true };
    },
    walkMul(f) {
      const k = GIM.Semicircle.kv(f);
      return f.gim.stance === 'Flat' ? +k.FlatWalk || 0.85 : +k.ArcWalk || 1.25;
    },
    modify(f, inst) {
      if (!NORMAL_T.has(inst.d.type)) return;
      const k = GIM.Semicircle.kv(f);
      if (f.gim.stance === 'Flat') {
        const r = +k.FlatReach || 1.2;
        inst.hb.x *= r; inst.hb.w *= r;
        if (inst.d.btn === 'H') inst.armorLeft = Math.max(inst.armorLeft, 1);
      } else {
        inst.su = Math.max(1, inst.su - (+k.ArcFaster || 1));
        inst.dc = true;
      }
    },
    color(f) { return f.gim.stance === 'Flat' ? '#4aa3d9' : '#ef6fae'; },
    hud(f) { return [{ text: f.gim.stance === 'Flat' ? 'FLAT STANCE' : 'ARC STANCE', color: GIM.Semicircle.color(f) }]; },
  };
  S.stance = function () {};

  // ================================================================ STAR
  const EL_ORDER = { F: 0, I: 1, L: 2 };
  const EL_COLOR = { F: '#ec5b2b', I: '#5fc4ef', L: '#f5d020' };
  SO.EL_COLOR = EL_COLOR;
  const keyOf = (arr) => arr.slice().sort((a, b) => EL_ORDER[a] - EL_ORDER[b]).join('');
  GIM.Star = {
    init(f) { f.gim.el = []; f.gim.stock = null; },
    press(f, b, p) {
      if (b !== 'U') return null;
      const i = f.inp;
      if (i.motion('214', i.frame, i.frame - p.t + 4)) return null; // để 214U (Stock) xử lý
      let key = null, fromStock = false;
      if (f.gim.el.length) key = keyOf(f.gim.el);
      else if (f.gim.stock) { key = f.gim.stock; fromStock = true; }
      if (!key) return { done: true };
      const m = f.c.spells[key];
      if (!m) return { done: true };
      return { move: m, opts: { inst: { spellKey: key, fromStock } } };
    },
    frame(f, inst, t) {
      if (inst.d.type === 'Spell' && t === inst.su && !inst.consumed) {
        inst.consumed = true;
        if (inst.fromStock) f.gim.stock = null;
        else f.gim.el = [];
      }
    },
    onContact(f, inst) {
      const e = inst.d.kv.Element;
      if (e && inst.d.type !== 'Spell') {
        f.gim.el.push(e);
        if (f.gim.el.length > 3) f.gim.el.shift();
      }
    },
    gatling(f, cur, next) { return !f.chain.includes(next.id); },
    hud(f) {
      return [{ elements: f.gim.el.slice(), stock: f.gim.stock }];
    },
  };
  S.stock = function (f) {
    if (!f.gim.stock && f.gim.el.length) {
      f.gim.stock = keyOf(f.gim.el);
      f.gim.el = [];
      fx(f, { type: 'ring', x: f.x, y: f.y + 100, life: 16, r: 80, color: '#e8c228', thick: 5 });
      fx(f, { type: 'text', x: f.x, y: f.y + 230, text: 'STOCK', life: 30, color: '#b38f00' });
    }
  };
  S.overload = function (f) {
    f.gim.el = ['F', 'I', 'L'];
    fx(f, { type: 'ring', x: f.x, y: f.y + 100, life: 24, r: 160, color: '#e8c228', thick: 8 });
  };
  SO.spellKeyOf = keyOf;
})();

<script>/* js/render.js */
'use strict';
// =============================================================================
// SQUARED OFF - Render: phong cách nét chì / crayon rung (boiling line)
// =============================================================================
(function () {
  const SO = window.SO;
  const C = SO.CFG;
  const R = (SO.R = { debug: false, frameData: true, W: 1920, H: 1080, GROUND: 905, cam: { x: 440, scale: 1, offY: 0, init: false } });
  const FONT = '"Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive';
  R.FONT = FONT;
  const INK = '#2a2a2a';

  R.seed = 0; // đổi mỗi 6 frame => nét rung
  const jit = (i, s, a) => (SO.hash(i * 7 + 3, s) - 0.5) * 2 * a;

  R.shade = function (hex, amt) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map((x) => x + x).join('');
    let r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
    return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
  };

  // vẽ đa giác với nét rung
  R.sketchPoly = function (ctx, pts, seed, o) {
    o = o || {};
    const s = R.seed + seed * 13;
    const amp = o.amp === undefined ? 2.2 : o.amp;
    // chia nhỏ cạnh
    const sub = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const n = o.noSub ? 1 : Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 22));
      for (let k = 0; k < n; k++) sub.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
    }
    if (o.fill) {
      ctx.fillStyle = o.fill;
      ctx.beginPath();
      sub.forEach((p, i) => {
        const x = p[0] + jit(i, s + 5, amp * 0.6), y = p[1] + jit(i + 99, s + 5, amp * 0.6);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      if (o.hatch) R.hatch(ctx, sub, s, o.hatch);
    }
    if (o.stroke !== null) {
      ctx.strokeStyle = o.stroke || INK;
      ctx.lineWidth = o.width || 3.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      for (let pass = 0; pass < (o.passes || 2); pass++) {
        ctx.beginPath();
        sub.forEach((p, i) => {
          const x = p[0] + jit(i, s + pass * 31, amp), y = p[1] + jit(i + 57, s + pass * 31, amp);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.closePath();
        ctx.globalAlpha *= pass ? 0.55 : 1;
        ctx.stroke();
        if (pass) ctx.globalAlpha /= 0.55;
      }
    }
  };
  R.hatch = function (ctx, pts, s, color) {
    let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
    pts.forEach((p) => { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    ctx.save();
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha *= 0.35;
    ctx.beginPath();
    for (let x = minx - (maxy - miny); x < maxx; x += 11) {
      ctx.moveTo(x + jit(x, s, 2), maxy);
      ctx.lineTo(x + (maxy - miny) + jit(x + 1, s, 2), miny);
    }
    ctx.stroke();
    ctx.restore();
  };
  R.sketchEllipse = function (ctx, cx, cy, rx, ry, seed, o) {
    const pts = [];
    const n = Math.max(14, Math.round((rx + ry) / 6));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    R.sketchPoly(ctx, pts, seed, Object.assign({ noSub: true }, o));
  };
  R.sketchRect = function (ctx, x, y, w, h, seed, o) {
    R.sketchPoly(ctx, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], seed, o);
  };
  R.sketchLine = function (ctx, x1, y1, x2, y2, seed, o) {
    o = o || {};
    const s = R.seed + seed * 17;
    const n = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 18));
    ctx.strokeStyle = o.stroke || INK;
    ctx.lineWidth = o.width || 4;
    ctx.lineCap = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let k = 0; k <= n; k++) {
        const x = x1 + ((x2 - x1) * k) / n + (k && k < n ? jit(k, s + pass * 9, 2.2) : jit(k, s, 0.8));
        const y = y1 + ((y2 - y1) * k) / n + (k && k < n ? jit(k + 40, s + pass * 9, 2.2) : jit(k + 3, s, 0.8));
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.globalAlpha *= pass ? 0.5 : 1;
      ctx.stroke();
      if (pass) ctx.globalAlpha /= 0.5;
    }
  };
  // đường gấp khúc (tay/chân) qua khớp
  R.limb = function (ctx, pts, seed, o) {
    for (let i = 0; i + 1 < pts.length; i++) R.sketchLine(ctx, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], seed + i * 3, o);
  };

  R.shapePoints = function (shape, w, h, extra) {
    const pts = [];
    const poly = (n, rot) => {
      for (let i = 0; i < n; i++) {
        const a = rot + (i / n) * Math.PI * 2;
        pts.push([Math.cos(a) * w / 2, Math.sin(a) * h / 2]);
      }
    };
    switch (shape) {
      case 'circle': case 'oval': poly(26, 0); break;
      case 'square': pts.push([-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]); break;
      case 'triangle': pts.push([0, -h / 2 - 6], [w / 2 + 4, h / 2], [-w / 2 - 4, h / 2]); break;
      case 'cone': pts.push([0, -h / 2 - 10], [w / 2, h / 2], [-w / 2, h / 2]); break;
      case 'rhombus': pts.push([0, -h / 2 - 6], [w / 2 + 6, 0], [0, h / 2 + 6], [-w / 2 - 6, 0]); break;
      case 'hexagon': poly(6, 0); break;
      case 'octagon': poly(8, Math.PI / 8); break;
      case 'star':
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + (i / 10) * Math.PI * 2, r = i % 2 ? 0.45 : 1;
          pts.push([Math.cos(a) * w / 2 * r * 1.12, Math.sin(a) * h / 2 * r * 1.12 + 4]);
        }
        break;
      case 'semicircle': {
        const flatDown = extra !== 'Arc';
        for (let i = 0; i <= 14; i++) {
          const a = Math.PI + (i / 14) * Math.PI;
          pts.push([Math.cos(a) * w / 2, (flatDown ? h / 4 : -h / 4) + Math.sin(a) * h * 0.75 * (flatDown ? 1 : -1)]);
        }
        break;
      }
      default: poly(20, 0);
    }
    return pts;
  };

  R.box = function (ctx, b, fill, stroke) {
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.fillRect(b.cx - b.w / 2, -(b.cy + b.h / 2), b.w, b.h);
    ctx.strokeRect(b.cx - b.w / 2, -(b.cy + b.h / 2), b.w, b.h);
  };

  // ------------------------------------------------------------------ camera
  R.updateCam = function (W) {
    const [a, b] = W.f;
    const mid = (a.x + b.x) / 2;
    let viewW = C.VIEW_W; // zoom cố định (chỉ zoom vào khi counter hit H)
    let zx = null, zy = 0;
    if (W.chZoom) {
      const z = W.chZoom, k = Math.sin(Math.min(1, z.t / z.life) * Math.PI);
      viewW = C.VIEW_W / (1 + 0.32 * Math.min(1, k * 1.6));
      zx = z.x; zy = 0;
    }
    const scale = R.W / viewW;
    const cx = zx === null ? mid : mid + (zx - mid) * 0.7;
    const camX = SO.clamp(cx - viewW / 2, 0, C.STAGE_W - viewW);
    const top = Math.max(a.y + a.c.h, b.y + b.c.h);
    // chỉ nâng camera khi nhân vật bay cao gần chạm HUD
    // camera nâng lên khi có người bay cao, nhưng người đứng dưới đất vẫn phải thấy phần lớn thân
    const sc0 = R.W / C.VIEW_W;
    const low = a.y < b.y ? a : b;
    const maxOff = (R.H - R.GROUND) / sc0 + Math.max(0, low.y) + low.c.h * 0.3;
    const offY = Math.min(maxOff, Math.max(0, top - (R.GROUND - 190) / sc0)) + zy;
    const cam = R.cam;
    if (!cam.init) { cam.x = camX; cam.scale = scale; cam.offY = offY; cam.init = true; }
    cam.x = camX;
    cam.scale = scale;
    cam.offY += (offY - cam.offY) * 0.15;
    // cố định trong biên
    const vw = R.W / cam.scale;
    cam.x = SO.clamp(cam.x, 0, C.STAGE_W - vw);
  };
  R.worldTransform = function (ctx, shake) {
    const cam = R.cam;
    const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.setTransform(cam.scale, 0, 0, cam.scale, -cam.x * cam.scale + sx, R.GROUND + cam.offY * cam.scale + sy);
  };

  // ------------------------------------------------------------------ background
  R.drawPaper = function (ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#f6f1e3';
    ctx.fillRect(0, 0, R.W, R.H);
    ctx.strokeStyle = 'rgba(80,130,200,0.18)';
    ctx.lineWidth = 2;
    for (let y = 70; y < R.H; y += 46) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(R.W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(220,80,80,0.25)';
    ctx.beginPath(); ctx.moveTo(130, 0); ctx.lineTo(130, R.H); ctx.stroke();
  };
  R.drawStage = function (ctx, W) {
    const cam = R.cam;
    // parallax doodles
    ctx.save();
    ctx.setTransform(cam.scale, 0, 0, cam.scale, -cam.x * cam.scale * 0.4, R.GROUND + cam.offY * cam.scale);
    ctx.globalAlpha = 0.55;
    // mặt trời
    R.sketchEllipse(ctx, 900, -720, 70, 70, 1, { stroke: '#e0a020', width: 4, fill: 'rgba(255,214,90,0.35)' });
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + W.frame * 0.002;
      R.sketchLine(ctx, 900 + Math.cos(a) * 95, -720 + Math.sin(a) * 95, 900 + Math.cos(a) * 125, -720 + Math.sin(a) * 125, 5 + i, { stroke: '#e0a020', width: 3 });
    }
    // núi
    R.sketchPoly(ctx, [[-200, 0], [250, -330], [600, 0]], 2, { stroke: '#7a8b9a', width: 3, fill: 'rgba(160,180,200,0.25)' });
    R.sketchPoly(ctx, [[400, 0], [800, -260], [1150, 0]], 3, { stroke: '#7a8b9a', width: 3, fill: 'rgba(160,180,200,0.2)' });
    R.sketchPoly(ctx, [[1300, 0], [1700, -380], [2100, 0]], 4, { stroke: '#7a8b9a', width: 3, fill: 'rgba(160,180,200,0.22)' });
    // mây
    for (const [cx, cy, s] of [[200, -600, 1], [1450, -680, 1.3], [2000, -560, 0.9]]) {
      const x = cx + ((W.frame * 0.15 * s) % 400);
      R.sketchEllipse(ctx, x, cy, 70 * s, 30 * s, 8, { stroke: '#8aa', width: 3, fill: 'rgba(255,255,255,0.6)' });
      R.sketchEllipse(ctx, x + 50 * s, cy - 18 * s, 50 * s, 28 * s, 9, { stroke: '#8aa', width: 3, fill: 'rgba(255,255,255,0.6)' });
    }
    ctx.restore();
    // mặt đất
    R.worldTransform(ctx, W.shake);
    ctx.fillStyle = 'rgba(120,170,90,0.18)';
    ctx.fillRect(-100, 0, C.STAGE_W + 200, 400);
    R.sketchLine(ctx, -50, 0, C.STAGE_W + 50, 0, 11, { stroke: '#4c6b3c', width: 5 });
    for (let x = 40; x < C.STAGE_W; x += 90) {
      const h = 10 + SO.hash(x, 3) * 14;
      R.sketchLine(ctx, x, 0, x - 6, -h, x, { stroke: '#5b8a46', width: 2.5 });
      R.sketchLine(ctx, x + 8, 0, x + 12, -h * 0.8, x + 1, { stroke: '#5b8a46', width: 2.5 });
    }
    // tường hai bên
    for (const wx of [80, C.STAGE_W - 80]) {
      R.sketchRect(ctx, wx - (wx < 100 ? 70 : 0), -900, 70, 900, wx, { fill: 'rgba(150,120,90,0.25)', stroke: '#6b5440', width: 4, hatch: '#6b5440' });
    }
  };

  // ------------------------------------------------------------------ fighters
  function fighterColor(f) {
    let col = f.c.color;
    if (f.G && f.G.color) col = f.G.color(f);
    if (f.idx === 1 && f.w.f[0].name === f.name) col = R.shade(col, -0.3);
    return col;
  }
  R.fighterColor = fighterColor;

  function pose(f) {
    const c = f.c, s = f.state, W = f.w;
    const P = {
      crouch: f.isCrouchPose() ? 1 : 0, lean: 0, lying: false, armT: null, legT: null, tuck: 0,
      hurt: false, guard: false, walk: 0, rot: 0, squash: 1,
    };
    if (s === 'walk' || s === 'dash') P.walk = W.frame * (s === 'dash' ? 0.45 : 0.22);
    if (s === 'idle') P.squash = 1 + Math.sin(W.frame * 0.08 + f.idx) * 0.02;
    if (s === 'prejump' || s === 'land') { P.crouch = 0.5; }
    if (s === 'air' || s === 'airdash' || (s === 'attack' && f.moveAir)) P.tuck = 1;
    if (s === 'airdash') P.lean = 0.35;
    if (s === 'hitstun' || s === 'airhit' || s === 'thrown' || s === 'recoil') { P.hurt = true; P.lean = -0.3; }
    if (s === 'airhit') P.rot = -0.6 * f.facing + Math.sin(f.sf * 0.2) * 0.2;
    if (s === 'knockdown' || s === 'wakeup' || (s === 'ko' && f.y <= 1)) {
      P.lying = true;
      if (s === 'wakeup') P.lyingT = f.sf / C.WAKEUP;
    }
    if (s === 'block' || f.guard) P.guard = true;
    if (s === 'backdash') P.lean = -0.25;
    if (s === 'dash') P.lean = 0.25;
    if (s === 'throwing') P.armT = { x: f.facing * (c.w * 0.75), y: c.h * 0.55 };
    if (s === 'attack' && f.move) {
      const m = f.move, t = f.mf;
      const hb = m.hb;
      if (m.d.hasHitbox && !m.d.isProj && hb.w > 0) {
        let k;
        if (t < m.su) k = t / m.su;
        else if (t < m.su + m.act) k = 1;
        else k = Math.max(0, 1 - (t - m.su - m.act) / Math.max(1, m.rec * 0.7));
        const tx = f.facing * (hb.x + hb.w * 0.35), ty = hb.y;
        const kick = hb.y < c.h * 0.42 || (m.d.btn === 'H' && f.moveAir && hb.y < c.h * 0.6);
        if (kick && !(R.WEAPONS[c.weapon] && (R.WEAPONS[c.weapon].blade || R.WEAPONS[c.weapon].pole) && m.d.btn !== 'L' && hb.y > 30)) P.legT = { x: tx, y: ty, k };
        else P.armT = { x: tx, y: ty, k, hit: true };
        P.lean = 0.18 * k * (hb.y > c.h ? -1 : 1);
      } else if (m.d.isProj || m.d.type === 'Spell' || m.d.kv.Detonate || m.d.type === 'Unique') {
        const k = t < m.su ? t / m.su : Math.max(0, 1 - (t - m.su) / Math.max(1, m.rec));
        P.armT = { x: f.facing * c.w * 0.85, y: c.h * 0.62, k };
      }
      if (m.d.vel.length && m.d.vel.some((v) => v.vy > 0) && t >= m.su) P.armT = { x: f.facing * c.w * 0.3, y: c.h * 1.15, k: 1 };
    }
    return P;
  }

  // ------------------------------------------------------------------ vũ khí
  // len = chiều dài lưỡi/cán (px), idle = góc cầm khi đứng yên (rad, âm = chĩa lên trước)
  R.WEAPONS = {
    greatsword: { blade: true, len: 175, w: 30, twoHand: true, color: '#c9d1d8', idle: -1.0, grip: 30, restA: Math.PI + 0.55, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.36, shY - 8] }) },
    longsword: { blade: true, len: 140, w: 17, color: '#d6dde3', idle: -1.15, grip: 22, twoHand: true, restA: -0.5, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.62, shY + 22] }) },
    katana: { blade: true, len: 132, w: 11, curve: 0.12, color: '#e7ecf0', idle: -1.25, grip: 26, restA: 0.32, revA: 2.6, rest: (bx, shY, bw, fc, f) => (f.gim.stance === 'Arc' ? { front: [bx + fc * bw * 0.55, shY + 6], back: [bx - fc * bw * 0.1, shY - 22] } : { front: [bx + fc * bw * 0.5, shY + 34], back: [bx + fc * bw * 0.2, shY + 30] }) },
    dual_blades: { blade: true, len: 74, w: 13, dual: true, color: '#dfe5ea', idle: -0.55, grip: 14, restA: 0.65, backA: -2.3, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.58, shY + 26], back: [bx - fc * bw * 0.05, shY - 26] }) },
    staff: { pole: true, len: 185, color: '#8a6a45', idle: -1.42, tipKind: 'hex', restA: -1.62, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.62, shY + 12] }) },
    stop_sign: { pole: true, len: 160, color: '#9aa1a8', idle: -1.42, tipKind: 'stop', restA: Math.PI + 0.95, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.34, shY - 6], back: [bx + fc * bw * 0.05, shY + 30] }) },
    knuckles: { gloves: true, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.64, shY - 26], back: [bx + fc * bw * 0.3, shY - 40] }) },
    spellbook: { book: true, rest: (bx, shY, bw, fc) => ({ back: [bx - fc * bw * 0.4, shY + 4], front: [bx + fc * bw * 0.6, shY + 6] }) },
    slingshot: { sling: true, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.66, shY - 8] }) },
    marionette: { cross: true, rest: (bx, shY, bw, fc) => ({ front: [bx + fc * bw * 0.5, shY - 62] }) },
  };

  R.weaponPose = function (w, WP) {
    const f = w.f, fc = w.fc, h = w.front.hand;
    const rev = f.c.weapon === 'katana' && f.gim && f.gim.stance === 'Arc';
    const pose = f.state === 'attack' && f.move ? f.move.d.kv.Pose : null;
    let ang;
    if (pose === 'pommel') {
      // đánh bằng chuôi: lưỡi kiếm cầm ngược, nằm dọc cánh tay chĩa ra sau
      ang = fc > 0 ? Math.PI + 0.55 : -0.55;
    } else if (pose === 'raise') {
      ang = -Math.PI / 2 + fc * 0.08;
    } else if (w.target && pose === 'reverse') {
      // cầm ngược: lưỡi quét từ sau ra trước theo tiến độ đòn
      ang = Math.atan2(w.target.y - h[1], w.target.x - h[0]) + fc * 1.4 * (1 - w.target.k);
    } else if (w.target) {
      ang = Math.atan2(w.target.y - h[1], w.target.x - h[0]);
      // cầm ngược: lưỡi xoay từ phía sau ra trước theo tiến độ đòn
      if (rev && w.target.k < 1) ang += fc * 2.4 * (1 - w.target.k);
    } else if (w.P.lying) ang = fc > 0 ? 0.2 : Math.PI - 0.2;
    else if (w.P.hurt) ang = fc > 0 ? 2.5 : Math.PI - 2.5;
    else {
      let a = (rev ? WP.revA : WP.restA) ?? WP.idle ?? -1;
      if (w.P.guard) a = rev ? 1.6 : -1.5;
      if (w.P.crouch && Math.abs(a) < 1.7) a += 0.3;
      if (f.state === 'attack' && f.move && !w.target) a = rev ? 1.2 : -0.35; // chiêu không có hitbox (cast, lao...)
      ang = fc > 0 ? a : Math.PI - a;
    }
    const len = WP.len || 0;
    return { ang, base: h, tip: [h[0] + Math.cos(ang) * len, h[1] + Math.sin(ang) * len] };
  };

  function bladePoly(h, ang, len, wd, grip, curve) {
    const ca = Math.cos(ang), sa = Math.sin(ang), px = -sa, py = ca;
    const pts = [];
    const N = 8;
    for (let i = 0; i <= N; i++) {
      const t = i / N, wd2 = wd * (i === N ? 0 : 1 - t * 0.25) * 0.5;
      const bend = curve ? Math.sin(t * Math.PI * 0.5) * curve * len : 0;
      pts.push([h[0] + ca * len * t + px * (wd2 + bend), h[1] + sa * len * t + py * (wd2 + bend)]);
    }
    for (let i = N - 1; i >= 0; i--) {
      const t = i / N, wd2 = wd * (1 - t * 0.25) * 0.5;
      const bend = curve ? Math.sin(t * Math.PI * 0.5) * curve * len : 0;
      pts.push([h[0] + ca * len * t + px * (-wd2 + bend), h[1] + sa * len * t + py * (-wd2 + bend)]);
    }
    return pts;
  }
  function drawBlade(ctx, h, ang, WP, colBlade, ink, seed, scale) {
    scale = scale || 1;
    const len = WP.len * scale, wd = WP.w * scale, ca = Math.cos(ang), sa = Math.sin(ang);
    // chuôi
    R.sketchLine(ctx, h[0] - ca * WP.grip, h[1] - sa * WP.grip, h[0], h[1], seed + 1, { stroke: '#3a2a1e', width: Math.max(6, wd * 0.45) });
    // lưỡi
    R.sketchPoly(ctx, bladePoly([h[0] + ca * 6, h[1] + sa * 6], ang, len, wd, 0, WP.curve), seed, { fill: colBlade, stroke: ink, width: 3, noSub: true, amp: 1.1 });
    // đường gân lưỡi
    ctx.strokeStyle = 'rgba(80,90,100,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(h[0] + ca * 14, h[1] + sa * 14); ctx.lineTo(h[0] + ca * len * 0.8, h[1] + sa * len * 0.8); ctx.stroke();
    // chắn tay
    const px = -sa, py = ca, gw = Math.max(16, wd * 1.3);
    R.sketchLine(ctx, h[0] + px * gw, h[1] + py * gw, h[0] - px * gw, h[1] - py * gw, seed + 2, { stroke: ink, width: 6 });
  }

  R.drawWeapon = function (ctx, w, WP, layer, wt) {
    const ghost = w.ghost, ink = ghost ? w.ink : INK;
    const seed = 600 + w.f.idx * 40;
    const metal = (c) => (ghost ? w.col : c);
    const f = w.f, fc = w.fc;
    if (WP.blade) {
      if (layer === 'back' && WP.dual) {
        const h = w.back.hand;
        const ba = WP.backA ?? -0.2;
        const a = w.target ? wt.ang + fc * 0.5 : w.P.guard ? (fc > 0 ? -1.2 : Math.PI + 1.2) : fc > 0 ? ba : Math.PI - ba;
        drawBlade(ctx, h, a, WP, metal(WP.color), ink, seed + 10);
      }
      if (layer === 'front') {
        const bc = (f.G && f.G.weaponColor && f.G.weaponColor(f)) || WP.color;
        drawBlade(ctx, wt.base, wt.ang, WP, metal(bc), ink, seed);
        // kiếm bốc lửa (SwordFire) khi đang ra chiêu lửa, hoặc có token / Dragon Install
        const swordFire = !ghost && ((f.state === 'attack' && f.move && f.move.d.tags.has('SwordFire')) || (f.gim && (f.gim.token || f.gim.di)));
        if (swordFire && SO.emit && f.w.parts) {
          for (let i = 0; i < 2; i++) {
            const t = 0.3 + Math.random() * 0.7;
            const px = wt.base[0] + Math.cos(wt.ang) * WP.len * t, py = wt.base[1] + Math.sin(wt.ang) * WP.len * t;
            // tọa độ local -> world
            if (f.w.frame % 2 === i) SO.emit(f.w, 'flame', f.x + px, f.y - py, { vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, life: 12, size: 10 + Math.random() * 10 });
          }
        }
      }
      return;
    }
    if (WP.pole && layer === 'front') {
      const h = wt.base, ca = Math.cos(wt.ang), sa = Math.sin(wt.ang);
      const b0 = [h[0] - ca * WP.len * 0.3, h[1] - sa * WP.len * 0.3];
      R.sketchLine(ctx, b0[0], b0[1], wt.tip[0], wt.tip[1], seed, { stroke: metal(WP.color), width: 9 });
      R.sketchLine(ctx, b0[0], b0[1], wt.tip[0], wt.tip[1], seed + 1, { stroke: ink, width: 2 });
      const tx = wt.tip[0], ty = wt.tip[1];
      if (WP.tipKind === 'stop') {
        const pts = [];
        for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + (i / 8) * Math.PI * 2; pts.push([tx + Math.cos(a) * 32, ty + Math.sin(a) * 32]); }
        R.sketchPoly(ctx, pts, seed + 2, { fill: ghost ? w.col : '#d23a32', stroke: ghost ? ink : '#fff', width: 4, noSub: true, amp: 1 });
        if (!ghost) {
          ctx.fillStyle = '#fff'; ctx.font = 'bold 17px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('STOP', tx, ty + 6);
        }
      } else {
        const pts = [];
        for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; pts.push([tx + Math.cos(a) * 20, ty + Math.sin(a) * 20]); }
        if (!ghost && f.state === 'attack') { ctx.globalAlpha *= 0.4; R.sketchEllipse(ctx, tx, ty, 34, 34, seed + 5, { fill: '#7ff0c0', stroke: null }); ctx.globalAlpha /= 0.4; }
        R.sketchPoly(ctx, pts, seed + 3, { fill: ghost ? w.col : '#bdf0d8', stroke: ghost ? ink : '#1f7a58', width: 4, noSub: true, amp: 1 });
      }
      return;
    }
    if (WP.gloves && layer === 'hand') {
      for (const arm of [w.back, w.front]) {
        const [x, y] = arm.hand;
        const r = f.c.w * 0.17;
        R.sketchEllipse(ctx, x, y, r * 1.15, r, seed + (arm === w.front ? 7 : 8), { fill: ghost ? w.col : '#d8a62a', stroke: ink, width: 4, hatch: ghost ? null : '#8a6410' });
        if (!ghost) {
          ctx.fillStyle = '#5b4a3a';
          for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(x + fc * r * 0.8, y + i * r * 0.5, 4.5, 0, 7); ctx.fill(); }
        }
      }
      return;
    }
